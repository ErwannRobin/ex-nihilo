<script type="x-shader" data-name="lib">
// ============================================================================
// EX NIHILO — shared GLSL prelude. Prepended to every scene.
// Every scene must define:   vec3 renderScene(vec2 fragCoord)
// returning LINEAR HDR radiance (values > 1 are fine; post does bloom + ACES).
// ============================================================================
precision highp float;
precision highp int;

uniform vec2  uRes;      // output resolution (px)
uniform float uTime;     // global time (s)
uniform float uLocal;    // time since this scene started (s). May be slightly <0 or >uDur around cuts.
uniform float uDur;      // scene duration (s)
uniform float uProg;     // clamp(uLocal/uDur, 0, 1)
uniform float uBeat;     // global beat position (120 bpm -> 2 beats per second)
uniform float uBar;      // global bar position (4 beats per bar -> 1 bar = 2 s)
uniform float uKick;     // kick envelope: 1.0 on the hit, exponential decay
uniform float uSnare;    // snare/clap envelope
uniform float uHat;      // hi-hat envelope
uniform float uBass;     // bass-note envelope
uniform float uImpact;   // big accents (section downbeats, crashes), slower decay
uniform float uRiser;    // 0..1 ramp during build-ups, 0 otherwise
uniform float uEnergy;   // smooth overall musical intensity 0..1
uniform vec2  uJitter;   // sub-pixel AA offset in px (already added to fragCoord)
uniform vec4  uSample;   // per-subframe low-discrepancy randoms in [0,1): xy = lens/area sample, zw = misc
uniform float uFrame;    // output frame index
uniform float uSubframe; // subframe index inside this frame (0..spp-1)

#define PI  3.14159265359
#define TAU 6.28318530718

float sat(float x) { return clamp(x, 0.0, 1.0); }
vec3  sat(vec3 x)  { return clamp(x, 0.0, 1.0); }
float sq(float x)  { return x * x; }
float remap(float x, float a, float b, float c, float d) { return c + (d - c) * (x - a) / (b - a); }
float remapc(float x, float a, float b, float c, float d) { return c + (d - c) * sat((x - a) / (b - a)); }
float easeInOut(float x) { x = sat(x); return x * x * (3.0 - 2.0 * x); }
float easeOutCubic(float x) { x = sat(x); return 1.0 - pow(1.0 - x, 3.0); }
float easeInCubic(float x) { x = sat(x); return x * x * x; }
float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

// Screen coordinates: y in [-1, 1], x scaled by aspect. Center = 0.
vec2 screenUV(vec2 fragCoord) { return (2.0 * fragCoord - uRes) / uRes.y; }

// ---------------------------------------------------------------- hashes
// "Hash without Sine" (Dave Hoskins) — stable across GPUs.
float hash11(float p) { p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3) { p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec2  hash21(float p) { vec3 p3 = fract(vec3(p) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
vec2  hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
vec3  hash31(float p) { vec3 p3 = fract(vec3(p) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
vec3  hash32(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
vec3  hash33(vec3 p3) { p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }

// Per-pixel, per-subframe random in [0,1). Use for ray-start dithering etc.;
// the accumulation buffer turns it into smooth noise-free results offline.
float pixelRand(vec2 fragCoord) { return hash12(fragCoord + uSample.zw * 1731.0 + uFrame * 0.618); }

// ---------------------------------------------------------------- noise
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x),
             mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float vnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i + vec3(0, 0, 0)), hash13(i + vec3(1, 0, 0)), u.x),
                 mix(hash13(i + vec3(0, 1, 0)), hash13(i + vec3(1, 1, 0)), u.x), u.y),
             mix(mix(hash13(i + vec3(0, 0, 1)), hash13(i + vec3(1, 0, 1)), u.x),
                 mix(hash13(i + vec3(0, 1, 1)), hash13(i + vec3(1, 1, 1)), u.x), u.y), u.z);
}
// Gradient noise in [-1,1] (IQ).
float gnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  #define GN_G(o) (hash33(i + o) * 2.0 - 1.0)
  float n000 = dot(GN_G(vec3(0, 0, 0)), f - vec3(0, 0, 0));
  float n100 = dot(GN_G(vec3(1, 0, 0)), f - vec3(1, 0, 0));
  float n010 = dot(GN_G(vec3(0, 1, 0)), f - vec3(0, 1, 0));
  float n110 = dot(GN_G(vec3(1, 1, 0)), f - vec3(1, 1, 0));
  float n001 = dot(GN_G(vec3(0, 0, 1)), f - vec3(0, 0, 1));
  float n101 = dot(GN_G(vec3(1, 0, 1)), f - vec3(1, 0, 1));
  float n011 = dot(GN_G(vec3(0, 1, 1)), f - vec3(0, 1, 1));
  float n111 = dot(GN_G(vec3(1, 1, 1)), f - vec3(1, 1, 1));
  #undef GN_G
  return mix(mix(mix(n000, n100, u.x), mix(n010, n110, u.x), u.y),
             mix(mix(n001, n101, u.x), mix(n011, n111, u.x), u.y), u.z);
}
// fBm helpers. Octave counts are runtime ints (GLSL ES 3.0 allows it).
float fbm(vec2 p, int oct) {
  float a = 0.5, s = 0.0;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 12; i++) { if (i >= oct) break; s += a * vnoise(p); p = m * p; a *= 0.5; }
  return s;
}
float fbm(vec3 p, int oct) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 12; i++) { if (i >= oct) break; s += a * vnoise(p); p = p * 2.03 + vec3(17.1, 3.7, 9.3); a *= 0.5; }
  return s;
}

// ---------------------------------------------------------------- transforms
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); } // p.xy *= rot(a)
mat3 rotX(float a) { float c = cos(a), s = sin(a); return mat3(1, 0, 0, 0, c, s, 0, -s, c); }
mat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0, -s, 0, 1, 0, s, 0, c); }
mat3 rotZ(float a) { float c = cos(a), s = sin(a); return mat3(c, s, 0, -s, c, 0, 0, 0, 1); }
mat3 rotAxis(vec3 k, float a) {
  k = normalize(k); float c = cos(a), s = sin(a), t = 1.0 - c;
  return mat3(t * k.x * k.x + c,       t * k.x * k.y + s * k.z, t * k.x * k.z - s * k.y,
              t * k.x * k.y - s * k.z, t * k.y * k.y + c,       t * k.y * k.z + s * k.x,
              t * k.x * k.z + s * k.y, t * k.y * k.z - s * k.x, t * k.z * k.z + c);
}

// ---------------------------------------------------------------- camera
// Returns camera basis (columns: right, up, forward). rd = cam * normalize(vec3(uv, focal)).
mat3 lookAt(vec3 ro, vec3 ta, float roll) {
  vec3 cw = normalize(ta - ro);
  vec3 cp = vec3(sin(roll), cos(roll), 0.0);
  vec3 cu = normalize(cross(cw, cp));
  vec3 cv = cross(cu, cw);
  return mat3(cu, cv, cw);
}
// Uniform disk sample from the per-subframe lens sample (for depth of field).
vec2 lensSample() { float r = sqrt(uSample.x), a = TAU * uSample.y; return r * vec2(cos(a), sin(a)); }
// Thin-lens depth of field: perturbs ro/rd so that points at focusDist stay sharp.
// Free in the offline render (spp accumulation); a no-op look at spp=1.
void thinLens(inout vec3 ro, inout vec3 rd, mat3 cam, float focusDist, float aperture) {
  vec3 fp = ro + rd * focusDist;
  vec2 l = lensSample() * aperture;
  ro += cam[0] * l.x + cam[1] * l.y;
  rd = normalize(fp - ro);
}

// ---------------------------------------------------------------- SDF toolkit
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float smax(float a, float b, float k) { return -smin(-a, -b, k); }
float sdSphere(vec3 p, float r) { return length(p) - r; }
float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
float sdRoundBox(vec3 p, vec3 b, float r) { vec3 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r; }
float sdBox2(vec2 p, vec2 b) { vec2 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }
float sdTorus(vec3 p, vec2 t) { vec2 q = vec2(length(p.xz) - t.x, p.y); return length(q) - t.y; }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = sat(dot(pa, ba) / dot(ba, ba)); return length(pa - ba * h) - r; }
float sdCylinder(vec3 p, float h, float r) { vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h); return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)); }
float sdOctahedron(vec3 p, float s) { p = abs(p); return (p.x + p.y + p.z - s) * 0.57735027; }

// ---------------------------------------------------------------- color
vec3 cosPalette(float t, vec3 a, vec3 b, vec3 c, vec3 d) { return a + b * cos(TAU * (c * t + d)); }
// Approximate blackbody color (normalized, linear) for 1000K..40000K.
vec3 blackbody(float k) {
  float t = k / 100.0;
  vec3 c;
  c.r = t <= 66.0 ? 1.0 : 1.2929 * pow(t - 60.0, -0.1332);
  c.g = t <= 66.0 ? 0.3901 * log(t) - 0.6318 : 1.1298 * pow(t - 60.0, -0.0755);
  c.b = t >= 66.0 ? 1.0 : (t <= 19.0 ? 0.0 : 0.5432 * log(t - 10.0) - 1.1963);
  return pow(sat(c), vec3(2.2)); // the fit is in display space; convert to linear
}
</script>
<script type="x-shader" data-name="post">
//@@ downsample
// 13-tap downsample (Jimenez, "Next Generation Post Processing in Call of Duty: AW").
// First pass uses a Karis average to kill fireflies.
precision highp float;
uniform sampler2D uSrc;
uniform vec2 uSrcTexel;
uniform vec2 uDstRes;
uniform float uKaris;
out vec4 o;
vec3 S(vec2 uv) { return texture(uSrc, uv).rgb; }
float kw(vec3 c) { return 1.0 / (1.0 + dot(c, vec3(0.2126, 0.7152, 0.0722))); }
void main() {
  vec2 uv = gl_FragCoord.xy / uDstRes;
  vec2 t = uSrcTexel;
  vec3 a = S(uv + t * vec2(-2, 2)), b = S(uv + t * vec2(0, 2)), c = S(uv + t * vec2(2, 2));
  vec3 d = S(uv + t * vec2(-2, 0)), e = S(uv),                  f = S(uv + t * vec2(2, 0));
  vec3 g = S(uv + t * vec2(-2, -2)), h = S(uv + t * vec2(0, -2)), i = S(uv + t * vec2(2, -2));
  vec3 j = S(uv + t * vec2(-1, 1)), k = S(uv + t * vec2(1, 1));
  vec3 l = S(uv + t * vec2(-1, -1)), m = S(uv + t * vec2(1, -1));
  vec3 r;
  if (uKaris > 0.5) {
    vec3 g0 = (a + b + d + e) * 0.25, g1 = (b + c + e + f) * 0.25;
    vec3 g2 = (d + e + g + h) * 0.25, g3 = (e + f + h + i) * 0.25;
    vec3 g4 = (j + k + l + m) * 0.25;
    float w0 = kw(g0), w1 = kw(g1), w2 = kw(g2), w3 = kw(g3), w4 = kw(g4);
    r = (g0 * w0 * 0.125 + g1 * w1 * 0.125 + g2 * w2 * 0.125 + g3 * w3 * 0.125 + g4 * w4 * 0.5) /
        (w0 * 0.125 + w1 * 0.125 + w2 * 0.125 + w3 * 0.125 + w4 * 0.5);
  } else {
    r = e * 0.125 + (a + c + g + i) * 0.03125 + (b + d + f + h) * 0.0625 + (j + k + l + m) * 0.125;
  }
  o = vec4(max(r, 0.0), 1.0);
}

//@@ upsample
// 9-tap tent upsample, additively blended onto the next-larger mip.
precision highp float;
uniform sampler2D uSrc;
uniform vec2 uSrcTexel;
uniform vec2 uDstRes;
uniform float uRadius;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uDstRes;
  vec2 t = uSrcTexel * uRadius;
  vec3 s = texture(uSrc, uv).rgb * 4.0;
  s += (texture(uSrc, uv + vec2(-t.x, 0)).rgb + texture(uSrc, uv + vec2(t.x, 0)).rgb +
        texture(uSrc, uv + vec2(0, -t.y)).rgb + texture(uSrc, uv + vec2(0, t.y)).rgb) * 2.0;
  s += texture(uSrc, uv + vec2(-t.x, -t.y)).rgb + texture(uSrc, uv + vec2(t.x, -t.y)).rgb +
       texture(uSrc, uv + vec2(-t.x, t.y)).rgb + texture(uSrc, uv + vec2(t.x, t.y)).rgb;
  o = vec4(s / 16.0, 1.0);
}

//@@ composite
// HDR -> display: chromatic aberration, bloom, exposure, flash, ACES, grade,
// vignette, grain, fade, code-wall + text overlay, dither.
precision highp float;
uniform sampler2D uHDR;
uniform sampler2D uBloom;
uniform sampler2D uOverlay;
uniform sampler2D uCode;
uniform vec2  uRes;
uniform float uFrame;
uniform float uExposure, uBloomStr, uSat, uContrast, uVignette, uCA, uGrain;
uniform float uFade, uFlash, uOverlayOn;
uniform vec3  uTint, uLift;
uniform float uCodeOn, uCodeReveal, uCodeAlpha, uCodeSweep;
out vec4 o;

float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

const mat3 ACESIn  = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
const mat3 ACESOut = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
vec3 rrtOdt(vec3 v) { vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
vec3 aces(vec3 c) { return clamp(ACESOut * rrtOdt(ACESIn * c), 0.0, 1.0); }
vec3 toSRGB(vec3 c) { return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }

void main() {
  vec2 fc = gl_FragCoord.xy;
  vec2 uv = fc / uRes;
  vec2 d = uv - 0.5;
  float r2 = dot(d * vec2(uRes.x / uRes.y, 1.0), d * vec2(uRes.x / uRes.y, 1.0));

  // chromatic aberration (radial, grows toward the edges)
  vec2 off = d * uCA * r2;
  vec3 hdr = vec3(texture(uHDR, uv - off).r, texture(uHDR, uv).g, texture(uHDR, uv + off).b);
  vec3 bloom = texture(uBloom, uv).rgb * (1.0 / 6.0);

  vec3 c = mix(hdr, bloom, uBloomStr);
  c *= uExposure * uTint;
  c += uLift * 0.02;
  c += vec3(uFlash);
  c = aces(c);

  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = mix(vec3(l), c, uSat);
  c = clamp((c - 0.18) * uContrast + 0.18, 0.0, 1.0);

  c *= mix(1.0, 1.0 - smoothstep(0.2, 1.25, r2), uVignette);
  c = toSRGB(c);

  // film grain (perceptual space), fewer in highlights
  float g = h12(fc + fract(uFrame * 0.61803) * 1000.0) - 0.5;
  c += g * uGrain * (1.0 - 0.6 * l);

  // code wall (outro): the page's own source, revealed radially from the center
  if (uCodeOn > 0.5) {
    vec4 code = texture(uCode, uv);
    vec2 pd = (uv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
    float rr = length(pd);
    float reveal = 1.0 - smoothstep(uCodeReveal - 0.04, uCodeReveal, rr);
    float edge = exp(-abs(rr - uCodeReveal) * 40.0) * step(rr, uCodeReveal + 0.02) * step(0.001, uCodeReveal) * step(uCodeReveal, 1.2);
    float band = exp(-pow((uv.y - uCodeSweep) * 9.0, 2.0));
    vec3 ink = mix(vec3(0.33, 0.34, 0.37), vec3(1.0, 0.82, 0.55), clamp(edge * 1.5 + band * 0.35, 0.0, 1.0));
    c += ink * code.a * reveal * uCodeAlpha * (1.0 + edge * 2.0);
  }

  // text overlay (premultiplied, sRGB)
  if (uOverlayOn > 0.5) {
    vec4 ov = texture(uOverlay, uv);
    c = c * (1.0 - ov.a) + ov.rgb;
  }
  c *= uFade;

  // TPDF dither to 8 bits
  c += (h12(fc * 1.13 + 7.1 + uFrame) - h12(fc * 0.87 + 3.3 - uFrame)) / 255.0;
  o = vec4(c, 1.0);
}
</script>
<script type="x-shader" data-name="scene:void">
//@label light echoes · analytic lens glare · thin-lens bokeh dust
//@grade exposure=1.0 bloom=0.09 sat=1.08 contrast=1.04 vignette=0.42 ca=0.005 grain=0.02 tint=1,0.98,0.95
// ============================================================================
// VOID — the first light.                                   (global 0-4 s)
//
// A point star ignites at the origin. Everything on screen is light from that
// one source:
//   * the star, imaged through an analytic lens PSF: a power-law glare core
//     (~1/r^2.5 tail, per-channel radial scale: amber inside, cyan skirt
//     outside), a veiling halo, a faint lenticular (rainbow) ring, ciliary-
//     corona needles and an anamorphic streak.
//   * LIGHT ECHOES: light travels at a finite speed c, so a dust grain at p
//     sees the star as it was (|p| + |p - cam| - |cam|) / c ago. Four gently
//     tilted, corrugated veils (one through the star, one in front, two
//     behind) catch the ignition flash as nested, expanding lace rings: a
//     blue-white laced leading edge (the hottest instant), then gold, then
//     thin crimson threads as the flash cools (cf. V838 Monocerotis). The
//     dust is lace, not smoke: nested contour lines of a domain-warped
//     gradient-noise field plus a ridged hair octave, black lanes between.
//     Optically thin wisps scatter blue; only dense filaments carry the
//     star's own colour.
//   * the heartbeat (bass) swells the glare, and each beat sends its own
//     echo out through the dust: a laced ripple of light.
//   * an inclined accretion disk: the same lace wound onto Kepler orbits with
//     log-radial inflow, stretched into streaks along the orbit, gathered in
//     two trailing arms, blackbody-ramped (white-gold inside, orange-red
//     outside) and Doppler-beamed — the black hole's disk, in miniature.
//   * dust motes in 3D (12 slices of co-moving log-polar cells), lit at their
//     retarded time with a Henyey-Greenstein phase function, imaged as
//     analytic thin-lens circles of confusion: anamorphic bokeh (rimmed in
//     front of focus, soft behind), cat's eye, longitudinal + lateral CA; as
//     the riser whirls them into the vortex they become comets whose trails
//     outlast the shutter, so the head/tail taper survives.
// Timeline: 0 ignition -> the shell of lace blooms around the star -> nested
// echo rings sweep out, the veils behind the star echo at ~1.3 and ~1.9 s ->
// heartbeats ripple out (1.0/1.25, 3.0/3.25 with the score) -> 2-4 riser:
// needles grow, the disk spins up, dust falls in as comets -> 3.86+ the
// streak opens into a band and an anamorphic front of white engulfs the frame,
// handing over to the engine's flash at 4.0.
// ============================================================================

const float FOC    = 2.1;    // focal length in screen units (screen y spans [-1, 1])
const float CLIGHT = 2.8;    // speed of light for the echo (world units / s)
const float FLASH  = 20.0;   // ignition flash peak (x steady luminosity)
const float T_IGN  = 0.05;   // frame 1 sits 50 ms after ignition: the flash is in full swing
const float APER   = 0.11;   // lens aperture radius (world units) for dust bokeh
const float ANA    = 1.3;    // anamorphic squeeze: bokeh is taller than wide
const float VIN    = 0.075;  // log-radial inflow rate of dust
const float OMEGA  = 0.17;   // angular speed at r = 1 (rad / warped s)
const float TRAIL  = 1.0 / 30.0;   // length of the analytic comet trails behind moving motes (s)

float gBuild, gBuildDot;  // 0..1 riser energy (linear in time) and its rate
float gSteady;            // steady (non-flash) luminosity at the current time
float gSpin, gSpinDot;    // integrated Kepler rotation factor (x r^-1.5) and rate
float gVort, gVortDot;    // extra whirl of the dust near the star during the riser
float gDrift, gDriftDot;  // integrated log-radial inflow and rate
float gBeat;              // heartbeat envelope
float gTb, gPulse;        // seconds since the last heartbeat; its fading strength

float hg(float c, float g) {
  float g2 = g * g;
  return (1.0 - g2) / (12.566 * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}

float flashEnv(float te) { return exp(-max(te, 0.0) * 7.0); }

// Star luminosity at emission time te (seconds after ignition). Closed-form so
// every echo can look it up at its own retarded time.
float lum(float te) {
  if (te <= 0.0) return 0.0;
  float on = smoothstep(0.0, 0.025, te);
  return on * (FLASH * flashEnv(te) + 0.7 * exp(-te * 2.2) + gSteady);
}

// Colour of the star: white-hot ignition cooling to gold.
vec3 starCol(float te) {
  vec3 c = blackbody(4200.0 + 1600.0 * flashEnv(te));
  return c / max(luma(c), 1e-3);
}

// Colour of the flash light as the dust returns it: blue-white leading edge
// (hottest instant; small grains scatter blue best), warm white, gold, then
// deep crimson: the path keeps its luminance so old echoes never go brown.
vec3 echoCol(float te) {
  vec3 c = mix(vec3(0.62, 0.8, 1.2), vec3(1.0, 0.85, 0.65), smoothstep(0.0, 0.05, te));
  c = mix(c, vec3(1.0, 0.6, 0.22), smoothstep(0.05, 0.15, te));
  return mix(c, vec3(0.8, 0.1, 0.12), smoothstep(0.15, 0.35, te));
}

// Keep the hook text (bottom centre, y 72-90 %) calm: dim what passes behind it.
float textMask(vec2 p) {
  float on = smoothstep(0.1, 0.3, uLocal) * (1.0 - smoothstep(3.45, 3.75, uLocal));
  float mx = 1.0 - smoothstep(0.6, 0.9, abs(p.x));
  float my = (1.0 - smoothstep(-0.54, -0.44, p.y)) * smoothstep(-0.86, -0.76, p.y);
  return on * mx * my;
}

// ---------------------------------------------------------------- camera
void camera(float t, out vec3 ro, out mat3 cam) {
  float tt = clamp(t, -0.1, 4.1);
  float yaw = -0.10 + 0.05 * tt;
  float pitch = 0.07 - 0.014 * tt;
  float dist = 6.0 - 0.04 * tt - 0.12 * smoothstep(2.0, 4.1, tt);
  ro = dist * vec3(sin(yaw) * cos(pitch), sin(pitch), -cos(yaw) * cos(pitch));
  cam = lookAt(ro, vec3(0.0), 0.0);
}

// Dust clock: slow drift, then accelerating with the riser (2-4 s).
float warpTime(float t) { float x = max(t - 1.9, 0.0); return t + 1.6 * x * sqrt(x); }
float warpRate(float t) { float x = max(t - 1.9, 0.0); return 1.0 + 2.4 * sqrt(x); }

// ---------------------------------------------------------------- dust motes
const int NSL = 12;
const float SLZ[12] = float[12](-4.1, -3.5, -2.9, -2.3, -1.7, -1.15, -0.65, -0.2, 0.3, 0.9, 1.7, 2.8);

vec3 dust(vec2 p, vec3 ro, vec3 rd, mat3 cam, float t, float tIgn) {
  vec3 acc = vec3(0.0);
  float px = 2.0 / uRes.y;
  float zf = length(ro);
  for (int i = 0; i < NSL; i++) {
    float z = SLZ[i];
    float s = (z - ro.z) / rd.z;
    if (s <= 0.05) continue;
    vec3 q = ro + rd * s;
    float rho = length(q.xy);
    float nearF = sat((z + 4.5) / 6.5);
    float du = mix(0.62, 0.34, nearF);
    float Nphi = floor(mix(10.0, 21.0, nearF));
    float dphi = TAU / Nphi;
    // near the star the riser pulls the dust in and whirls it into a vortex
    float inZ = exp(-z * z / 1.5);
    float b3 = gBuild * gBuild * gBuild;
    float kIn = 1.0 + (1.5 + 3.0 * b3) * inZ * gBuild;
    float drift = gDrift * kIn, driftDot = gDriftDot * kIn + gDrift * (1.5 + 12.0 * b3) * inZ * gBuildDot;
    float um = log(max(rho, 1e-3)) + drift;
    float iu0 = floor(um / du);
    float phq = atan(q.y, q.x);
    float fi = float(i);
    for (int a = -1; a <= 1; a++) {
      float iu = iu0 + float(a);
      float rho0 = exp((iu + 0.5) * du);
      float kep = OMEGA * pow(rho0, -1.5);                                // Kepler at the birth radius
      float kc = OMEGA * inZ / max(rho0 * exp(-drift), 0.15);            // vortex: ~1/r at the current radius
      float Phi = kep * gSpin + kc * gVort + fi * 1.3;
      float PhiDot = kep * gSpinDot + kc * (gVortDot + driftDot * gVort);
      float ip0 = floor((phq - Phi) / dphi);
      float rIn = exp(iu * du - drift);
      for (int b = -1; b <= 1; b++) {
        float ip = ip0 + float(b);
        vec3 h1 = hash33(vec3(iu + 31.7, mod(ip, Nphi) + 17.3, fi * 7.1 + 3.3));
        if (h1.x > (0.05 + 0.4 * smoothstep(0.3, 1.8, rIn) + 0.25 * inZ * gBuild) * mix(0.5, 1.0, nearF)) continue;
        vec3 h2 = hash33(h1 * 113.7 + vec3(5.1, 1.7, 9.2));
        float rp = exp((iu + 0.1 + 0.8 * h1.y) * du - drift);
        float ang = (ip + 0.1 + 0.8 * h1.z) * dphi + Phi;
        vec2 cs = vec2(cos(ang), sin(ang));
        vec3 pp = vec3(rp * cs, z + (h2.x - 0.5) * 0.3);
        vec3 v = pp - ro;
        vec3 vc = v * cam;
        if (vc.z < 0.25) continue;
        vec2 sp = vc.xy * (FOC / vc.z);
        // screen velocity -> a comet trail behind the mote. It is longer than
        // the shutter, so the head/tail taper survives the subframe average
        // (and spp = 1 shows the same comet).
        vec3 vw = vec3(rp * (PhiDot * vec2(-cs.y, cs.x) - driftDot * cs), 0.0);
        vec3 vcd = vw * cam;
        vec2 tv = TRAIL * (FOC * vcd.xy - sp * vcd.z) / vc.z;
        tv *= min(1.0, 0.6 * length(sp) / max(length(tv), 1e-6));   // at most ~35 deg of arc: a chord, not a line across the disk
        float coc = APER * FOC * abs(1.0 / vc.z - 1.0 / zf);
        float cell = rIn * min(du, dphi) * FOC / vc.z;
        coc = min(min(coc, 0.75 * cell / ANA), 0.075);
        float R = sqrt(coc * coc + sq(0.75 * px));
        vec2 dd = p - sp;
        dd.y /= ANA; tv.y /= ANA;
        float tl = length(tv);
        float ta = clamp(-dot(dd, tv) / max(tl * tl, 1e-12), 0.0, 1.0);  // 0 at the head, 1 at the tail
        float sm = sat(tl / (2.0 * R));
        float Rt = R * (1.0 - 0.6 * ta * sm);                             // the tail narrows
        vec2 de = dd + tv * ta;
        float dist = length(de);
        if (dist > Rt * 1.1 + 1.5 * px) continue;
        // lighting: retarded-time luminosity (+ the flash spike and the
        // heartbeat pulse sweeping past), HG phase, softened inverse square;
        // flux at the camera ~ 1/z^2 (near motes are brighter, spread wider)
        float dl = length(pp);
        float tau = (dl + length(v) - zf) / CLIGHT;
        float te = tIgn - tau;
        float dtp = gTb - tau;
        float L = lum(te) + (te > 0.0 ? 15.0 * exp(-te * 40.0) : 0.0)
                + (dtp > 0.0 ? 14.0 * gPulse * exp(-dtp * 9.0) : 0.0);
        float ph = hg(dot(pp / dl, -normalize(v)), 0.62);
        float twk = 0.55 + 0.45 * sin(t * (1.5 + 4.0 * h2.z) + h2.y * TAU);
        float bright = (0.15 + 2.2 * pow(h2.y, 7.0)) * twk * (1.0 + 4.0 * inZ * gBuild * gBuild);
        float fade = smoothstep(0.1, 0.32, rp) * (1.0 - smoothstep(4.5, 6.5, rp));
        float E = L * ph * bright * fade / (dl * dl + 2.5) * sq(zf / vc.z);
        // bokeh optics. Spherical aberration flips with the side of focus:
        // foreground discs get a bright rim, background discs a soft centre-
        // weighted profile with a wider edge. Cat's eye off-axis (the pupil
        // is clipped by the lens barrel), longitudinal CA fringe, faint
        // per-disc onion rings. Comets lose rim + rings and fade to the tail.
        float big = sat(coc / (6.0 * px));
        float side = vc.z < zf ? 1.0 : -1.0;
        float aa = (side > 0.0 ? 0.8 : 0.8 + 1.7 * big) * px;
        vec3 Rc = Rt * (1.0 + side * vec3(0.02, 0.0, -0.02) * big);
        // lateral CA: the channels' discs slide apart radially off-axis
        // (amber fringe on the outer edge, cyan on the inner one)
        vec2 lca = sp * (0.09 * Rt * big);
        vec3 dc = vec3(length(de - lca), dist, length(de + lca));
        vec3 disc = vec3(1.0) - smoothstep(Rc - aa, Rc + aa, dc);
        vec2 cat = vec2(sp.x, sp.y / ANA) * (0.32 * R * big);
        disc *= 1.0 - smoothstep(Rt * 1.02 - aa, Rt * 1.02 + aa, length(de + cat));
        float x = dist / Rt;
        float prof = side > 0.0 ? 0.72 + 0.9 * big * smoothstep(0.62, 1.0, x) : 1.12 - 0.42 * x * x;
        prof *= 1.0 + 0.012 * big * sin(x * (22.0 + 18.0 * h2.x) + h2.z * TAU);
        prof = mix(prof, 1.0, sm) * mix(1.0, pow(1.0 - ta, 1.5), sm);
        // forward-scattering motes glow gold, side-scattering ones pale blue
        vec3 fw = mix(starCol(te), vec3(1.0), 0.4);
        vec3 col = mix(vec3(0.62, 0.82, 1.15), fw, smoothstep(0.1, 0.6, ph * 4.0));
        float I = E / (pow(PI * R * R * ANA, 0.65) * pow(1.0 + 1.2 * tl / (PI * R), 0.65));
        I *= prof * mix(1.0, smoothstep(2.0, 4.5, I), big) * (1.0 + 0.6 * big);  // only luminous discs survive
        I *= 1.0 - 0.95 * big * (1.0 - smoothstep(0.2, 0.42, length(sp)));   // keep the core clean
        if (t < 0.45 && coc > 5.0 * px) I *= mix(0.06, 1.0, max(smoothstep(0.5, 0.75, length(sp)), smoothstep(0.3, 0.45, t)));  // frame 1 stays clean
        acc += col * disc * I;
      }
    }
  }
  return acc * 0.05;
}

// ---------------------------------------------------------------- dust sheets (light echoes + accretion swirl)

// 2D gradient noise (quintic fade) — smoother ridges than value noise.
float gn2(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = dot(hash22(i) * 2.0 - 1.0, f);
  float b = dot(hash22(i + vec2(1, 0)) * 2.0 - 1.0, f - vec2(1, 0));
  float c = dot(hash22(i + vec2(0, 1)) * 2.0 - 1.0, f - vec2(0, 1));
  float d = dot(hash22(i + vec2(1, 1)) * 2.0 - 1.0, f - vec2(1, 1));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float gfbm(vec2 p, int oct) {
  float a = 0.5, s = 0.0;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 8; i++) { if (i >= oct) break; s += a * gn2(p); p = m * p + 3.1; a *= 0.5; }
  return s;
}
// Echo veils: lace, not smoke. Nested contour lines of a domain-warped field
// (thin bright strata with black lanes between them), laced with a fine
// ridged hair octave, inside a clumpy cloud mask. hair is returned on its own
// to lace the echo's leading edge.
float veilDust(vec2 u, float seed, bool masked, out float hair) {
  vec2 w = vec2(gfbm(u * 0.8 + seed, 3), gfbm(u * 0.8 + 5.2 - seed, 3));
  // the star shed this dust in earlier outbursts: faint nested shells, churned
  float f = gfbm(u * 1.5 + 2.2 * w, 4) + 0.05 * sin(length(u) * 6.0 + 5.0 * w.y);
  float line = pow(abs(fract(f * 6.0 + seed) - 0.5) * 2.0, 9.0);
  hair = pow(max(1.0 - 2.0 * abs(gfbm(u * 5.0 + 3.0 * w + seed, 3)), 0.0), 14.0);
  float d = 2.2 * line + 0.9 * hair + 0.06;
  if (!masked) return d;
  float cloud = smoothstep(-0.2, 0.12, gfbm(u * 0.6 + w + seed * 2.0, 3));
  float swath = 0.4 + 0.6 * smoothstep(-0.15, 0.2, w.x);   // bright and faint swaths
  return cloud * swath * d;
}

// Single scattering off a thin dust sheet dot(x, n) = d0 with retarded-time
// illumination. Out: hit point, emission time te seen there, and the geometric
// factor 1 / (r^2 |cos|) (inverse square x sheet column). False if no hit.
bool sheet(vec3 ro, vec3 rd, vec3 n, float d0, float tIgn, out vec3 pos, out float te, out float geo) {
  pos = vec3(0.0); te = 0.0; geo = 0.0;
  float dn = dot(rd, n);
  if (abs(dn) < 1e-3) return false;
  float s = (d0 - dot(ro, n)) / dn;
  if (s <= 0.0) return false;
  pos = ro + rd * s;
  float r = length(pos);
  te = tIgn - (r + s - length(ro)) / CLIGHT;
  geo = 1.0 / ((r * r + 0.6) * abs(dn));
  return true;
}

// A veil of dust through (0, 0, z0) with normal n: the flash sweeps across it
// as an expanding, eccentric shell of light (the light echo). cav: radius of
// the cavity the star has cleared around itself.
vec3 echoVeil(vec3 ro, vec3 rd, float tIgn, vec3 n, float z0, float cav, float seed) {
  vec3 pos; float te, geo;
  float d0 = z0 * n.z;
  if (!sheet(ro, rd, n, d0, tIgn, pos, te, geo) || te < -0.2) return vec3(0.0);
  vec3 e1 = normalize(cross(vec3(0.0, 1.0, 0.0), n));
  vec3 q = pos - n * d0;
  vec2 u = vec2(dot(q, e1), dot(q, cross(n, e1)));
  // the veil is corrugated: its depth wanders by ~0.25 around the plane, which
  // shifts the light-travel delay, so the echo front is ragged, not a circle
  te += 0.45 * (fbm(u * 1.4 + seed * 3.1, 3) - 0.44) / CLIGHT;
  if (te <= 0.0) return vec3(0.0);
  float rho = length(u);
  float shape = smoothstep(cav, cav + 0.6, rho) * (1.0 - smoothstep(4.0, 6.5, rho));
  // dust comes in clumps: the echo shows as broken arcs, not full rings
  shape *= mix(0.15, 1.0, smoothstep(0.2, 0.42, fbm(u * 0.35 + seed * 1.7, 2)));
  if (shape <= 0.0) return vec3(0.0);
  float hm;
  float dr = veilDust(rot(0.02 * gSpin) * u, seed, true, hm);
  float d = dr * shape;
  float ph = hg(dot(normalize(pos), -rd), 0.3);
  // light curve as the dust sees it: sharp leading spike + a thick cooling
  // body + the steady star; then the heartbeat pulse, delay-shifted
  vec3 L = 110.0 * exp(-te * 38.0) * (0.25 + 1.75 * hm) * vec3(0.62, 0.82, 1.2)
         + 170.0 * exp(-te * 5.0) * echoCol(te)
         + 0.05 * (0.7 * exp(-te * 2.2) + min(gSteady, 1.4)) * starCol(te);
  float dtp = gTb - (tIgn - te);
  if (dtp > 0.0) L += 260.0 * gPulse * exp(-dtp * 22.0) * (0.3 + 1.7 * hm) * vec3(1.0, 0.88, 0.72);
  // optically thin wisps scatter blue (small grains); only the dense
  // filaments return the star's own colour
  L = mix(vec3(0.6, 0.76, 1.05) * luma(L), L, smoothstep(0.1, 0.7, dr));
  return 2.2 * smoothstep(0.0, 0.05, te) * L * (d * ph * geo);
}

// Inclined accretion swirl close to the star, seen from slightly above: the
// echo's own lace dust, wound onto Kepler orbits with log-radial inflow. The
// lace is sampled on circles stretched along the orbit (streaks inside, lace
// outside), gathered into two trailing arms, coloured by a blackbody
// temperature ramp and Doppler-beamed (the approaching side brighter and
// hotter) — the black hole's disk at the end of the film, in miniature.
const float SWIRL_ELEV = 0.42;   // camera elevation above the swirl plane (rad)
vec3 swirl(vec3 ro, vec3 rd, float tIgn) {
  vec3 n = vec3(0.0, cos(SWIRL_ELEV), -sin(SWIRL_ELEV));
  vec3 pos; float te, geo;
  if (!sheet(ro, rd, n, 0.0, tIgn, pos, te, geo) || te <= 0.0) return vec3(0.0);
  vec3 e2 = cross(vec3(1.0, 0.0, 0.0), n);
  vec2 q = vec2(pos.x, dot(pos, e2));
  float rho = length(q);
  float rr = rho * exp(gDrift);            // inflow: sample where this dust came from
  if (rho < 0.12 || rr > 3.4) return vec3(0.0);
  float th = atan(q.y, q.x);
  float rot = OMEGA * gSpin * min(pow(rho * rho + 0.1225, -0.75), 2.2) + 3.0 * log(rho);
  float a = th - rot;
  float hm;
  float d = veilDust(vec2(cos(a), sin(a)) * max(1.8 * rr - 0.5, 0.1), 17.0, false, hm);
  d *= 0.06 + 0.94 * pow(0.5 + 0.5 * cos(2.0 * a + 0.8), 3.0);
  d *= smoothstep(0.12, 0.4, rho) * exp(-rr * 0.55) * (1.0 - smoothstep(2.2, 3.4, rr));
  float ph = hg(dot(normalize(pos), -rd), 0.35);
  // Doppler: orbital speed ~ r^-1/2, direction of rotation +th
  vec3 tw = vec3(-sin(th), 0.0, 0.0) + e2 * cos(th);
  float beta = 0.45 * dot(tw, -rd) * min(inversesqrt(rho), 2.0) * (0.3 + 0.7 * gBuild);
  float D = 1.0 + beta;
  vec3 bb = blackbody((2600.0 + 6500.0 * exp(-rho / 0.45)) * D);
  vec3 tint = bb / max(luma(bb), 1e-3);
  float Lf = 1.5 * flashEnv(te) + 90.0 * exp(-te * 40.0);
  float Ls = 0.7 * exp(-te * 2.2) + gSteady;
  float gain = 0.5 + 4.0 * gBuild + 14.0 * gBuild * gBuild;
  return 2.5 * smoothstep(0.0, 0.02, te) * tint * (d * ph * geo * D * D * D * (0.12 * Lf + gain * Ls));
}

// ---------------------------------------------------------------- lens PSF of the star
vec3 corona(vec2 d, float r, float lenS, float t) {
  float th = atan(d.y, d.x);
  float px = 2.0 / uRes.y;
  vec3 acc = vec3(0.0);
  for (int k = 0; k < 3; k++) {
    float N  = k == 0 ? 61.0 : (k == 1 ? 149.0 : 347.0);
    float wA = k == 0 ? 0.0065 : (k == 1 ? 0.0038 : 0.0022);
    float Lk = k == 0 ? 1.0 : (k == 1 ? 0.65 : 0.4);
    float a = th / TAU * N;
    float ib = floor(a);
    float wEff = max(wA, 0.75 * px / max(r, 1e-4));
    for (int j = -1; j <= 1; j++) {
      float bb = ib + float(j);
      vec3 h = hash33(vec3(mod(bb, N), float(k) * 17.0 + 1.3, 3.7));
      float c = bb + 0.5 + (h.x - 0.5) * 0.9;
      float dA = (a - c) * TAU / N;
      float prof = exp(-dA * dA / (wEff * wEff)) * (wA / wEff);
      float len = lenS * Lk * (0.15 + 0.85 * h.y * h.y);
      float amp = h.z * h.z * (0.75 + 0.25 * sin(t * (0.9 + 1.7 * h.x) + h.y * TAU));
      acc += amp * prof * exp(-r / (len * vec3(1.0, 1.0, 1.04)));
    }
  }
  return acc / (r + 0.012);
}

vec3 starPSF(vec2 d, float P, vec3 sc, float flash, float build, float wo, float wp, float beat, float t, float tm) {
  float px = 2.0 / uRes.y;
  float r = length(d);
  // the flash drives the lens features harder than the glare core
  float Pg = P / (1.0 + 0.3 * FLASH * flash);
  // per-channel radial scale -> amber inside, cyan fringe outside
  vec3 rc = r / vec3(0.93, 1.0, 1.13);
  // core disc (a few px) — swells with the build
  float cr = max(0.0035 * (1.0 + 1.8 * build + 3.0 * wo), 1.2 * px);
  float core = 1.0 - smoothstep(cr - px, cr + px, r);
  vec3 col = vec3(1.0, 0.97, 0.93) * core * 900.0 * Pg;
  // power-law glare core (~1/r^2.5 tail): warm; it breathes with the heartbeat
  float r1 = 0.0042 * (1.0 + 0.8 * build + 2.0 * wo) * (1.0 + 0.6 * beat);
  vec3 x2 = 1.0 + rc * rc / (r1 * r1);
  vec3 glare = 1.0 / (x2 * pow(x2, vec3(0.25)));
  col += sc * glare * 150.0 * Pg;
  // wide veiling halo: bluish (small-angle scatter) -> soft cyan fringe past the amber glare
  float hr = (0.18 + 0.12 * build + 0.15 * wo) * (1.0 + 0.4 * beat);
  vec3 halo = exp(-rc / hr) * (1.0 - exp(-rc / 0.07));
  col += vec3(0.42, 0.68, 1.0) * halo * 0.09 * Pg * (1.0 - 0.65 * build);
  // lenticular halo: a faint spectral ring just outside the glare, red outside, blue inside
  vec3 lr = (r - 0.115 * vec3(1.07, 1.0, 0.9)) / 0.010;
  col += exp(-lr * lr) * vec3(0.9, 1.0, 1.25) * 0.05 * Pg * (1.0 - 0.8 * flash);
  // the ignition flash veils the whole lens for a few frames
  col += mix(sc, vec3(0.8, 0.9, 1.0), 0.5) * flash * 0.012 * exp(-r * 2.5) * P;
  // ciliary-corona needles: lengthen steadily with the build, flood at the cut
  float lenS = 0.13 + 0.3 * flash + 0.14 * build + 0.2 * build * build + 0.6 * wo + 1.2 * wp * wp;
  col += mix(sc, vec3(1.0), 0.5) * corona(d, r, lenS, t) * 0.4 * P * tm;
  // anamorphic streak: razor line + soft band, cool blue
  float ax = abs(d.x), ay = abs(d.y);
  float hl = max(0.0011, 0.7 * px);
  float line = exp(-ay / hl) * (0.0011 / hl);
  float wx = (0.3 + 0.8 * flash + 0.45 * build) * (1.0 + 0.5 * beat);
  float lx = exp(-ax / wx) * 0.7 + 0.3 / (1.0 + sq(ax / (0.12 * wx)));
  float band = exp(-ay / 0.02) * exp(-ax / (wx * 0.7));
  vec3 streakCol = mix(vec3(0.3, 0.58, 1.0), vec3(1.0, 0.92, 0.85), exp(-ax / 0.025));
  col += streakCol * (line * lx * 2.2 + band * 0.07) * P;
  // the cut: the streak opens vertically into a sheet of light, like an eye opening
  if (wp > 0.0) {
    float bh = 0.012 + 1.3 * pow(wp, 2.2);
    float open = (0.8 * exp(-sq(ay / bh)) + 0.2 * exp(-ay / bh)) * (0.3 + 0.7 * exp(-ax / (0.5 + 2.5 * wp)));
    col += mix(vec3(0.5, 0.7, 1.0), vec3(1.0, 0.97, 0.92), wp) * open * 20.0 * wp * sqrt(wp);
  }
  return col;
}


// ---------------------------------------------------------------- main
vec3 renderScene(vec2 fc) {
  vec2 p = screenUV(fc);
  float t = clamp(uLocal, 0.0, 4.2);
  float tIgn = t + T_IGN;
  float flash = flashEnv(tIgn);
  // riser (quadratic in the score) -> linear build; a time ramp as a safety net
  gBuild = max(sqrt(sat(uRiser)), 0.9 * smoothstep(2.0, 3.9, t));
  gBuildDot = (t > 2.0 && t < 4.0) ? 0.5 : 0.0;
  gBeat = max(uBass, 0.7 * uKick);
  gTb = -log(max(uBass, 1e-4)) / 6.0;      // bass envelope decays at 6 / s
  gPulse = pow(uBass, 1.2);
  float wo = pow(smoothstep(3.6, 4.0, t), 2.0);
  float wp = sat((t - 3.86) / 0.14);
  gSteady = 1.0 + 0.3 * uImpact + gBuild + 1.2 * gBuild * gBuild + 0.4 * gBeat + 3.0 * wo;
  float tc = clamp(uLocal, -0.1, 4.1);
  float W = warpTime(tc), Wd = warpRate(tc);
  gDrift = VIN * W;
  gDriftDot = VIN * Wd;
  gSpin = (exp(1.5 * VIN * W) - 1.0) / (1.5 * VIN);
  gSpinDot = exp(1.5 * VIN * W) * Wd;
  gVort = 8.0 * sq(gBuild * gBuild);
  gVortDot = 32.0 * gBuild * gBuild * gBuild * gBuildDot;

  vec3 ro; mat3 cam;
  camera(uLocal, ro, cam);
  vec3 rd = cam * normalize(vec3(p, FOC));

  // star is at the world origin -> its screen position
  vec3 sc = (-ro) * cam;
  vec2 d = p - sc.xy * (FOC / sc.z);
  float tm = 1.0 - 0.85 * textMask(p);

  float P = lum(tIgn) + 12.0 * wo;   // the star surges toward the cut
  vec3 col = starPSF(d, P, starCol(tIgn), flash, gBuild, wo, wp, gBeat, t, tm);
  // four veils: through the star, in front of it, and two behind it (their
  // echoes arrive ~1.3 s and ~2.1 s after ignition)
  vec3 neb = echoVeil(ro, rd, tIgn, normalize(vec3(0.12, 0.12, -1.0)), 0.0, 0.35, 0.0)
           + 0.55 * echoVeil(ro, rd, tIgn, normalize(vec3(-0.18, 0.12, -1.0)), -0.9, 0.6, 41.0)
           + 2.2 * echoVeil(ro, rd, tIgn, normalize(vec3(0.1, -0.14, -1.0)), 1.8, 0.5, 23.0)
           + 5.0 * echoVeil(ro, rd, tIgn, normalize(vec3(-0.2, -0.07, -1.0)), 2.6, 0.6, 67.0);
  col += (neb * tm + swirl(ro, rd, tIgn)) * 0.25;
  col += dust(p, ro, rd, cam, uLocal, tIgn) * tm;
  // the frame's corners reach white against the vignette at the cut
  // ... and the light engulfs the frame: an anamorphic front (wider than
  // tall) expands from the star, so pixels go from dark to white as it
  // passes instead of the whole frame ramping through grey
  float fr = 1.9 * pow(wp, 1.8);
  float fe = length(p * vec2(0.62, 1.0));
  col += vec3(1.0, 0.97, 0.93) * 6.0 * (1.0 - smoothstep(fr - 0.35, fr, fe)) * step(0.001, wp);
  return col;
}
</script>
<script type="x-shader" data-name="scene:matter">
//@label raymarched sdf · thin-film iridescence · kaleidoscopic ifs
//@grade exposure=1.0 bloom=0.07 sat=1.05 contrast=1.06 vignette=0.42 ca=0.012 grain=0.02
// ============================================================================
// 01 MATTER — liquid metal organizes itself, then freezes into bismuth.
//   Shot A (0-4 s): macro close-up. On the impact a single drop of mercury
//                   splashes out of the centre (where the void's point of
//                   light was) into six satellites that orbit, neck and pinch
//                   off around a core (smooth-min metaballs). Kicks flare the
//                   studio lights and send a ring wave across the skin.
//   Shot B (4-8 s): a freezing front wipes across the drop, starting on the
//                   kick at 4.0. Behind the noisy front the liquid skin
//                   freezes (tempering colours) and recedes; inside it a
//                   bismuth crystal nucleates: each sub-crystal of the
//                   kaleidoscopic IFS (octahedral abs/sort fold + scale) grows
//                   as a whole cube from the moment the front passes its
//                   centre, so nothing is ever sliced by a CSG envelope. Once
//                   the liquid is gone the cluster blooms to full size and
//                   turns under hard jewellery lighting, strobing on kicks.
// Material: silver liquid with a petrol sheen -> rainbow oxide crystal. Both
// are metal under a thin oxide film: Airy two-interface reflectance with three
// wavelengths per channel. The crystal's film thickness steps per terrace and
// per sub-crystal through a palette of saturated interference hues (and bare
// silver), like real bismuth.
// Light: the liquid sits in a product-shot studio (soft boxes, crisp horizon,
// kick-flared strips); the crystal gets jewellery lighting (black surround,
// hard lights placed on the path its face families reflect as it turns).
// ============================================================================

// ---------------------------------------------------------------- per-pixel scene state
float gT;
vec3  gBall[6];
float gBallR[6];
float gCoreR, gSmK;
vec3  gSquash;
float gScale;
float gBound;
vec3  gRipAxis;
float gRipFront, gRipAmp;
float gFront;
vec3  gFDir, gFU, gFV;
mat3  gRotCrys, gRotT;
float gA0;        // main hopper half-size (crystal units)
float gGrow;      // 1 while sub-crystals still differ in size (growth phase)
float gG1[8], gG2[8];   // per-octant child / grandchild growth (per frame)
float gMaxExt, gClear;  // largest sub-crystal extent; its clearance from the octant planes
float gRigAz, gCamAz;
vec3  gCamDir;
float gKey, gRim, gCrys, gStrip, gLiqKick;
vec3  gHeroDir, gHeroUp;
float gHero, gGlow, gStrobe, gCrysGain;
vec3  gHeroDir0;
vec3  gOrb;
float gCid;   // which sub-crystal was hit (octant path through the fold tree)
float gLastT;
// camera
vec3  gRo, gTa;
vec2  gShift;
float gFocal, gDist;

const float CRYS_SIZE = 0.74;
const float FRONT_LO = -1.10;
const float FRONT_HI = 2.40;
const float F_T0 = 4.0;
const float F_DUR = 2.8;
const float KSC = 2.45;
const int   STEPS0 = 5;
const float NOISE_A = 0.20;
const float BLOB_R = 0.86;   // rough blob radius during the freeze (spark spawn shell)
const float RECEDE = 0.75;   // how fast the frozen liquid skin shrinks behind the front
const float LIQ_GONE = 1.55; // front position by which every bit of liquid has receded
const float A0_START = 0.50; // main hopper size while it is still inside the liquid
const float G2MAX = 0.55;    // grandchild size (relative to a full child)

// ---------------------------------------------------------------- timing curves
float frontAt(float T) {
  float x = sat((T - F_T0) / F_DUR);
  return mix(FRONT_LO, FRONT_HI, 0.45 * x + 0.55 * x * x * (3.0 - 2.0 * x));
}

// Camera rig: macro orbit -> ease back for the freeze (the young crystal is
// still small) -> pull back with the bloom -> slow push-in.
float pullAt(float T) { return easeInOut((T - 3.4) / 2.0); }
float bloomAt(float T) { return easeInOut((T - 5.5) / 1.6); }
void camRig(float T, out vec3 ro, out vec3 ta, out vec2 shift, out float az, out float dist) {
  float Tp = max(T, 0.0);
  float pull = pullAt(T), bloom = bloomAt(T);
  float push = easeInOut((T - 6.6) / 1.5);
  az = 0.15 + T * 0.17 + 0.30 * pull;
  float el = mix(0.18, 0.30, pull) + 0.06 * bloom;
  // the finished crystal stands on a body diagonal (tall diamond): frame it whole
  dist = mix(mix(3.55 - 0.30 * easeOutCubic(T / 3.4), 4.1, pull), 6.1, bloom) - 0.20 * push + 0.5 * exp(-6.0 * Tp);
  ta = vec3(0.0, mix(0.02, 0.08, pull) + 0.14 * bloom, 0.0);
  ro = ta + dist * vec3(sin(az) * cos(el), sin(el), cos(az) * cos(el));
  // framing: centred on the void's point of light at the cut, lifted and
  // nudged right while the label is up, back toward centre after it leaves
  vec2 sA = mix(vec2(0.08, 0.04), vec2(0.31, 0.16), easeInOut(T / 0.6));
  sA = mix(sA, vec2(0.12, 0.06), easeInOut((T - 2.9) / 0.9));
  shift = mix(sA, vec2(0.0, 0.0), pull);
}

// ---------------------------------------------------------------- shapes
float sdBlob(vec3 p) {
  vec3 q = p / gSquash;
  float d = length(q) - gCoreR;
  for (int i = 0; i < 6; i++) d = smin(d, length(q - gBall[i]) - gBallR[i], gSmK);
  if (gRipAmp > 1e-4) {
    float c = dot(q, gRipAxis) / max(length(q), 1e-4);
    float th = acos(clamp(c, -1.0, 1.0));
    float x = th - gRipFront;
    // (1 - exp(-25 th^2)): zero slope at the axis, else the pole is a cone kink
    d -= gRipAmp * sin(x * 8.0) * exp(-x * x * 6.0) * (1.0 - exp(-th * th * 25.0));
  }
  return d * min(gSquash.x, gSquash.y);
}

// Bismuth hopper cube: a box whose faces sink in stepped square terraces.
// The outer edges and every terrace lip are bevelled (rounded box, smooth
// subtraction), so each lip catches a thin specular line: machined metal.
// The pits themselves are a sharp union: rounding/smooth-unioning them put a
// zipper of dots along every concave step (measured, not guessed).
float sdHopper(vec3 p, float a, int steps) {
  float bv = 0.04 * a;
  float d = sdRoundBox(p, vec3(a), bv);
  // the pits only remove material, so away from the surface the box distance
  // is a safe lower bound: skip the terrace loop
  if (d > 0.12 * a) return d;
  vec3 q = abs(p);
  if (q.x < q.y) q.xy = q.yx;
  if (q.x < q.z) q.xz = q.zx;
  if (q.y < q.z) q.yz = q.zy;
  float pit = 1e9;
  float fs = float(steps);
  for (int k = 1; k <= 7; k++) {
    if (k > steps) break;
    float fk = float(k);
    float w = a * (1.0 - fk * 0.74 / fs);
    float dep = a * fk * 0.60 / fs;
    pit = min(pit, sdBox(q - vec3(a, 0.0, 0.0), vec3(dep, w, w)));
  }
  return smax(d, -pit, bv);
}

// Terrace index of a point on a hopper face (0 = outer rim, steps = deepest pit),
// classified by depth below the face: the floors sit at discrete depths, and
// each step wall takes the colour of the floor below it. (Classifying by the
// in-plane ring put every wall exactly on a floor() boundary: dotted walls.)
float terraceIdx(vec3 p, float a, int steps) {
  vec3 q = abs(p);
  float depth = a - max(q.x, max(q.y, q.z));
  return clamp(ceil(depth * float(steps) / (0.60 * a) - 0.1), 0.0, float(steps));
}

float frontS(vec3 p);

// Age (distance units since the front passed) at a sub-crystal centre given in
// crystal units: every sub-crystal grows as a whole cube once the front is
// safely past its centre -> nucleation, never a sliced cube.
float nucleusAge(vec3 cc) { return gFront - frontS(gRotT * (cc * CRYS_SIZE)); }

// Kaleidoscopic IFS cluster: main hopper, 8 children on its corners, and
// grandchildren on the children's outer corners.
// With `info`, gOrb = (generation, terrace index, -), gCid = sub-crystal id.
float sdCrystal(vec3 p, bool info) {
  p /= CRYS_SIZE;
  float a0 = gA0;
  float d = sdHopper(p, a0, STEPS0);
  if (info) { gOrb = vec3(0.0, terraceIdx(p, a0, STEPS0), 0.0); gCid = 0.0; }
  // grandchildren may only live outside the main crystal's box: otherwise the
  // ones at buried corners poke up through its terrace floors as loose rods
  float outside = -sdBox(p, vec3(a0));
  float g1 = 1.0, g2 = G2MAX;
  float planeD = 1e9;
  float oct = dot(step(0.0, p), vec3(1.0, 2.0, 4.0));
  if (gGrow > 0.5) {
    int io = int(oct + 0.5);
    g1 = gG1[io];
    g2 = gG2[io];
    // sub-crystals differ in size between octants, so where a neighbour is
    // bigger than this octant's own, the fold's single-octant distance can
    // overestimate: bound it by the distance to the octant planes plus the
    // neighbours' clearance (keeps the march from overstepping). Octants that
    // already hold the largest sub-crystal need no bound (fold symmetry).
    if (g1 + g2 / KSC < gMaxExt - 1e-4) {
      vec3 ap = abs(p);
      planeD = min(ap.x, min(ap.y, ap.z)) + gClear;
    }
  }
  float cid = oct + 1.0;
  if (g1 > 0.0) {
    p = abs(p);
    if (p.x < p.y) p.xy = p.yx;
    if (p.x < p.z) p.xz = p.zx;
    if (p.y < p.z) p.yz = p.zy;
    p = (p - a0) * KSC;
    // exact early-out: the child and its grandchildren live inside this box
    if (sdBox(p, vec3(g1 + g2 / KSC)) / KSC >= d) return min(d, planeD) * CRYS_SIZE;
    float dc = sdHopper(p, g1, 4) / KSC;
    if (dc < d) {
      d = dc;
      if (info) { gOrb = vec3(1.0, terraceIdx(p, g1, 4), 0.0); gCid = cid; }
    }
    if (g2 > 0.0) {
      float cid2 = cid * 9.0 + dot(step(0.0, p), vec3(1.0, 2.0, 4.0)) + 1.0;
      p = abs(p);
      if (p.x < p.y) p.xy = p.yx;
      if (p.x < p.z) p.xz = p.zx;
      if (p.y < p.z) p.yz = p.zy;
      p = (p - g1) * KSC;
      float dg = max(sdHopper(p, g2, 1) / (KSC * KSC), outside);
      if (dg < d) {
        d = dg;
        if (info) { gOrb = vec3(2.0, terraceIdx(p, g2, 1), 0.0); gCid = cid2; }
      }
    }
  }
  return min(d, planeD) * CRYS_SIZE;
}

// Signed "time since frozen" in distance units: > 0 behind the front (crystal).
// Front position along gFDir, wobbled by a cheap smooth noise (sum of sines).
float frontS(vec3 p) {
  float n = sin(dot(p, vec3(2.1, 1.3, -1.7)) + 1.3) * sin(dot(p, vec3(-1.2, 2.4, 1.1)) + 4.0)
          + 0.5 * sin(dot(p, vec3(3.7, -2.9, 2.3)) + 0.7);
  return dot(p, gFDir) + NOISE_A * 0.35 * n;
}

float ageAt(vec3 pw) {
  if (gFront >= FRONT_HI) return 9.0;
  if (gFront <= FRONT_LO) return -9.0;
  return gFront - frontS(pw / gScale);
}

float mapI(vec3 p, bool info) {
  p /= gScale;
  if (gFront <= FRONT_LO) return sdBlob(p) * gScale;
  vec3 pc = gRotCrys * p;
  if (gFront >= FRONT_HI) { float dcx = sdCrystal(pc, info); if (info) gOrb.z = 1.0; return dcx * gScale; }
  float age = gFront - frontS(p);
  float h = age * 0.6;                                   // ~unit gradient
  if (gFront > LIQ_GONE) {
    float dcx = max(sdCrystal(pc, info), -h);
    if (info) gOrb.z = 1.0;
    return dcx * gScale;
  }
  float db = sdBlob(p);
  // liquid: continuous across the front; behind it the frozen skin recedes
  // into the crystal instead of being plane-cut (no exposed cross-section cap)
  float dl = age > 0.0 ? (db + RECEDE * age) * 0.60 : db;
  if (dl <= -h) { if (info) gOrb.z = 0.0; return dl * gScale; }   // crystal can't win
  // crystal: only behind the front; it starts inside the drop and each
  // sub-crystal nucleates whole, so no envelope has to trim it
  float dc = max(sdCrystal(pc, info), -h);
  if (info) gOrb.z = dc < dl ? 1.0 : 0.0;
  return min(dc, dl) * gScale;
}
float map(vec3 p) { return mapI(p, false); }

// ---------------------------------------------------------------- studio environment
// Rectangular softbox seen from the origin: panel with an internal gradient
// plus a diffusion halo.
float softbox(vec3 r, vec3 c, vec3 u, vec2 hs, float soft, float halo) {
  float k = dot(r, c);
  if (k <= 0.0) return 0.0;
  u = normalize(u - c * dot(u, c));
  vec3 q = r / k;
  vec3 v = cross(c, u);
  vec2 uv = vec2(dot(q, v), dot(q, u));
  float d = sdBox2(uv, hs);
  vec2 e = uv / hs;
  float panel = (1.0 - smoothstep(-soft, soft, d)) * (0.45 + 0.55 * exp(-dot(e, e) * 1.2));
  return panel + halo * exp(-max(d, 0.0) * 5.0) * 0.12;
}

vec3 lightDir(float az, float el) {
  float a = az + gRigAz;
  return vec3(sin(a) * cos(el), sin(el), cos(a) * cos(el));
}

// Liquid studio: product-shot chrome. Big soft shapes, crisp horizon.
vec3 envLiquid(vec3 r) {
  float y = r.y;
  const vec3 up = vec3(0.0, 1.0, 0.0);
  // studio dome: a dark band just above the horizon keeps the chrome line;
  // higher up a silvery gradient gives the liquid a mercury body
  vec3 c = vec3(0.012, 0.012, 0.014) + vec3(0.22, 0.23, 0.25) * smoothstep(0.10, 0.85, y);
  // warm cyc glow hugging the horizon from above (tight, so the line stays crisp)
  c += vec3(0.60, 0.46, 0.34) * exp(-max(y, 0.0) * 40.0) * 0.08;
  // floor: a bright cyclorama band right under the horizon, a mid-grey floor
  // brightening toward the key's pool straight down (soft rim, so the
  // underside reads as one continuous body)
  float yb = min(y, 0.0);
  vec3 fl = vec3(0.050, 0.050, 0.056) * (1.0 + 1.6 * smoothstep(-0.30, -0.95, y))
          + vec3(1.0, 0.94, 0.86) * (0.35 + 0.85 * exp(yb * 9.0)) * smoothstep(-0.20, -0.185, y)
          + vec3(0.9, 0.86, 0.80) * 0.26 * smoothstep(-0.65, -0.95, y);
  c = mix(c, fl, smoothstep(0.0, -0.004, y));
  // key: overhead softbox, hard edge, strong internal gradient
  vec3 kd = normalize(lightDir(0.35, 1.0));
  c += vec3(1.0, 0.96, 0.90) * 2.3 * gKey * softbox(r, kd, lightDir(0.35 + PI, 0.0), vec2(0.40, 0.62), 0.025, 0.6);
  // thin tall strips: crisp highlight lines left (cool) and right (warm); they
  // flare on every kick (beat sync that reads at thumbnail size)
  float sk = 1.0 + gLiqKick;
  c += vec3(0.82, 0.90, 1.00) * 4.0 * sk * softbox(r, lightDir(-1.2, 0.20), up, vec2(0.055, 1.1), 0.012, 1.0);
  c += vec3(1.00, 0.86, 0.70) * 3.2 * sk * softbox(r, lightDir(1.4, 0.28), up, vec2(0.08, 0.9), 0.015, 1.0);
  // wide card behind the camera: crisp-edged, so lobe centres carry a designed
  // silver reflection instead of reading as black glass
  c += vec3(0.85, 0.88, 0.95) * 0.50 * (1.0 + 0.5 * gLiqKick) * softbox(r, normalize(gCamDir + vec3(0.0, 0.16, 0.0)), up, vec2(0.95, 0.30), 0.14, 0.5);
  c += vec3(0.95, 0.90, 0.85) * 0.105 * softbox(r, lightDir(2.3, 0.15), up, vec2(0.9, 0.6), 0.25, 0.6);
  c += vec3(0.80, 0.88, 1.00) * 0.095 * softbox(r, lightDir(-2.2, 0.35), up, vec2(0.8, 0.5), 0.25, 0.6);
  return c;
}

// Crystal studio: jewellery lighting. Near-black surround and a few hard,
// bright shapes. Every face of the cluster shares one of six normals (the body
// diagonal stands vertical, so they sit at +-35 deg elevation): an upward face
// family reflects a point on one curve that runs from 50 deg up straight over
// the camera, through ~34 deg at +-90 deg, to the horizon behind the crystal.
// The lights sit on that curve (camera-relative), so as the crystal yaws each
// family sweeps through them in turn: whole families flip between black and
// blazing colour, and hard light edges travel across the cluster.
vec3 lightDirC(float daz, float el) {
  float a = gCamAz + daz;
  return vec3(sin(a) * cos(el), sin(el), cos(a) * cos(el));
}
vec3 envCrystal(vec3 r) {
  float y = r.y;
  const vec3 up = vec3(0.0, 1.0, 0.0);
  vec3 c = vec3(0.006, 0.006, 0.008) + vec3(0.03, 0.032, 0.04) * smoothstep(0.2, 0.9, y);
  c = mix(c, vec3(0.012, 0.012, 0.014) + vec3(0.07, 0.065, 0.06) * exp(min(y, 0.0) * 14.0), smoothstep(0.0, -0.004, y));
  // key over the camera: the camera-facing upper family reflects it
  c += vec3(1.0, 0.95, 0.88) * 3.6 * gKey * softbox(r, lightDirC(0.0, 0.87), lightDirC(PI, 0.0), vec2(0.30, 0.22), 0.012, 0.3);
  // side boxes, warm left / cool right: families ~40 deg off the camera
  c += vec3(1.00, 0.86, 0.70) * 3.8 * softbox(r, lightDirC(-1.55, 0.55), up, vec2(0.20, 0.32), 0.012, 0.3);
  c += vec3(0.76, 0.87, 1.00) * 3.5 * softbox(r, lightDirC(1.55, 0.55), up, vec2(0.20, 0.32), 0.012, 0.3);
  // hard tall strips: scintillation as families pass through them
  c += vec3(1.00, 0.97, 0.92) * gStrip * softbox(r, lightDirC(-1.05, 0.30), up, vec2(0.035, 1.3), 0.007, 0.2);
  c += vec3(0.92, 0.96, 1.00) * gStrip * softbox(r, lightDirC(1.00, 0.30), up, vec2(0.035, 1.3), 0.007, 0.2);
  c += vec3(1.00, 0.95, 0.88) * gStrip * softbox(r, lightDirC(-2.15, 0.20), up, vec2(0.035, 1.1), 0.007, 0.2);
  c += vec3(0.95, 0.95, 1.00) * gStrip * softbox(r, lightDirC(2.10, 0.20), up, vec2(0.035, 1.1), 0.007, 0.2);
  // cool floor pool: the lower families stay dark but never dead
  c += vec3(0.55, 0.62, 0.80) * 0.8 * softbox(r, vec3(0.0, -1.0, 0.0), lightDirC(0.0, 0.0), vec2(0.7, 0.7), 0.3, 0.3);
  // hero panel: parked in the reflection of the camera-facing face family and
  // drifting across it; flashes on kicks
  c += vec3(1.0, 0.97, 0.93) * gHero * softbox(r, gHeroDir, gHeroUp, vec2(0.26, 0.20), 0.012, 0.4);
  // kick strobe: a wide panel over the whole family's reflection cone, only on the hit
  if (gStrobe > 0.01) c += vec3(1.0, 0.96, 0.90) * gStrobe * softbox(r, gHeroDir0, gHeroUp, vec2(0.60, 0.50), 0.03, 0.3);
  return c * gCrysGain;
}

// w: 0 = liquid (and its frozen skin), 1 = crystal
vec3 envMap(vec3 r, float w) {
  const vec3 up = vec3(0.0, 1.0, 0.0);
  vec3 c = w > 0.5 ? envCrystal(r) : envLiquid(r);
  // tiny hot point lights: flat facets catch them only at exact angles -> glints
  c += vec3(1.0, 0.95, 0.85) * 60.0 * exp((dot(r, normalize(lightDir(0.9, 0.75))) - 1.0) * 5000.0);
  c += vec3(0.9, 0.95, 1.0) * 60.0 * exp((dot(r, normalize(lightDir(-0.7, 0.55))) - 1.0) * 5000.0);
  c += vec3(1.0, 0.9, 0.8) * 45.0 * exp((dot(r, normalize(lightDir(2.2, 0.4))) - 1.0) * 5000.0);
  c += vec3(0.9, 0.9, 1.0) * 45.0 * exp((dot(r, normalize(lightDir(-2.4, 0.9))) - 1.0) * 5000.0);
  // accent rims from behind: magenta (left, low) and cyan (right, high)
  c += vec3(1.00, 0.16, 0.50) * 2.4 * gRim * softbox(r, lightDir(PI - 0.8, 0.05), up, vec2(0.22, 0.75), 0.05, 0.8);
  c += vec3(0.10, 0.70, 1.00) * 2.1 * gRim * softbox(r, lightDir(PI + 0.85, 0.35), up, vec2(0.18, 0.6), 0.05, 0.8);
  return c;
}

// What the camera sees behind the subject (never the softboxes themselves).
vec3 backdrop(vec3 rd, vec2 uv) {
  vec3 c = vec3(0.0022, 0.0022, 0.0030);
  vec2 g = (uv - gShift * 1.1 - vec2(0.0, 0.08)) * vec2(0.8, 1.0);
  c += vec3(0.105, 0.102, 0.125) * mix(1.0, 0.45, gCrys) * exp(-dot(g, g) * 0.5);
  // dawn behind the crystal in the last beats: leads into WORLD's sunrise
  c += vec3(1.0, 0.74, 0.50) * gGlow * exp(-dot(g, g) * 0.9);
  return c;
}

// ---------------------------------------------------------------- material
// Thin oxide film on metal: Airy reflectance with three wavelengths per channel.
vec3 filmReflectance(float cosI, float dNm, float r23) {
  const float nf = 2.45;               // Bi2O3-like oxide
  float sin2 = 1.0 - cosI * cosI;
  float cosT = sqrt(max(1.0 - sin2 / (nf * nf), 0.0));
  float r12 = (cosI - nf * cosT) / (cosI + nf * cosT);
  float a = r12 * r12 + r23 * r23, b = 2.0 * r12 * r23, c0 = 1.0 + r12 * r12 * r23 * r23;
  float opd = 2.0 * nf * dNm * cosT;
  vec3 R = vec3(0.0);
  for (int k = -1; k <= 1; k++) {
    vec3 lam = vec3(630.0, 540.0, 460.0) + float(k) * vec3(26.0, 20.0, 16.0);
    vec3 cd = cos(TAU * opd / lam);
    R += (a + b * cd) / (c0 + b * cd);
  }
  return R / 3.0;
}

vec3 schlickSilver(float cosI) {
  vec3 f0 = vec3(0.93, 0.93, 0.94);
  return f0 + (1.0 - f0) * pow(1.0 - cosI, 5.0);
}

// liquid mercury: bare silver with swirling petrol-sheen patches
vec3 liquidF(vec3 q, float cosI, out float th) {
  vec3 w = q * 1.3 + vec3(0.0, gT * 0.3, 0.0);
  w += 0.7 * vec3(vnoise(w * 1.6 + 3.1), vnoise(w * 1.6 + 8.4), vnoise(w * 1.6 + 1.7));
  th = 50.0 + 170.0 * vnoise(w * 1.2);
  float cov = smoothstep(0.46, 0.74, vnoise(q * 1.2 + vec3(gT * 0.15, 0.0, 3.0)));
  return mix(schlickSilver(cosI), filmReflectance(max(cosI, 0.02), th, -0.82), cov);
}

// Oxide thicknesses (nm) that give saturated interference hues on bismuth:
// gold, magenta, blue, bare silver (almost no oxide), violet, cyan,
// yellow-green, orange.
float oxideTh(float i) {
  i = mod(i, 8.0);
  return i < 0.5 ? 138.0 : i < 1.5 ? 163.0 : i < 2.5 ? 188.0 : i < 3.5 ? 10.0
       : i < 4.5 ? 62.0 : i < 5.5 ? 203.0 : i < 6.5 ? 228.0 : 148.0;
}

vec3 metalF(vec3 p, float cosI, float age) {
  vec3 q = p / gScale;
  float thL;
  if (age <= 0.0) return liquidF(q, cosI, thL);
  gOrb = vec3(0.0); gCid = 0.0;
  mapI(p, true);
  if (gOrb.z < 0.5) {
    // frozen liquid skin: the oxide thickens with time since freezing, so
    // tempering-colour bands (straw -> magenta -> blue) trail the weld line
    vec3 fl = liquidF(q, cosI, thL);
    float th = 25.0 + 190.0 * sat(age * 1.6) + 20.0 * (vnoise(q * 3.0) - 0.5);
    return mix(fl, filmReflectance(max(cosI, 0.02), th, -0.70) * 1.15, sat(age * 10.0));
  }
  // crystal: one saturated oxide hue per terrace, walking the palette from the
  // rim inward (+ an offset per sub-crystal: each hopper cooled differently).
  // A weakly reflecting substrate term keeps the interference deep: rich
  // colour instead of pastel.
  float th = oxideTh(gOrb.y + 3.0 * gOrb.x + floor(hash11(gCid * 3.17 + 0.5) * 7.99));
  th += (th < 20.0 ? 4.0 : 8.0) * (vnoise(q * 2.5) - 0.5);
  return filmReflectance(max(cosI, 0.02), th, -0.50);
}

// ---------------------------------------------------------------- marching
vec3 calcNormal(vec3 p, float eps) {
  const vec2 k = vec2(1.0, -1.0);
  return normalize(k.xyy * map(p + k.xyy * eps) + k.yyx * map(p + k.yyx * eps) +
                   k.yxy * map(p + k.yxy * eps) + k.xxx * map(p + k.xxx * eps));
}

// sc: probe radius scale (the crystal's terraces are much finer than the drop)
float calcAO(vec3 p, vec3 n, float sc) {
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 5; i++) {
    float h = (0.01 + 0.07 * float(i)) * sc;
    float d = map(p + n * h);
    occ += (h - d) * sca;
    sca *= 0.8;
  }
  return sat(1.0 - 2.2 * occ / sc);
}

vec2 sphIntersect(vec3 ro, vec3 rd, float r) {
  float b = dot(ro, rd);
  float c = dot(ro, ro) - r * r;
  float h = b * b - c;
  if (h < 0.0) return vec2(-1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

// hitK: hit threshold in pixels. Rays grazing a terrace lip closer than the
// threshold register a false hit on the bevel whose position depends on the
// step sequence: a zipper of dots along every edge. Primary rays use 0.2 px.
float march(vec3 ro, vec3 rd, float tmax, float pixAng, int maxSteps, float hitK) {
  vec2 b = sphIntersect(ro, rd, gBound);
  if (b.y < 0.0) return -1.0;
  float t = max(b.x, 0.0);
  float tEnd = min(b.y, tmax);
  for (int i = 0; i < 220; i++) {
    if (i >= maxSteps || t > tEnd) break;
    float d = map(ro + rd * t);
    float eps = max(1e-4, t * pixAng * hitK);
    if (d < eps) return t;
    t += d * 0.85;
  }
  gLastT = t;
  return t > tEnd ? -1.0 : -2.0;   // -1: escaped, -2: ran out of steps (deep in a crevice)
}

vec3 shadeMetal(vec3 p, vec3 rd, float t, float pixAng, bool bounce) {
  float eps = max(4e-4, t * pixAng * 0.5);
  vec3 n = calcNormal(p, eps);
  float cosI = sat(dot(n, -rd));
  vec3 r = reflect(rd, n);
  float age = ageAt(p);
  vec3 F = metalF(p, cosI, age);
  float w = age > 0.0 && gOrb.z > 0.5 ? 1.0 : 0.0;
  float ao = calcAO(p, n, w > 0.5 ? 0.4 : 1.0);
  vec3 refl;
  float th = bounce ? march(p + n * eps * 6.0, r, 5.0, pixAng * 3.0, 44, 0.6) : -1.0;
  if (th > 0.0) {
    vec3 p2 = p + n * eps * 6.0 + r * th;
    vec3 n2 = calcNormal(p2, eps * 2.0);
    float c2 = sat(dot(n2, -r));
    float a2 = ageAt(p2);
    vec3 F2 = metalF(p2, c2, a2);
    refl = F2 * envMap(reflect(r, n2), a2 > 0.0 && gOrb.z > 0.5 ? 1.0 : 0.0) * 0.85;
  } else {
    refl = envMap(r, w) * (th < -1.5 ? 0.35 : 1.0);
  }
  vec3 col = F * refl * mix(w > 0.5 ? 0.4 : 0.15, 1.0, ao);

  // freezing front: a molten weld line with a white-hot core; the fresh crystal
  // behind it is still glowing and cools within a few tenths of a unit
  if (gFront > FRONT_LO && gFront < FRONT_HI) {
    float kb = 1.0 + 0.6 * uKick;
    col += vec3(1.0, 0.50, 0.18) * 9.0 * exp(-sq(age / 0.028)) * kb;
    col += vec3(1.0, 0.88, 0.70) * 26.0 * exp(-sq(age / 0.007)) * kb;
    if (age > 0.0) col += vec3(1.0, 0.38, 0.10) * 1.2 * exp(-age * 7.0);
  }
  return col;
}

// ---------------------------------------------------------------- sparks
// Embers of latent heat thrown off the freezing seam: ballistic particles
// rendered as velocity-aligned streaks (ray-to-segment distance).
vec3 sparks(vec3 ro, vec3 rd, float tHit, float pixAng) {
  vec3 acc = vec3(0.0);
  if (gT < F_T0 || gT > F_T0 + F_DUR) return acc;
  const float LIFE = 0.35;
  float boost = 0.85 + 1.0 * uKick;
  for (int i = 0; i < 64; i++) {
    float fi = float(i);
    float off = hash11(fi * 7.31 + 1.7) * LIFE;
    float cyc = floor((gT - off) / LIFE);
    float ts = cyc * LIFE + off;
    float a = gT - ts;
    float f0 = frontAt(ts);
    if (abs(f0) > BLOB_R * 0.96) continue;
    vec3 hh = hash31(fi * 3.7 + cyc * 17.3);
    vec2 cs = hash21(fi * 5.1 + cyc * 9.7) * 2.0 - 1.0;
    cs *= inversesqrt(max(dot(cs, cs), 1e-4));
    vec3 e = cs.x * gFU + cs.y * gFV;
    float rad = sqrt(max(BLOB_R * BLOB_R - f0 * f0, 0.0));
    vec3 p0 = gFDir * f0 + e * rad;
    vec3 v = e * (1.3 + 2.4 * hh.y) + gFDir * (0.5 + 1.0 * hh.z) + vec3(0.0, 0.6, 0.0);
    float ab = max(a - 0.05, 0.0);
    vec3 pa = (p0 + v * a + vec3(0.0, -2.5, 0.0) * a * a) * gScale;
    vec3 pb = (p0 + v * ab + vec3(0.0, -2.5, 0.0) * ab * ab) * gScale;
    // closest approach between the ray and the segment [pb, pa]
    vec3 w = ro - pb, ba = pa - pb;
    vec3 wp = w - rd * dot(rd, w), bp = ba - rd * dot(rd, ba);
    float s = sat(dot(wp, bp) / max(dot(bp, bp), 1e-10));
    vec3 dv = wp - bp * s;
    float tp = dot(rd, pb + ba * s - ro);
    if (tp < 0.0 || tp > tHit) continue;
    float d2 = dot(dv, dv);
    float wd = max(0.0035, tp * pixAng * 0.7);
    if (d2 > 90.0 * wd * wd) continue;   // halo < 0.3%: skip the exps
    float life = smoothstep(0.0, 0.015, a) * sq(1.0 - a / LIFE);
    vec3 hot = mix(vec3(1.0, 0.42, 0.10), vec3(1.0, 0.90, 0.70), exp(-a * 9.0));
    acc += life * boost * (hot * 55.0 * exp(-d2 / (wd * wd)) + vec3(1.0, 0.35, 0.08) * 2.5 * exp(-d2 / (16.0 * wd * wd)));
  }
  return acc;
}

// ---------------------------------------------------------------- setup
void setupScene() {
  float T = clamp(uLocal, -0.05, uDur + 0.05);
  gT = T;
  float Tp = max(T, 0.0);

  // camera first: the ripple and the hero light are camera-relative
  float az;
  camRig(T, gRo, gTa, gShift, az, gDist);
  gFocal = 3.0;
  gRigAz = az * 0.5;
  gCamAz = az;
  gCamDir = normalize(gRo - gTa);

  // the freezing front wipes diagonally across the frame (lower-left -> upper-right),
  // edge-on to the camera at mid-transition so the weld reads as a line
  vec3 r5, t5; vec2 s5; float a5, d5;
  camRig(F_T0 + 1.3, r5, t5, s5, a5, d5);
  vec3 fw = normalize(t5 - r5);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 upv = cross(rt, fw);
  gFDir = normalize(rt * 0.80 + upv * 0.60);
  gFU = normalize(cross(gFDir, fw));
  gFV = cross(gFDir, gFU);

  // one drop splashes out of the centre into satellites, which then orbit,
  // neck and pinch off around the core
  float splash = 1.0 + 0.5 * sin(5.0 * Tp) * exp(-3.0 * Tp) - 0.55 * exp(-8.0 * Tp);
  float settle = smoothstep(3.3, 4.7, T);
  float spin = T * 0.60 + 1.2 * (1.0 - exp(-2.0 * Tp));
  gBound = 0.0;
  for (int i = 0; i < 6; i++) {
    float fi = float(i);
    vec3 h = hash31(fi * 13.7 + 3.1);
    vec3 axis = normalize(h * 2.0 - 1.0 + vec3(0.0, 0.9, 0.0));
    vec3 perp = normalize(cross(axis, vec3(0.31, 0.17, 0.93)));
    float orbitR = (0.76 + 0.27 * sin(T * (1.4 + 0.5 * h.y) + fi * 2.1)) * splash * (1.0 - 0.22 * settle);
    float ang = spin * (0.8 + 0.5 * h.z) + fi * 1.047;
    gBall[i] = rotAxis(axis, ang) * perp * orbitR;
    gBallR[i] = (0.27 + 0.14 * h.z) * (1.0 - 0.2 * settle);
  }
  // the core is big enough during the freeze to hide the young crystal
  gCoreR = mix(0.36, 0.44, easeOutCubic(T / 1.0)) + 0.20 * settle;
  gSmK = mix(0.85, 0.31, smoothstep(0.1, 0.6, T)) + 0.06 * settle;   // stringy bridges on impact

  // kick: time since the hit (the envelope decays as exp(-8 t))
  float tk = uKick > 1e-4 ? -log(uKick) / 8.0 : 9.0;
  float kseed = floor((uTime - tk) * 8.0 + 0.5);
  float liquid = 1.0 - smoothstep(4.6, 6.0, T);
  gRipAxis = normalize(gCamDir + 0.35 * (hash31(kseed * 1.37) * 2.0 - 1.0));
  gRipFront = tk * 2.5;
  gRipAmp = 0.07 * exp(-tk * 2.2) * smoothstep(0.0, 0.3, gRipFront) * liquid;
  float jig = sin(tk * 20.0) * exp(-tk * 6.0) * liquid;
  gSquash = vec3(1.0 + 0.035 * jig, 1.0 - 0.07 * jig, 1.0 + 0.035 * jig);

  gFront = frontAt(T);
  float crysOn = smoothstep(5.0, 6.0, T);
  gScale = 1.0 + 0.012 * uKick * crysOn;
  float yaw = 0.3 + 0.10 * T + 0.55 * pow(max(T - 6.2, 0.0), 1.6);
  gRotCrys = rotY(yaw) * rotX(0.6155) * rotZ(0.7854);
  gRotT = transpose(gRotCrys);
  // the main hopper stays inside the drop until the liquid is gone, then the
  // whole cluster blooms to full size
  gA0 = mix(A0_START, 1.0, easeInOut((T - 5.6) / 1.3));
  gGrow = gFront < FRONT_HI ? 1.0 : 0.0;   // once the front has passed, all sub-crystals are full grown
  // each child nucleates when the front is safely past its centre, then grows
  // as a whole cube; its grandchildren follow (evaluated once per frame)
  for (int i = 0; i < 8; i++) {
    vec3 sg = vec3((i & 1) != 0 ? 1.0 : -1.0, (i & 2) != 0 ? 1.0 : -1.0, (i & 4) != 0 ? 1.0 : -1.0);
    float ag = nucleusAge(sg * gA0);
    gG1[i] = sat((ag - 0.16) * 2.2);
    gG2[i] = G2MAX * sat((ag - 0.55) * 2.6) * sat((gA0 - 0.62) * 3.0);
  }
  gMaxExt = 0.0;
  for (int i = 0; i < 8; i++) gMaxExt = max(gMaxExt, gG1[i] + gG2[i] / KSC);
  gClear = max(gA0 - gMaxExt / KSC, 0.06);

  float bl = 0.0;
  for (int i = 0; i < 6; i++) bl = max(bl, length(gBall[i] * gSquash) + gBallR[i] * 1.1);
  bl = max(max(bl, gCoreR) + 0.25, 0.5);
  float bc = CRYS_SIZE * 1.7321 * (gA0 + (1.0 + G2MAX / KSC) / KSC) + 0.05;
  gBound = (gFront <= FRONT_LO ? bl : (gFront > LIQ_GONE ? bc : max(bl, bc))) * gScale;

  // hero light: pick the crystal face family most facing the camera and park a
  // panel exactly where those mirrors send the camera's rays; flash it on kicks
  vec3 fwd = normalize(gTa - gRo);
  vec3 best = vec3(0.0, 1.0, 0.0);
  float bd = -1.0;
  for (int i = 0; i < 3; i++) {
    vec3 n = gRotT[i];
    float dd = dot(n, -fwd);
    if (abs(dd) > bd) { bd = abs(dd); best = n * sign(dd); }
  }
  gHeroDir = normalize(reflect(fwd, best));
  gHeroUp = normalize(cross(gHeroDir, cross(vec3(0.0, 1.0, 0.0), gHeroDir)) + vec3(0.0, 1e-3, 0.0));
  gHeroDir0 = gHeroDir;
  // drift the panel so its edge crosses the family's reflection cone
  gHeroDir = normalize(gHeroDir + cross(gHeroUp, gHeroDir) * 0.22 * sin(T * 1.7 + 0.8) + gHeroUp * 0.10 * sin(T * 1.1));
  float climax = smoothstep(7.2, 8.0, T);
  gHero = crysOn * (1.3 + 3.0 * uKick) + 2.0 * climax;
  gStrobe = crysOn * 2.2 * uKick * (1.0 + 0.8 * climax);
  gCrysGain = 1.4 + 0.5 * climax;

  gCrys = smoothstep(4.6, 5.8, T);
  gStrip = (8.0 + 5.0 * climax) * (1.0 + 0.8 * uKick);
  gLiqKick = 1.8 * uKick * (1.0 - gCrys);
  gKey = 1.0 + 0.5 * uImpact + 0.8 * uKick * (1.0 - gCrys) + 0.2 * smoothstep(5.5, 7.5, T);
  gRim = 1.0 + 1.2 * uSnare;
  gGlow = 0.30 * climax * climax + 0.05 * uKick * crysOn;
}

// ---------------------------------------------------------------- main
vec3 renderScene(vec2 fc) {
  setupScene();
  float T = gT;
  vec2 uv = screenUV(fc);

  vec3 ro = gRo;
  float Tp = max(T, 0.0);
  float roll = 0.03 * sin(T * 0.7) + 0.012 * exp(-10.0 * Tp) * sin(Tp * 28.0);
  mat3 cam = lookAt(ro, gTa, roll);
  vec3 rd = cam * normalize(vec3(uv - gShift, gFocal));
  thinLens(ro, rd, cam, gDist - mix(0.95, 1.1, bloomAt(T)), 0.011);

  float pixAng = 2.0 / (uRes.y * gFocal);
  gLastT = -1.0;
  float th = march(ro, rd, 40.0, pixAng, 200, 0.2);
  // a ray that ran out of steps is deep in a crevice: shade it where it
  // stopped (AO darkens it) instead of letting the backdrop show through
  if (th < -1.5) th = gLastT;

  vec3 col = th > 0.0 ? shadeMetal(ro + rd * th, rd, th, pixAng, true) : backdrop(rd, uv);
  col += sparks(ro, rd, th > 0.0 ? th : 1e9, pixAng);
  return col;
}

//@label gully-eroded fbm · rayleigh/mie sky · raymarched cloud sea
//@grade exposure=1.05 bloom=0.07 sat=1.1 contrast=1.08 vignette=0.38 ca=0.004 grain=0.027 tint=1.05,1.0,0.93
// ============================================================================
// 02 WORLD — a planet at dawn.
// Shot A (0-4 s): a fast, low flight along an eroded range into the low sun.
// Shot B (4-8 s): a crane up behind a hero summit; the sun breaks over its
// shoulder at 6 s and the sea of clouds opens out to the horizon.
// ============================================================================

const float SUN_EL = 0.055;   // ~3.1 deg above the horizon
const float SUN_AZ = 0.40;    // radians to the right of -z
const vec3 SUN = vec3(sin(SUN_AZ) * cos(SUN_EL), sin(SUN_EL), -cos(SUN_AZ) * cos(SUN_EL));

#define C_BASE 0.95

#define KM     2.0
#define CUT    3.99   // shot A -> B, just before the bar line: no 180-degree-shutter straddle

// ---------------------------------------------------------------- noise
const mat2 M2 = mat2(0.8, -0.6, 0.6, 0.8);
vec2 grad2(vec2 i) { return hash22(i) * 2.0 - 1.0; }
vec2 vnoise2(vec2 x) {
  vec2 i = floor(x), f = fract(x);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash22(i), hash22(i + vec2(1, 0)), u.x), mix(hash22(i + vec2(0, 1)), hash22(i + vec2(1, 1)), u.x), u.y);
}

vec3 gnoised(vec2 x) {
  vec2 i = floor(x), f = fract(x);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  vec2 ga = grad2(i), gb = grad2(i + vec2(1, 0)), gc = grad2(i + vec2(0, 1)), gd = grad2(i + vec2(1, 1));
  float va = dot(ga, f), vb = dot(gb, f - vec2(1, 0)), vc = dot(gc, f - vec2(0, 1)), vd = dot(gd, f - vec2(1, 1));
  float k = va - vb - vc + vd;
  return vec3(va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * k,

  float vc = dot(grad2(i + vec2(0, 1)), f - vec2(0, 1)), vd = dot(grad2(i + vec2(1, 1)), f - vec2(1, 1));

// ---------------------------------------------------------------- terrain

float seg(vec2 x, vec2 a, vec2 b, float w) {
  vec2 pa = x - a, ba = b - a;
  float h = sat(dot(pa, ba) / dot(ba, ba));
  vec2 d = pa - ba * h;
  float q = max(1.0 - dot(d, d) / (3.0 * w * w), 0.0);   // ~gaussian, compact

float segB(vec2 x, vec2 a, vec2 b, float w, float k) {

  F(vec2(-2.0, 46.0), vec2(0.0, 14.0), 6.5, 1.15)      /* main range (shot A) */ \
  F(vec2(8.3, -13.6), vec2(15.7, -10.4), 3.5, 1.05)    /* hero ridge (shot B) */ \
  F(vec2(-4.0, -33.0), vec2(6.0, -40.0), 6.0, 0.95)    /* mid, ahead */ \
  F(vec2(26.0, -20.0), vec2(34.0, -27.0), 5.0, 0.90)   /* mid, right */ \
  F(vec2(58.0, -58.0), vec2(72.0, -76.0), 9.0, 1.00)   /* far right: the sun rises over open sea */ \
  F(vec2(-40.0, -30.0), vec2(-22.0, -58.0), 9.0, 0.95) /* far left */ \
  F(vec2(-10.0, -95.0), vec2(14.0, -110.0), 12.0, 0.85) /* horizon */ \
  F(vec2(40.0, 10.0), vec2(58.0, -20.0), 8.0, 0.80)    /* right */

vec2 massAt(vec2 x) {

}

float capSD(vec2 x, vec2 a, vec2 b, float w) {
  vec2 pa = x - a, ba = b - a;
  return length(pa - ba * sat(dot(pa, ba) / dot(ba, ba))) - 1.74 * w;
}
#define SEA_F(a, b, w, k) d = min(d, capSD(x, a, b, w));
float seaDist(vec2 x) {
  float d = 1e4;
  RANGES(SEA_F)

}
// Explicit summits: sharp cones the noise and the gullies then sculpt.
// Returns (height, gradient).
vec3 summit(vec2 x, vec2 c, float h, float r) {
  vec2 d = (x - c) / r;

  float q = sqrt(q2 + 0.01);

  return vec3(e, (-2.3 * e / (q * r)) * d);
}
// A horn: a square pyramid (four flat faces, sharp aretes between them)
// blended with the cone, like the glacier-carved peaks of the Alps.
vec3 horn(vec2 x, vec2 c, float h, float r, float ang, float w) {
  vec2 d = (x - c) / r;
  float q2 = dot(d, d);
  if (q2 > 16.0) return vec3(0.0);
  d += 0.2 * (vnoise2(x * 0.7 + 5.0) - 0.5) * smoothstep(0.05, 0.5, sqrt(q2));   // wavy aretes, sharp tip (warp slope ignored)

  vec2 u0 = vec2(cos(ang), sin(ang)), u1 = vec2(-u0.y, u0.x);

}
#define P_HERO vec2(12.0, -12.0)

#define TF 0.16
#define TD 0.9
#define RIDGE 0.55
#define PEAK 1.5
// Macro relief: derivative-damped fbm (IQ) with a ridge fold on the first
// octaves (sharp arêtes). Returns (height, d/dx, d/dz); the gradient is
// analytic (damping term ignored) and steers the gully erosion.
vec3 baseTerrainM(vec2 x, float oct, vec2 mb, out vec2 gc);
vec3 baseTerrain(vec2 x, float oct) { vec2 gc; return baseTerrainM(x, oct, massAt(x), gc); }
// gc: slope of the macro shape only (first 4 octaves + summits), for steep walls
vec3 baseTerrainM(vec2 x, float oct, vec2 mb, out vec2 gc) {

  mat2 A = mat2(TF);
  float a = 0.0, b = 1.0;
  vec2 d = vec2(0.0), g = vec2(0.0);
  gc = vec2(0.0);
  for (int i = 0; i < 10; i++) {
    float fi = float(i);
    if (fi >= oct) break;
    vec3 n = gnoised(p);
    if (i < 2) {
      float s = sqrt(n.x * n.x + 0.01);
      vec3 r = vec3(0.35 - 1.3 * s, (-1.3 * n.x / s) * n.yz);
      n = mix(n, r, RIDGE - 0.2 * fi);
    }
    d += n.yz;
    float w = sat(oct - fi) * b / (1.0 + TD * dot(d, d));
    a += w * n.x;
    g += w * (n.yz * A);
    if (i == 3) gc = g;
    b *= i < 2 ? 0.5 : 0.34;
    p = M2 * p * 2.0;
    A = 2.0 * M2 * A;
  }
  // peaked shaping: h = s * max(a + c, 0)^P  (gradient by the chain rule)
  float c = max(a + 0.62, 0.0);
  float s = 3.3 * mb.x;
  float cp = pow(c, PEAK - 1.0);

  vec3 pk = horn(x, P_HERO, 2.6, 3.2, 1.05, 0.65) + summit(x, vec2(-1.0, 22.0), 1.8, 3.0);

  return vec3(s * cp * c, s * PEAK * cp * g) + pk;
}
// Slope-aligned gully noise (after Fewes / clayjohn / Phacelle): plane waves
// running down the fall line, each lattice corner with its own random phase,
// blended as phasors and renormalized so the contrast stays constant.
// dir = contour direction in radians per cell unit. Returns (value, d/dp).
vec3 gullyNoise(vec2 p, vec2 dir) {
  vec2 ip = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float r0 = hash12(ip), r1 = hash12(ip + vec2(1, 0)), r2 = hash12(ip + vec2(0, 1)), r3 = hash12(ip + vec2(1, 1));

  float p1 = dot(f - vec2(1, 0), dir) + TAU * r1;
  float p2 = dot(f - vec2(0, 1), dir) + TAU * r2;
  float p3 = dot(f - vec2(1, 1), dir) + TAU * r3;
  vec2 cs = mix(mix(vec2(cos(p0), sin(p0)), vec2(cos(p1), sin(p1)), u.x),
                mix(vec2(cos(p2), sin(p2)), vec2(cos(p3), sin(p3)), u.x), u.y);

  return vec3(cs.x, -cs.y * dir);

#define E_FREQ 1.3

#define E_GAIN 0.5
#define E_BRANCH 1.6

vec2 gMedGrad;   // base + first two gully octaves (true slope), for snow placement
float gRibLo;    // gully/rib value of the first two octaves only
float gHLo;      // height of the first two octaves

  float sl = length(grad);

  vec2 gs = grad;
  gMedGrad = grad;
  gRibLo = 0.0; gHLo = 0.0;
  gFineGrad = vec2(0.0);
  float h = 0.0, a = E_AMP, f = E_FREQ;
  for (int i = 0; i < 8; i++) {

    if (fi >= oct) break;
    vec2 dir = vec2(gs.y, -gs.x) * (inversesqrt(dot(gs, gs) + 1e-4) * TAU * 0.85);

    float sq = sqrt(0.5 - 0.5 * e.x + 0.015);

    h += w * e.x;
    gs += w * e.yz * f * E_BRANCH;
    if (i < 2) { gMedGrad += w * e.yz * f; gRibLo = h / E_AMP; gHLo = h; }
    else gFineGrad += w * e.yz * f;
    a *= E_GAIN;
    f *= 2.0;
  }
  rib = h / E_AMP;
  return h;
}
