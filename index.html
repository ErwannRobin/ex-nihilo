float erosionL(vec2 x, vec2 grad, float oct) {
  float sl = length(grad);
  float fade = smoothstep(0.08, 0.8, sl) * (1.0 - 0.7 * smoothstep(1.0, 2.2, sl));
  vec2 gs = grad;
  float h = 0.0, a = E_AMP, f = E_FREQ;
  for (int i = 0; i < 8; i++) {
    float fi = float(i);
    if (fi >= oct) break;
    vec2 dir = vec2(gs.y, -gs.x) * (inversesqrt(dot(gs, gs) + 1e-4) * TAU * 0.85);
    vec3 e = gullyNoise(x * f + fi * 17.31, dir);
    float sq = sqrt(0.5 - 0.5 * e.x + 0.015);
    e = vec3(1.0 - 2.0 * sq, e.yz * min(0.5 / sq, 3.0));
    float w = sat(oct - fi) * a * fade;
    h += w * e.x;
    gs += w * e.yz * f * E_BRANCH;
    a *= E_GAIN;
    f *= 2.0;
  }
  return h;
}
float terrain(vec2 x, float ob, float oe) {
  vec3 b = baseTerrain(x, ob);
  return b.x + (oe > 0.0 ? erosionL(x, b.yz, oe) : 0.0);
}
float terrainR(vec2 x, float ob, float oe, out float rib, out vec2 gb, out vec2 gc) {
  vec3 b = baseTerrainM(x, ob, massAt(x), gc);
  gb = b.yz;
  rib = 0.0;
  return b.x + erosion(x, b.yz, oe, rib);
}

// ---------------------------------------------------------------- LOD
// octave counts from the pixel footprint (~0.0012 t world units per pixel)
float octB(float t) { return clamp(9.0 - log2(1.0 + t * 0.5), 3.0, 9.0); }
float octE(float t) { return clamp(7.0 - log2(1.0 + t * 0.6), 1.0, 7.0); }
#define MARCH_EO 1.0
// March terrain: open sea (low mass) is known to lie under the cloud floor,
// so it costs one mass lookup (and returns how far the ray may skip);
// elsewhere fewer octaves than the shading. Returns (height, skip).
vec2 terrainM(vec2 x, float t) {
  vec2 mb = massAt(x);
  if (mb.x < 0.2) return vec2(0.9, seaDist(x));
  float rib;
  vec2 gc;
  vec3 b = baseTerrainM(x, t < 4.0 ? 4.0 : 3.0, mb, gc);

}

vec2 terrainS(vec2 x, float ob, float oe) {
  vec2 mb = massAt(x);

  vec2 gc;
  vec3 b = baseTerrainM(x, ob, mb, gc);
  return vec2(b.x + (oe > 0.0 ? erosionL(x, b.yz, oe) : 0.0), 0.0);
}
// highest terrain around x (hero summit vs. everything else): sky rays stop early
float hTop(vec2 x) { vec2 d = x - P_HERO, e = x - vec2(-1.0, 22.0); return min(dot(d, d), dot(e, e)) < 36.0 ? 7.0 : 4.9; }

// ---------------------------------------------------------------- atmosphere
const float RE = 6360.0, RA = 6440.0;
const vec3 BR = vec3(5.8e-3, 13.5e-3, 33.1e-3);
const vec3 BM = vec3(12.0e-3);
const vec3 BO = vec3(0.65e-3, 1.881e-3, 0.085e-3);
// (h, mu) form: r^2 - R^2 written as (h - H)(r + R) -> no float32 cancellation.
float distToTop(float h, float mu) {
  float r = RE + h, b = r * mu, c = (h - (RA - RE)) * (r + RA);
  return -b + sqrt(max(b * b - c, 0.0));
}
float heightAlong(float h0, float mu, float s) {
  float r0 = RE + h0;
  float q = h0 * (2.0 * RE + h0) + 2.0 * r0 * s * mu + s * s;
  return q / (sqrt(r0 * r0 + 2.0 * r0 * s * mu + s * s) + RE);

vec2 densRM(float h) { return vec2(exp(-h / 8.0), exp(-h / 1.4)); }
vec3 extinction(vec2 od) { return BR * od.x + BM * 1.11 * od.y + BO * od.x * 2.4; }
vec2 odSun(float h, float muS) {
  float tl = distToTop(h, muS), ds = tl / 3.0;

// Single-scattering sky (Rayleigh + Mie + ozone) seen from altitude altKm.
vec3 skyRadiance(vec3 rd, float altKm, int N, out vec3 trans, out vec3 mie) {
  rd.y = max(rd.y, 0.004);

  float tmax = distToTop(altKm, mu);
  vec2 odV = vec2(0.0);
  vec3 sR = vec3(0.0), sM = vec3(0.0);
  float fN = float(N);
  for (int i = 0; i < 5; i++) {
    if (i >= N) break;
    float s0 = float(i) / fN, s1 = float(i + 1) / fN;
    float a0 = s0 * s0 * tmax, a1 = s1 * s1 * tmax;
    float s = 0.5 * (a0 + a1);
    float h = heightAlong(altKm, mu, s);
    float muS = (r0 * SUN.y + s * nu) / (RE + h);
    vec2 dd = densRM(h) * (a1 - a0);

    sM += dd.y * att;

}

vec3 gSunCol;   // sunlight at terrain altitude (reddened)
vec3 gSkyAmb;   // sky ambient
vec3 gHorizon;  // in-scatter color for this view direction (sun lobe shadowed by gVis)
float gVis = 1.0;  // fraction of the view ray's air that sees the sun

// ---------------------------------------------------------------- terrain march
#define STEPK 0.75
float marchTerrain(vec3 ro, vec3 rd, float tmax) {
  float t = 0.0;
  if (ro.y > H_MAX) {
    if (rd.y >= 0.0) return -1.0;
    t = (ro.y - H_MAX) / -rd.y;
  }
  // the cloud sea hides everything below its base
  if (rd.y < 0.0) tmax = min(tmax, (ro.y - (C_BASE + 0.12)) / -rd.y);
  float tp = t, dp = 1e3;
  float ixz = 1.0 / max(length(rd.xz), 1e-3);
  for (int i = 0; i < 200; i++) {
    if (t > tmax) return -1.0;
    vec3 p = ro + rd * t;
    vec2 th = terrainM(p.xz, t);
    float d = p.y - th.x;
    float sea = th.y * ixz;
    if (d < 0.0) {
      // secant refinement
      for (int k = 0; k < 2; k++) {
        float tm = tp + (t - tp) * dp / (dp - d);
        vec3 q = ro + rd * tm;
        float dm = q.y - terrainM(q.xz, tm).x;
        if (dm < 0.0) { t = tm; d = dm; } else { tp = tm; dp = dm; }
      }
      return tp + (t - tp) * dp / (dp - d);
    }
    if (d < 0.0008 * t) return t;
    if (rd.y > 0.0 && p.y > hTop(p.xz)) return -1.0;
    tp = t; dp = d;
    t += max(max(d * mix(STEPK, 0.9, sat(t * 0.03)), 0.003 + 0.004 * t), sea);
  }
  return t;
}

// soft = 1 on snow: light scatters under its surface, so micro-relief casts
// no crisp little shadows there (start further out, wider penumbra, no gullies).
float terrainShadow(vec3 p, float jit, float tv, float soft) {
  float res = 1.0, t = 0.02 + 0.05 * soft + 0.03 * jit;
  float k = mix(10.0, 7.0, soft);
  float oe = t < 1.5 && soft < 0.5 ? 1.0 : 0.0;
  int n = tv < 4.0 ? 11 : 7;
  float lift = 0.0;
  for (int i = 0; i < 11; i++) {
    if (i >= n) break;
    vec3 q = p + SUN * t;
    if (q.y > hTop(q.xz)) break;
    vec2 th = terrainS(q.xz, 3.0, t < 1.5 ? oe : 0.0);
    // the shadow surface has fewer octaves than the shaded one: where the fine
    // carving dips below it, start the ray from the coarse surface instead of
    // letting it begin buried (grazing-lit slopes turned to shadow speckle)
    if (i == 0) lift = clamp(th.x - q.y + 0.004, 0.0, 0.25);
    float h = q.y + lift - th.x;
    res = min(res, k * h / t);
    if (res < -0.05) break;
    t += clamp(h * 0.9, 0.04 + 0.08 * t, 3.5);
  }
  res = sat(res);
  return res * res * (3.0 - 2.0 * res);
}
// Long cheap shadow rays for the cloud sea: peaks cast shadows tens of units long.
// Near the camera (tv small) it starts finer and uses one more octave, so
// clouds pooled in shadowed valleys stay in shadow.
float farShadow(vec3 p, float jit, float tv) {
  float nr = 1.0 - smoothstep(4.0, 10.0, tv);
  float res = 1.0, t = mix(0.05 + 0.4 * jit, 0.03 + 0.1 * jit, nr);
  float ob = 2.0 + nr, smin = mix(0.25, 0.08, nr);
  for (int i = 0; i < 9; i++) {
    vec3 q = p + SUN * t;
    if (q.y > hTop(q.xz)) break;
    vec2 th = terrainS(q.xz, ob, 0.0);
    float h = q.y - th.x;
    res = min(res, 4.0 * h / t);
    if (res < -0.05) break;
    t += clamp(h * 1.4, smin, 4.0);
  }
  res = sat(res);
  return res * res * (3.0 - 2.0 * res);
}

// ---------------------------------------------------------------- rock
// Cellular facets: every cell is a flat face with its own random tilt, like
// fractured granite; the gap to the next cell marks the cracks.
vec3 facet2(vec2 p) {
  vec2 ip = floor(p), fp = fract(p);
  float d1 = 8.0, d2 = 8.0;
  vec2 c1 = ip;
  for (int j = -1; j <= 1; j++)
  for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j));
    vec2 r = g + 0.1 + 0.8 * hash22(ip + g) - fp;
    float d = dot(r, r);
    if (d < d1) { d2 = d1; d1 = d; c1 = ip + g; } else if (d < d2) d2 = d;
  }
  return vec3(hash22(c1 + 31.7) - 0.5, sqrt(d2) - sqrt(d1));
}
// Triplanar facets around the coarse normal nc: world-space tilt (xyz) and crack gap (w).
vec4 rockFacets(vec3 p, vec3 nc, float fq) {
  vec3 w = nc * nc; w *= w;
  w /= dot(w, vec3(1.0));
  vec4 acc = vec4(0.0);
  float ws = 0.0;
  if (w.x > 0.06) { vec3 f = facet2(p.zy * fq);       acc += w.x * vec4(0.0, f.y, f.x, f.z); ws += w.x; }
  if (w.y > 0.06) { vec3 f = facet2(p.xz * fq + 7.1); acc += w.y * vec4(f.x, 0.0, f.y, f.z); ws += w.y; }
  if (w.z > 0.06) { vec3 f = facet2(p.xy * fq + 3.7); acc += w.z * vec4(f.x, f.y, 0.0, f.z); ws += w.z; }
  return acc / ws;
}
// Triplanar value noise: mottling that stays isotropic on cliffs (a top-down
// lookup would stretch into vertical streaks there).
float triNoise(vec3 p, vec3 nc) {
  vec3 w = nc * nc; w *= w;
  w /= dot(w, vec3(1.0));
  float acc = 0.0, ws = 0.0;
  if (w.x > 0.1) { acc += w.x * vnoise(p.zy);       ws += w.x; }
  if (w.y > 0.1) { acc += w.y * vnoise(p.xz + 4.3); ws += w.y; }
  if (w.z > 0.1) { acc += w.z * vnoise(p.xy + 8.9); ws += w.z; }
  return acc / ws;
}

float gLbl;   // 1 under the on-screen scene label while it shows (a passing cloud shadow there)

vec3 shadeTerrain(vec3 p, vec3 rd, float t, float jit) {
  float ob = octB(t), oe = octE(t);
  float e = 0.0015 + 0.0011 * t;
  float rib; vec2 gb, gcb;
  float h = terrainR(p.xz, ob, oe, rib, gb, gcb);
  vec2 gm = gMedGrad;
  float ribLo = gRibLo;
  // normal: coarse part (base + two gully octaves) by finite differences, the
  // fine gully octaves by their analytic slope (saves 2 full evaluations)
  float hc = h - (rib * E_AMP - gHLo);
  vec2 gf = gFineGrad;
  float hx = terrain(p.xz + vec2(e, 0.0), ob, min(oe, 2.0));
  float hz = terrain(p.xz + vec2(0.0, e), ob, min(oe, 2.0));
  vec3 nm = normalize(vec3(-gm.x, 1.0, -gm.y));        // medium-scale normal
  // on steep walls the fine fall-line gullies would streak like draped cloth:
  // there the rock facets below carry the detail instead
  float steep = sat((0.8 - nm.y) * 3.0);
  vec2 gt = vec2(hx - hc, hz - hc) / e + gf;
  vec2 gcs = gcb + gm - gb;                            // macro shape + the big gullies
  gt = mix(gt, gcs, 0.8 * steep);
  vec3 n = normalize(vec3(-gt.x, 1.0, -gt.y));
  p.y = max(p.y, h);
  float ribS = mix(rib, ribLo, steep);                 // walls: only the big couloirs show
  float nz = vnoise(p.xz * 1.7);

  // rock structure: two octaves of angular facets, and on steep ground the
  // strata step into ledges (flat treads that hold snow, dark risers between)
  float fadeB = exp(-t * 0.09);
  vec4 f1 = rockFacets(p, nm, 5.0);
  float f2w = 1.0 - smoothstep(4.5, 7.0, t);                       // the fine octave fades out with distance
  vec4 f2 = f2w > 0.0 ? rockFacets(p, nm, 13.5) : vec4(0.0);
  vec3 tilt = (f1.xyz * 0.45 + f2.xyz * 0.22 * f2w) * fadeB;
  float crack = mix(1.0, smoothstep(0.0, 0.07, f1.w) * (1.0 - 0.3 * f2w * (1.0 - smoothstep(0.0, 0.06, f2.w))), fadeB * steep);
  // (irregular spacing: thick and thin beds by height, warped along the face)
  float band = (p.y + 0.3 * p.x - 0.12 * p.z) * 4.5 + 1.5 * vnoise(vec2(p.y * 1.3, 7.0)) + 1.6 * vnoise(p.xz * 0.9 + 1.7) + 0.5 * vnoise(p.xz * 3.1) + 0.3 * f1.x;
  float fb = fract(band + 0.12 * (vnoise(p.xz * 14.0 + p.y * 3.0) - 0.5) * fadeB);   // ragged lips
  float bi = floor(band);
  float bandOn = smoothstep(0.35, 0.6, vnoise(vec2(bi * 3.7, 0.0) + p.xz * 0.9));   // broken, not every band
  float lw = 0.6 + 0.25 * hash11(bi * 1.37);                                        // ledges of varied depth
  float ledge = smoothstep(lw, lw + 0.12, fb) * steep * fadeB * bandOn;
  float riser = (1.0 - smoothstep(0.0, 0.35, fb)) * steep * fadeB * bandOn;   // just under a lip: overhang shade

  // snow: holds on gentle slopes (medium scale) and upward-facing facets,
  // collects in gullies and on the ledges, above a ragged snow line
  float snowLine = 1.4 + 0.5 * nz;
  float cover = smoothstep(snowLine, snowLine + 0.35, p.y);
  float fy = normalize(nm + tilt * 1.2).y;
  float sy = mix(nm.y, fy, 0.6) - 0.14 * ribLo - 0.04 * (ribS - ribLo) + 0.12 * (nz - 0.5);
  float snow = cover * smoothstep(0.6, 0.78, sy) * smoothstep(0.0, 0.3, n.y);
  float ledgeHold = smoothstep(0.3, 0.6, vnoise(p.xz * 2.4 + bi * 5.1));          // snow lies in patches along a ledge
  snow = max(snow, cover * ledge * ledgeHold * smoothstep(-0.2, 0.4, fy + 0.3 * (nz - 0.5)));
  float couloir = smoothstep(0.45, 0.85, -ribLo) * smoothstep(0.35, 0.65, vnoise(p.xz * 1.1 + 3.0));
  snow = max(snow, cover * steep * couloir * smoothstep(0.35, 0.6, crack));   // a few deep couloirs
  // a fine lace of snow on the small ledges of steep rock
  float band2 = band * 2.7 + 0.35 * vnoise(p.xz * 9.0) + 0.4 * f2.x * f2w;
  float dash = smoothstep(0.6, 0.8, vnoise(vec2(floor(band2) * 5.3, 0.0) + p.xz * 3.0));
  snow = max(snow, 0.7 * cover * steep * smoothstep(0.86, 0.95, fract(band2)) * dash * exp(-t * 0.05));

  // final normal: facets and ledge treads on rock, smoothed under the snow
  vec3 nr = normalize(n + tilt + vec3(0.0, 0.5 * ledge - 0.2 * riser, 0.0));
  n = normalize(mix(nr, n, snow * 0.75));
  float strata = vnoise(vec2(band * 1.7 + 2.0 * nz, 0.5));
  vec3 rock = mix(vec3(0.10, 0.092, 0.088), vec3(0.28, 0.245, 0.21), sat(0.5 + 0.6 * (strata - 0.5) + 0.45 * (triNoise(p * 3.5, nm) - 0.5) + (t < 10.0 ? 0.3 * (triNoise(p * 11.0, nm) - 0.5) : 0.0)));
  rock *= (0.8 + 0.35 * sat(ribS * 0.5 + 0.5)) * (1.0 - 0.35 * riser);
  vec3 alb = mix(rock, vec3(0.9, 0.92, 0.96) * (0.92 + 0.08 * nz), snow);

  float occ = sat(0.72 + 0.4 * ribS) * mix(mix(0.7, 1.0, crack) * (1.0 - 0.3 * riser), 1.0, snow);
  float sh = terrainShadow(p + n * 0.004, jit, t, snow);
  float cs = 1.0 - smoothstep(0.2, 0.8, gLbl + 0.7 * (vnoise(p.xz * 0.7 + 4.0) - 0.5) + 0.2 * (nz - 0.5));   // label zone: a passing cloud's shadow
  sh *= cs;
  float ndl = dot(n, SUN);
  float dif = mix(max(ndl, 0.0), sat((ndl + 0.2) / 1.2), snow * 0.6);
  vec3 L = gSunCol * dif * sh;
  // dawn sky: blue zenith from above, the warm aureole on sun-facing facets,
  // the pink-violet anti-twilight on the facets turned away from the sun
  vec2 sxz = normalize(SUN.xz);
  float fs = dot(n.xz, sxz);
  L += (vec3(0.18, 0.26, 0.50) * (0.5 + 0.5 * n.y)
      + vec3(0.55, 0.36, 0.22) * sat(fs) * sat(1.0 - n.y) * 0.6
      + vec3(0.28, 0.20, 0.30) * sat(-fs) * 0.35) * occ;
  // warm bounce from the sunlit cloud sea below
  float nearCloud = exp(-max(p.y - C_TOP, 0.0) * 0.5);
  L += gSunCol * 0.022 * vec3(1.0, 0.9, 0.8) * sat(0.55 - 0.45 * n.y) * nearCloud * occ * mix(0.15, 1.0, sh) * cs;
  vec3 col = alb * L;
  // backlit rim: silhouette edges glow toward the sun
  col += gSunCol * 0.04 * pow(1.0 - sat(dot(n, -rd)), 4.0) * pow(sat(dot(rd, SUN)), 6.0) * sh;
  return col;
}

// ---------------------------------------------------------------- cloud sea
// the deck drifts; faster under the crane, so the tops flow past the lens
#define CDRIFT (uLocal < CUT ? uLocal * 0.01 : uLocal * 0.035 - 0.1)
float cloudTop(vec2 x, float oct) {
  vec2 q = x * 0.5 + vec2(0.0, CDRIFT);
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 7; i++) {
    float fi = float(i);
    if (fi >= oct) break;
    s += sat(oct - fi) * a * abs(gn2(q));
    q = M2 * q * 2.1 + vec2(1.7, 9.2);
    a *= 0.48;
  }
  s = sqrt(s * 2.2);
  float swell = vnoise(x * 0.07 + 7.0);
  return C_BASE + 0.2 * swell + 0.3 * s;
}
// Cheap upper bound of cloudTop (3 octaves + the most the rest can add):
// lets rays skip down to the billows fast.
float cloudTopUB(vec2 x) {
  vec2 q = x * 0.5 + vec2(0.0, CDRIFT);
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 3; i++) {
    s += a * abs(gn2(q));
    q = M2 * q * 2.1 + vec2(1.7, 9.2);
    a *= 0.48;
  }
  s = sqrt((s + 0.08) * 2.2);
  return C_BASE + 0.2 * vnoise(x * 0.07 + 7.0) + 0.3 * s;
}
float cloudDens(vec3 p, float oct) { return sat((cloudTop(p.xz, oct) - p.y) * 12.0); }

vec4 marchClouds(vec3 ro, vec3 rd, float tEnd, float jit, out float tFirst) {
  tFirst = -1.0;
  if (rd.y >= -0.0005) return vec4(0.0, 0.0, 0.0, 1.0);
  float t0 = max((ro.y - C_TOP) / -rd.y, 0.0);
  float t1 = min((ro.y - (C_BASE - 0.25)) / -rd.y, tEnd);
  if (t0 >= t1) return vec4(0.0, 0.0, 0.0, 1.0);
  float T = 1.0;
  vec3 acc = vec3(0.0);
  float t = t0, sh = 1.0;
  float mu = dot(rd, SUN);
  float g1 = 0.55, g2 = -0.25;
  float ph1 = (1.0 - g1 * g1) / pow(1.0 + g1 * g1 - 2.0 * g1 * mu, 1.5);
  float ph2 = (1.0 - g2 * g2) / pow(1.0 + g2 * g2 - 2.0 * g2 * mu, 1.5);
  float phase = 0.0796 * mix(ph1, ph2, 0.3);
  bool inside = false;
  float sk = 1.0 / (-rd.y + 0.3 * length(rd.xz)), sk2 = 1.0 / (-rd.y + 0.5 * length(rd.xz));
  vec3 skyC = gSkyAmb;
  float fade = 1.0;
  for (int i = 0; i < 72; i++) {
    if (t > t1 || T < 0.03) break;
    vec3 p = ro + rd * t;
    float ds = 0.016 + 0.005 * t;
    if (!inside) {
      float dhu = p.y - cloudTopUB(p.xz);
      if (dhu > 0.03) { t += max(dhu * sk, ds); continue; }
    }
    float oct = clamp(7.0 - log2(1.0 + t * 0.25), 2.5, 7.0);
    float top = cloudTop(p.xz, inside ? oct : oct - 2.0);   // coarse until the ray enters
    float dh = p.y - top;
    if (dh > 0.03 && !inside) { t += max(dh * sk2, ds); continue; }
    if (!inside) {
      inside = true;
      tFirst = t;
      // the billow's surface orientation where the ray enters: skylight by
      // how much of the sky it faces, a warm tint on the sunward flanks
      float e = 0.035 + 0.002 * t;
      float o2 = max(oct - 2.0, 2.0);
      vec3 nT = normalize(vec3(top - cloudTop(p.xz + vec2(e, 0.0), o2), e, top - cloudTop(p.xz + vec2(0.0, e), o2)));
      skyC = gSkyAmb * (0.3 + 0.7 * nT.y * nT.y) + vec3(0.5, 0.35, 0.25) * sat(dot(nT.xz, normalize(SUN.xz))) * 0.35;
      t -= ds * jit;
      sh = t < 90.0 ? farShadow(p, jit, t) : 1.0;
      // thin out where the ground rises just beneath: ragged shores, not a lake
      fade = smoothstep(0.02, 0.2, p.y - terrainS(p.xz, 3.0, 0.0).x);
      continue;
    }
    float d = sat(-dh * 15.0 + 0.05) * fade;
    if (d > 0.001) {
      float tau = cloudDens(p + SUN * 0.35, 2.5) * 0.9;
      tau *= 26.0;
      float Ts = exp(-tau) + 0.2 * exp(-tau * 0.15);
      float depth = sat(-dh * 5.0);
      // skylight: billow crests see more sky than the troughs between them
      float crest = mix(0.5, 1.2, sat((top - C_BASE - 0.12) * 2.2));
      vec3 S = gSunCol * sh * Ts * phase * 2.6 + skyC * 0.55 * crest * exp(-depth * 2.5);
      // silver lining: thin backlit billow edges
      S += gSunCol * sh * 0.4 * exp(-depth * 12.0) * pow(sat(mu), 8.0) * Ts;
      float sig = d * 30.0;
      float Tst = exp(-sig * ds);
      acc += T * S * (1.0 - Tst);
      T *= Tst;
    }
    t += ds;
  }
  return vec4(acc, T);
}

// ---------------------------------------------------------------- cirrus
// high enough that the craning camera never gets close to the layer
#define Y_CI 16.0
#define CI_S 0.3
vec4 cirrus(vec3 ro, vec3 rd) {
  if (rd.y <= 0.004) return vec4(0.0);
  float tci = (Y_CI - ro.y) / rd.y;
  vec2 q = (ro.xz + rd.xz * tci) * CI_S;
  tci *= CI_S;
  vec2 sd = rot(0.95) * normalize(SUN.xz);
  vec2 w = vec2(dot(q, sd), dot(q, vec2(-sd.y, sd.x)));
  w += 1.5 * vnoise2(q * 0.05) - 0.75;
  float lod = clamp(5.0 - log2(1.0 + tci * 0.05), 1.5, 5.0);
  vec2 sp = w * vec2(0.05, 0.5) + vec2(uLocal * 0.01, 0.0);
  float a = 0.5, st = 0.0;
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    if (fi >= lod) break;
    st += sat(lod - fi) * a * vnoise(sp);
    sp = sp * vec2(2.1, 1.9) + vec2(3.1, 1.7);
    a *= 0.5;
  }
  float cover = smoothstep(0.42, 0.8, vnoise(q * 0.018 + 4.0) * 0.7 + vnoise(q * 0.05) * 0.3);
  float dens = smoothstep(0.5, 0.9, st) * cover;
  dens *= exp(-tci * 0.006);
  float alpha = 1.0 - exp(-dens * 1.1);
  vec3 dv = rd - SUN;
  float om = 0.5 * dot(dv, dv);
  float fwd = 0.35 + 1.0 * exp(-9.0 * om) + 1.2 * exp(-60.0 * om);
  vec3 c = gSunCol * vec3(1.0, 0.82, 0.78) * 0.16 * fwd + gSkyAmb * 0.35;
  return vec4(c, alpha);
}

// ---------------------------------------------------------------- god rays
#define GODR 0.28
float sunVis(vec3 q, float jit, int n, float k) {
  float res = 1.0, t = 0.08 + 0.1 * jit;
  for (int i = 0; i < 6; i++) {
    if (i >= n) break;
    vec3 r = q + SUN * t;
    if (r.y > hTop(r.xz)) break;
    vec2 th = terrainS(r.xz, 2.0, 0.0);
    float h = r.y - th.x;
    res = min(res, k * h / t);
    if (res < 0.0) break;
    t += clamp(h * 1.2, 0.25, 4.0);
  }
  return sat(res);
}
// Fraction of the sun disk visible from the camera (soft, ~0.7 deg penumbra).
// It is the same for every pixel, so it was traced once along both camera
// paths and keyed into flareKey() below (camSunVis stays for re-keying).
float camSunVis(vec3 ro) {
  float res = 1.0, t = 0.05;
  for (int i = 0; i < 13; i++) {
    vec3 q = ro + SUN * t;
    if (q.y > hTop(q.xz)) break;
    vec2 th = terrainM(q.xz, t);   // the same surface the view rays hit
    float h = q.y - th.x;
    res = min(res, 70.0 * h / t);
    if (res < -0.2) break;
    t += clamp(h * 0.8, 0.015 + 0.025 * t, 2.0);
  }
  return smoothstep(-0.2, 1.0, res);
}
// Keyed from camSunVis(): shot A clears the ridge at 1.05 s and loses the sun
// behind the next one at 3.3 s; in shot B the sun breaks over the summit's
// shoulder on the 6 s bar (the snare roll).
float flareKey(float lt) {
  if (lt < CUT) return smoothstep(1.03, 1.07, lt) * (1.0 - smoothstep(3.29, 3.37, lt));
  return smoothstep(5.982, 6.02, lt);
}
// Six-bladed aperture diffraction spikes + soft glare, in camera space.
float gBurst = 0.0;   // 0..1 into the drop: the spikes reach across the frame
vec3 starburst(vec3 rd, mat3 cam, float vis) {
  vec3 dv = rd - SUN;
  vec2 d = vec2(dot(dv, cam[0]), dot(dv, cam[1]));
  float r = length(d);
  if (vis <= 0.0) return vec3(0.0);
  float a = atan(d.y, d.x) + 0.3;
  float am = mod(a + PI / 6.0, PI / 3.0) - PI / 6.0;      // offset to the nearest spike
  float dp = r * abs(sin(am));
  float am2 = mod(a + PI / 3.0, PI / 3.0) - PI / 6.0;      // secondary, rotated set
  float dp2 = r * abs(sin(am2));
  float fall = 0.004 / (r + 0.004) * exp(-r * mix(4.0, 1.2, gBurst));
  float sp = exp(-dp * dp / 6e-6) + 0.35 * exp(-dp * dp / 6e-5);
  float sp2 = 0.25 * exp(-dp2 * dp2 / 4e-6) * exp(-r * 12.0);
  float glow = 0.2 * exp(-r * 18.0) + 0.6 * exp(-r * 90.0);
  vec3 tint = vec3(1.0, 0.93, 0.85);
  return gSunCol * tint * vis * (fall * (sp + sp2) * 1.2 + glow * 0.08);
}

// How much of the air along the view ray sees the sun: the mountains' shadow
// volumes carved out of the haze -> crepuscular shafts (used by the fog's
// forward-scattering lobe and a near-sun glow).
// Shot A: one cheap sample (a soft glow); shot B: eight stratified samples
// with crisper shadow edges, so the summit's notches cast distinct shafts.
float rayVis(vec3 ro, vec3 rd, float tEnd, float jit, bool shafts) {
  int n = shafts ? 8 : 1;
  tEnd = min(tEnd, shafts ? 18.0 : 25.0);
  if (!shafts) jit = 0.5;   // one sample: jittering it only turns the haze into speckle
  float vis = 0.0, fn = float(n);
  for (int i = 0; i < 8; i++) {
    if (i >= n) break;
    float s = tEnd * (float(i) + jit) / fn;
    vis += sunVis(ro + rd * s, fract(jit * 7.3 + float(i) * 0.618), shafts ? 6 : 5, shafts ? 12.0 : 6.0);
  }
  return vis / fn;
}
vec3 godRays(vec3 rd, float tEnd, float vis, bool shafts) {
  vec3 dv = rd - SUN;
  float om = 0.5 * dot(dv, dv);
  float lobe = exp(-om * 60.0) * 0.4 + exp(-om * 14.0) * 0.08;
  float haze = 1.0 - exp(-min(tEnd, 25.0) * 0.05);
  if (shafts) { vis = smoothstep(0.15, 0.85, vis); lobe *= 2.0; }
  return gSunCol * lobe * haze * vis * GODR;
}

vec3 applyFog(vec3 col, vec3 ro, vec3 rd, float t) {
  float k = 0.9;
  float fogD = 0.04 * exp(-(ro.y - C_BASE) * k);
  float x = k * rd.y * t;
  float fogAmt = fogD * t * (abs(x) > 1e-4 ? (1.0 - exp(-x)) / x : 1.0);
  float tr = exp(-fogAmt - t * 0.012);
  vec3 dv = rd - SUN;
  float om = 0.5 * dot(dv, dv);
  vec3 fogc = gHorizon * mix(vec3(0.85, 0.9, 1.15), vec3(1.0), exp(-4.0 * om)) + gSunCol * 0.025 * exp(-8.0 * om) * gVis;
  fogc = mix(gSkyAmb * 0.8 + fogc * 0.3, fogc, gVis);   // haze in a mountain's shadow is lit by the sky only
  return col * tr + fogc * (1.0 - tr);
}

// ---------------------------------------------------------------- camera
#define A_CLEAR 0.42
#define A_YAW 0.0
#define A_PITCH -0.36
#define B_D0 6.0
#define B_D1 3.2
#define B_L0 0.95
#define B_L1 0.7
#define B_Y0 1.9
#define B_Y1 6.4
#define B_YAW0 0.26
#define B_YAW1 0.36
#define B_P0 0.2
#define B_P1 -0.16
#define B_PUSH 1.2
#define B_T0 0.13      // phase of the crane: the sun clears the shoulder on the 6 s bar
float pathX(float lt) { return -1.2 + 0.9 * sin(lt * 0.9 + 0.5); }
vec2 pathA(float lt) { return vec2(pathX(lt), 40.0 - lt * 3.1); }
// Shot A's altitude follows the ground: a smooth max (log-sum-exp) of the
// terrain just behind and ahead of the camera, so it climbs early and never
// jerks. It is the same for every pixel, so camAltTrace() was sampled every
// 0.03 s along the path into CAM_H (Catmull-Rom between samples).
float camAltTrace(float u) {
  float acc = 0.0;
  for (int k = 0; k < 4; k++) {
    float hk = terrain(pathA(u - 0.08 + float(k) * 0.16), 3.0, 1.0) + A_CLEAR;
    acc += exp(6.0 * (hk - 3.0));
  }
  return 3.0 + (log(acc) - log(4.0)) / 6.0;
}
const float CAM_H[144] = float[144](
  2.746, 2.686, 2.627, 2.559, 2.473, 2.398, 2.359, 2.334, 2.297, 2.236, 2.170, 2.117,
  2.074, 2.055, 2.020, 1.972, 1.947, 1.945, 1.966, 1.971, 1.928, 1.898, 1.894, 1.906,
  1.935, 1.970, 2.010, 2.066, 2.129, 2.188, 2.238, 2.283, 2.324, 2.361, 2.396, 2.432,
  2.463, 2.494, 2.531, 2.596, 2.719, 2.869, 2.955, 2.988, 2.979, 2.957, 2.982, 3.033,
  3.062, 3.057, 3.021, 3.010, 3.045, 3.084, 3.107, 3.066, 3.031, 3.043, 3.080, 3.113,
  3.084, 3.039, 3.016, 2.998, 3.014, 3.002, 2.951, 2.920, 2.904, 2.902, 2.941, 2.912,
  2.918, 2.922, 2.873, 2.855, 2.867, 2.902, 2.928, 2.896, 2.879, 2.898, 2.934, 2.922,
  2.877, 2.863, 2.883, 2.926, 2.938, 2.883, 2.840, 2.836, 2.871, 2.896, 2.836, 2.771,
  2.760, 2.803, 2.855, 2.828, 2.762, 2.736, 2.752, 2.797, 2.826, 2.795, 2.762, 2.754,
  2.773, 2.805, 2.799, 2.777, 2.771, 2.783, 2.807, 2.809, 2.793, 2.785, 2.793, 2.814,
  2.816, 2.779, 2.748, 2.732, 2.746, 2.760, 2.775, 2.748, 2.719, 2.725, 2.748, 2.768,
  2.766, 2.746, 2.740, 2.734, 2.734, 2.750, 2.734, 2.758, 2.775, 2.771, 2.775, 2.762);
float camAltA(float u) {
  float x = (u + 0.12) / 0.03;
  int i = int(floor(x));
  float f = x - float(i);
  float p0 = CAM_H[clamp(i - 1, 0, 143)], p1 = CAM_H[clamp(i, 0, 143)];
  float p2 = CAM_H[clamp(i + 1, 0, 143)], p3 = CAM_H[clamp(i + 2, 0, 143)];
  return p1 + 0.5 * f * (p2 - p0 + f * (2.0 * p0 - 5.0 * p1 + 4.0 * p2 - p3 + f * (3.0 * (p1 - p2) + p3 - p0)));
}
void camera(float lt, out vec3 ro, out vec3 ta, out float roll, out float focal) {
  if (lt < CUT) {
    // Shot A: fast, low flight along the main range, heading into the dawn.
    float u = clamp(lt, -0.1, CUT + 0.1);
    vec2 q = pathA(u);
    float h = camAltA(u);
    ro = vec3(q.x, h, q.y);
    vec2 q2 = pathA(u + 0.8);
    vec3 fwd = normalize(vec3(q2.x - q.x, 0.0, q2.y - q.y));
    fwd = rotY(A_YAW) * fwd;
    ta = ro + fwd * 4.0 + vec3(0.0, A_PITCH, 0.0);
    float lat = pathX(u + 0.25) - 2.0 * pathX(u) + pathX(u - 0.25);
    roll = clamp(-lat * 3.0, -0.12, 0.12);
    focal = 1.5;
  } else {
    // Shot B: crane up from just above the cloud tops behind the hero summit;
    // the sun breaks over it, then the sea of clouds opens up to the horizon.
    float u = clamp((lt - CUT - B_T0) / (8.0 - CUT - B_T0), -0.03, 1.02);
    float e = u * u * u * (u * (u * 6.0 - 15.0) + 10.0);
    float em = mix(u, e, 0.4);   // already moving at the cut: no dead stop after shot A
    vec2 sf = normalize(SUN.xz);
    vec2 sp = vec2(-sf.y, sf.x);   // camera-right: the sun breaks just right of the summit
    vec2 c0 = P_HERO - sf * B_D0 + sp * B_L0, c1 = P_HERO - sf * B_D1 + sp * B_L1;
    vec2 cxz = mix(c0, c1, em);
    ro = vec3(cxz.x, mix(B_Y0, B_Y1, em), cxz.y);
    ro.xz += sf * B_PUSH * (u - 0.5);   // a slow push in toward the summit
    float yaw = mix(B_YAW0, B_YAW1, em);
    vec3 fwd = rotY(-yaw) * vec3(0.0, 0.0, -1.0);
    ta = ro + fwd * 4.0 + vec3(0.0, 4.0 * tan(mix(B_P0, B_P1, em)), 0.0);
    roll = 0.06 * (1.0 - smoothstep(0.0, 0.3, u));   // the bank of the flight settles
    focal = mix(1.65, 1.45, em);
  }
}

vec3 renderScene(vec2 fc) {
  vec2 uv = screenUV(fc);
  // per-pixel time jitter across one subframe slot (8 spp, 180-degree shutter at
  // 60 fps): near-field edges blur into a smooth streak instead of 8 copies
  float lt = clamp(uLocal + (hash12(fc + uSample.zw * 917.0 + 3.7) - 0.5) / 960.0, -0.1, uDur + 0.1);
  vec3 ro, ta; float roll, focal;
  camera(lt, ro, ta, roll, focal);
  vec2 shk = vec2(vnoise(vec2(uLocal * 17.0, 1.3)), vnoise(vec2(uLocal * 17.0, 8.9))) - 0.5;
  float fwdLen = length(ta - ro);
  ta += (vec3(shk.x, shk.y, 0.0) * 0.05 * uImpact + vec3(0.0, -0.006 * uKick, 0.0)) * fwdLen;
  mat3 cam = lookAt(ro, ta, roll);
  vec3 rd = normalize(cam * vec3(uv, focal));
  float jit = pixelRand(fc);

  vec2 odc = odSun(1.5 * KM, SUN.y);
  gSunCol = 26.0 * exp(-extinction(odc)) * (1.0 + 0.8 * uRiser * uRiser);
  gSkyAmb = vec3(0.25, 0.33, 0.55);
  // the scene label sits bottom-left during 0.3-3.0 s: keep the sun off that area
  vec2 sv = fc / uRes;
  gLbl = (1.0 - smoothstep(0.0, 1.0, length(max(sv - vec2(0.46, 0.17), 0.0) / vec2(0.26, 0.17))))
       * smoothstep(0.2, 0.5, lt) * (1.0 - smoothstep(2.9, 3.4, lt));
  float t = marchTerrain(ro, rd, 150.0);
  // the sky: full quality where it is seen, coarser where it only tints the haze
  vec3 trV, mie;
  vec3 sky = skyRadiance(rd, max(ro.y, 0.0) * KM, t > 0.0 ? 3 : 5, trV, mie);
  float tc = -1.0;
  vec4 cl = vec4(0.0, 0.0, 0.0, 1.0);
  cl = marchClouds(ro, rd, t > 0.0 ? t : 1e4, jit, tc);
  // sunlit fraction of the air along the ray (only matters near the sun)
  vec3 dv = rd - SUN;
  float om = 0.5 * dot(dv, dv);                 // 1 - cos(angle to the sun)
  float tEnd = t > 0.0 ? t : (tc > 0.0 ? tc : 60.0);
  // how far from the sun the haze shadowing is traced: wide where the camera sits
  // in a mountain's shadow (start of each shot), narrow in the costly mid-flight
  float gate = lt < CUT ? mix(0.2, 0.10, smoothstep(0.6, 1.2, lt)) : 0.16;
  float camVis = flareKey(lt);
  gBurst = smoothstep(7.5, 8.0, lt) * uRiser;
  // near the camera the air shares its (un)lit state; far off it sees the sun
  gVis = mix(camVis, 1.0, sat(tEnd / 25.0));
  bool shafts = lt > CUT;
  // crepuscular shafts: while the sun hides behind the summit, the jagged
  // ridge breaks its glow into light and dark wedges radiating from the disk
  // (the angle is taken in a frame fixed to the sun, so they hold still)
  float shaftK = 1.0;
  if (shafts && om < 0.2) {
    vec3 sx = normalize(cross(SUN, vec3(0.0, 1.0, 0.0))), sy = cross(sx, SUN);
    float ang = atan(dot(rd, sx), -dot(rd, sy));          // seam straight below the sun, behind rock
    float n = 0.65 * vnoise(vec2(ang * 9.0, 0.35 * lt)) + 0.35 * vnoise(vec2(ang * 24.0, 3.1 + 0.5 * lt));
    float str = (1.0 - camVis) * smoothstep(4.4, 5.2, lt) * exp(-om * 12.0);   // gone once the disk is out
    shaftK = mix(1.0, 0.4 + 1.2 * smoothstep(0.25, 0.8, n), 0.8 * str);
  }
  if (om < gate) gVis = mix(rayVis(ro, rd, tEnd, jit, shafts), gVis, smoothstep(0.55 * gate, gate, om));
  gHorizon = sky - mie * (1.0 - gVis);

  vec3 bg;
  if (t > 0.0) {
    bg = applyFog(shadeTerrain(ro + rd * t, rd, t, jit), ro, rd, t);
  } else if (tc > 0.0) {
    bg = gSkyAmb * 0.12;   // under the deck: the dim inside of the cloud, never sky
  } else {
    bg = sky + mie * (shaftK - 1.0) * 0.6;
    vec4 ci = cirrus(ro, rd);
    bg = mix(bg, ci.rgb, ci.a);
    float disk = 1.0 - smoothstep(0.9e-4, 1.5e-4, om);
    bg += 26.0 * trV * disk * 4.5;
    bg += gSunCol * (0.5 * exp(-2500.0 * om) + 0.05 * exp(-300.0 * om));
  }
  vec3 col = bg;
  if (tc > 0.0) {
    vec3 cc = applyFog(cl.rgb / max(1.0 - cl.w, 1e-3), ro, rd, tc) * (1.0 - cl.w);
    col = cc + bg * cl.w;
  }
  col += godRays(rd, tEnd, gVis, shafts) * shaftK;
  // lens: the starburst flares as the disk clears the terrain; swells with the riser
  // (the occlusion test is the same for every pixel: only run it where the flare shows)
  if (om < mix(0.12, 0.6, gBurst)) {
    vec3 sb = starburst(rd, cam, 1.0);
    col += sb * camVis * (1.0 + 2.0 * uRiser);
  }
  // into the drop: the sun's glare swells until it becomes the cut's white flash
  col += gSunCol * 0.035 * gBurst * (exp(-om * 5.0) + 0.3);
  col *= 1.0 + 0.12 * uImpact;
  // graduated filter under the scene label (bottom-left) while it is on screen
  float scrim = 1.0 - smoothstep(0.3, 1.0, length(vec2(sv.x / 0.72, sv.y / 0.36)));
  scrim *= smoothstep(0.2, 0.6, lt) * (1.0 - smoothstep(2.6, 3.3, lt));
  col *= (1.0 - 0.3 * scrim) / (1.0 + 0.5 * scrim * luma(col));   // a touch darker, highlights rolled off
  return col;
}
</script>
<script type="x-shader" data-name="scene:city">
//@label dda grid-traced city · emissive haze · wet reflections
//@grade exposure=1.0 bloom=0.1 sat=1.1 contrast=1.06 vignette=0.42 ca=0.004 grain=0.02 tint=1,1,1 lift=0.1,0.05,0.3
// ============================================================================
// 03 CITY — THE DROP. Four shots, hard cuts on bars:
//   A 0-2  street-level canyon rush; the neon ignites in a scanline racing down the avenue
//   B 2-4  spiral dive down the megatower's media facade, tipping over onto a landing
//          medallion on its plaza (a bullseye that pre-echoes D's gates)
//   C 4-6  aerial swoop over the grid: dark monoliths, setback supertalls with masts and
//          blinking aviation beacons, searchlights, flying traffic, far skyline
//   D 6-8  through ring gates spanning the canyon, accelerating into the cut
// The city is a 2D grid of blocks walked exactly with a DDA (cell by cell,
// analytic ray/box hits: no marching, no holes, no overstepping). Lit windows
// are interior-mapped rooms (a virtual box behind the glass, ray-intersected),
// box-filtered by the pixel footprint in the distance AND by the camera's travel
// during the shutter (motion-aware prefilter: clean streaks, no ghost ladders);
// neon, signs, gates and light trails are analytic; haze is an exponential
// height fog plus a luminous street-level layer, continuous into the sky at the
// horizon; the wet street takes anisotropic (streaky) glossy reflections; neon signs
// haze the humid air (closest-approach glow per sign). Window colour temperature is
// chosen per building, so walls streaked by the motion blur stay amber or cyan.
// Music: every kick fires a shock-front of light through the city (down the
// avenue, or out from the megatower) and pumps the mid-tones like a sidechain;
// every clap cuts the neon for a few frames and flashes the haze cold.
// ============================================================================

const vec2 CELL = vec2(56.0, 44.0);
const vec3 MEGA = vec3(0.0, 0.0, 4200.0);
const vec2 PAD  = vec2(121.40, 4022.55);   // shot B lands here: MEGA.xz + 215 * (sin 0.6, -cos 0.6)
const vec3 TAIL = vec3(1.0, 0.035, 0.02);
const vec3 HEAD = vec3(1.0, 0.80, 0.58);
const vec3 HOT  = vec3(1.0, 0.55, 0.95);

int   gShot;
float gT;        // shot-local time (per-pixel shutter jitter included)
float gPix;      // radians per pixel
float gTOff;     // extra ray length (reflections) for footprint estimates
float gHmax;     // tallest building (slab clip)
float gNeon;     // kick pulse (and the clap blackout)
float gStrobe;   // snare strobe
float gCamZ;     // camera z (shot A ignition wave, kick fronts)
vec2  gCamXY;    // camera x,y (radial motion footprint)
float gKz;       // kick shock-front: z (A, D) or radius from the megatower (B)
float gFogD, gFogH;
vec3  gFogA, gFogB, gFogHi, gHorz;
float gHorzK;
float gGlowD, gGlowH, gGlowMax;   // luminous street-level haze (lit by the city from below)
vec3  gGlowA, gGlowB;
float gGlowK = 1.0;               // scales the in-scatter (close gate hits)
float gWinBand = 0.5;             // how strongly whole floors light up together
vec3  gTan = vec3(0.0, 0.0, 1.0); // view ray in facade tangent space (u, v, into the wall)
vec3  gTierC = vec3(-1.0);        // megatower: one colour temperature per tier
float gNeonDen;                   // how many ordinary towers carry neon trim
float gMotZ;                      // metres the camera travels along +z during the shutter
float gMotY, gMotH;               // shot B: vertical dive / orbit travel during the shutter
bool  gSpires = false;            // shot C: accumulate spire + aviation beacon glows in the DDA
vec3  gSpireAcc = vec3(0.0);

// ---------------------------------------------------------------- helpers
vec3 neonPal(float h) {
  h = fract(h);
  if (h < 0.32) return vec3(1.0, 0.05, 0.48);   // magenta
  if (h < 0.58) return vec3(0.04, 0.62, 1.0);   // cyan
  if (h < 0.76) return vec3(1.0, 0.38, 0.03);   // amber
  if (h < 0.89) return vec3(0.52, 0.10, 1.0);   // violet
  return vec3(1.0, 0.06, 0.10);                 // red
}
float pulseInt(float x, float w) { return floor(x) * w + min(fract(x), w); }
// Box-filtered pulse train (period 1, duty w) over a filter of width fw.
float fpulse(float x, float w, float fw) {
  fw = max(fw, 1e-3);
  return (pulseInt(x + 0.5 * fw, w) - pulseInt(x - 0.5 * fw, w)) / fw;
}
// Anti-aliased line of width w at distance d, for a pixel footprint fp (energy-preserving).
float aaLine(float d, float w, float fp) {
  float W = max(w, fp);
  return sat(1.0 - abs(d) / W) * (w / W);
}
float sdSeg(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * sat(dot(pa, ba) / dot(ba, ba))); }

// ---------------------------------------------------------------- THE DROP
// Shot A: the city's lights ignite behind a razor scanline racing away down the avenue.
float waveFront() { float x = max(gT - 0.12, 0.0); return gCamZ + 20.0 + 240.0 * x + 700.0 * x * x; }
float waveD(float z) { return waveFront() - z; }          // > 0: behind the front (lit)
float igOn(float z) { return gShot == 0 ? smoothstep(-1.5, 1.5, waveD(z)) : 1.0; }
// Every kick: a shock-front of light (a plane racing down the canyon in A/D, a ring
// expanding from the megatower's base in B).
float kickD(vec3 p) { return gShot == 1 ? length(p.xz - PAD) - gKz : p.z - gKz; }
// Applies both fronts to EMISSIVE radiance e (never to the dark base materials).
vec3 lightUp(vec3 e, vec3 p, float fp, float lineK) {
  float on = 1.0;
  vec3 add = vec3(0.0);
  if (gShot == 0) {
    float d = waveD(p.z);
    on = smoothstep(-1.0, 1.0, d);
    // razor leading edge, a coloured afterglow behind it (signs overshoot as it passes), black ahead
    float edge = 7.0 * exp(-abs(d) / 1.2);
    float glow = d > 0.0 ? 2.2 * exp(-d / 12.0) : 0.0;
    add += (edge + glow) * e + edge * 0.35 * luma(e) * HOT + vec3(1.0, 0.3, 0.85) * 7.0 * lineK * aaLine(d, 0.6, fp);
  }
  if (gShot != 2) {
    float k = uKick * on;
    float dk = kickD(p);
    // alternate magenta / cyan fronts beat by beat (the kick envelope belongs to floor(uBeat))
    vec3 KC = gShot == 1 ? vec3(0.45, 0.85, 1.0) : (mod(floor(uBeat), 2.0) < 0.5 ? vec3(1.0, 0.12, 0.75) : vec3(0.1, 0.65, 1.0));
    float w = gShot == 1 ? 1.5 : 1.0;
    add += k * 3.0 * exp(-abs(dk) / 6.0) * e / (1.0 + 0.5 * luma(e)) + sqrt(k) * KC * 7.0 * lineK * aaLine(dk, w, fp);
  }
  return e * on + add;
}

// Glyphs: strokes on a 3x3 node lattice, orthogonal (0-11) and diagonal (12-19).
// A hand-built table of kana / radical-like forms: ソ ツ シ ン ナ カ ク タ ス メ ト キ
// 口 日 王 田 モ ミ レ サ 人 大 コ ヤ (diagonals keep them from reading as Latin letters).
const int GLYPHS[24] = int[24](49280, 49792, 49172, 49168, 16908, 17932, 114720, 114728, 57392, 57344, 8960, 828,
                               3315, 3327, 831, 4095, 830, 397312, 16576, 526860, 25088, 25100, 3123, 13324);
vec4 glyphSeg(int i) {
  if (i < 6) { vec2 a = vec2(float(i % 2), float(i / 2)); return vec4(a, a + vec2(1.0, 0.0)); }
  if (i < 12) { int k = i - 6; vec2 a = vec2(float(k / 2), float(k % 2)); return vec4(a, a + vec2(0.0, 1.0)); }
  if (i == 12) return vec4(0.0, 2.0, 1.0, 1.0);
  if (i == 13) return vec4(1.0, 1.0, 2.0, 0.0);
  if (i == 14) return vec4(0.0, 0.0, 1.0, 1.0);
  if (i == 15) return vec4(2.0, 2.0, 1.0, 1.0);
  if (i == 16) return vec4(1.0, 2.0, 0.0, 1.0);
  if (i == 17) return vec4(1.0, 2.0, 2.0, 1.0);
  if (i == 18) return vec4(0.0, 1.0, 1.0, 0.0);
  return vec4(2.0, 1.0, 1.0, 0.0);
}
// (distance to the live strokes, distance to the one dead tube)
vec2 glyphDist(vec2 q, float seed) {
  int bits = GLYPHS[int(hash11(seed * 1.618 + 0.31) * 23.99)];
  int dead = int(hash11(seed * 2.71 + 0.7) * 19.99);
  float d = 1e3, dd = 1e3;
  for (int i = 0; i < 20; i++) {
    if (((bits >> i) & 1) == 0) continue;
    vec4 s4 = glyphSeg(i);
    float s = sdSeg(q, 0.1 + 0.4 * s4.xy, 0.1 + 0.4 * s4.zw);
    if (i == dead) dd = s; else d = min(d, s);
  }
  return vec2(d, dd);
}
// A sign face: q in [0,sz] metres. At least two characters run along the long axis.
vec3 signFace(vec2 q, vec2 sz, float seed, float fp, float kind) {
  vec3 h = hash31(seed);
  vec3 c1 = neonPal(h.x * 3.3), c2 = neonPal(h.x * 3.3 + 0.37 + 0.2 * h.y);
  float dB = min(min(q.x, sz.x - q.x), min(q.y, sz.y - q.y));
  float border = aaLine(dB - 0.25, 0.2, fp);
  bool vert = sz.y > sz.x;
  float L = vert ? sz.y : sz.x, S = vert ? sz.x : sz.y;
  float cs = max(min(S - 1.0, (L - 1.0) / 2.3), 0.35);
  float pitch = cs * 1.15;
  float n = max(floor((L - 1.0 + 0.15 * cs) / pitch), 1.0);
  float off = 0.5 * (L - (n * pitch - 0.15 * cs));
  float along = vert ? (sz.y - off - q.y) : (q.x - off);
  float across = (vert ? q.x : q.y) - 0.5 * (S - cs);
  float ci = floor(along / pitch);
  vec2 gq = vec2((along - ci * pitch) / cs, across / cs);
  if (vert) gq = vec2(across / cs, 1.0 - (along - ci * pitch) / cs);
  float inside = step(0.0, along) * step(ci, n - 1.0) * step(0.0, across) * step(across, cs);
  float lod = sat(fp / cs * 2.5 - 0.5);
  float st = 0.26 * inside, dead = 0.0;
  if (lod < 1.0 && inside > 0.5) {
    vec2 dg = glyphDist(gq, seed * 7.0 + ci) * cs;
    st = mix(aaLine(dg.x, 0.12 * cs, fp), 0.26, lod);
    dead = aaLine(dg.y, 0.12 * cs, fp) * (1.0 - lod);
  }
  vec3 e;
  if (kind < 0.5) {                                                    // neon tubes on black
    float flick = 0.1 + 0.9 * uHat * step(0.5, fract(h.z * 17.0 + floor(uBeat * 2.0) * 0.31));
    e = c1 * (st + 0.25 * dead * step(h.z, 0.55) * flick) * 4.5 + c1 * 0.04;
  } else {                                                             // lightbox, bright glyphs
    e = mix(c2 * 1.4 + vec3(0.1), vec3(1.0, 0.95, 0.9) * 1.7, st);
    e *= 0.8 + 0.2 * smoothstep(0.0, S, (vert ? q.x : q.y) + 0.3 * S);   // backlight falloff
  }
  return (e + c2 * border * 4.0) * gNeon;
}
float boxHit(vec3 ro, vec3 inv, vec3 lo, vec3 hi, out vec3 n) {
  vec3 t0 = (lo - ro) * inv, t1 = (hi - ro) * inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);
  float a = max(max(tn.x, tn.y), tn.z);
  float b = min(min(tf.x, tf.y), tf.z);
  n = vec3(0.0);
  if (a > b || a <= 0.0) return 1e9;
  if (a == tn.x) n.x = -sign(inv.x); else if (a == tn.y) n.y = -sign(inv.y); else n.z = -sign(inv.z);
  return a;
}
vec3 safeInv(vec3 d) {
  d.x = abs(d.x) < 1e-6 ? 1e-6 : d.x;
  d.y = abs(d.y) < 1e-6 ? 1e-6 : d.y;
  d.z = abs(d.z) < 1e-6 ? 1e-6 : d.z;
  return 1.0 / d;
}
mat3 camBasis(vec3 fw, vec3 up) {
  vec3 cw = normalize(fw);
  vec3 cu = normalize(cross(cw, up));
  return mat3(cu, cross(cu, cw), cw);
}

// ---------------------------------------------------------------- city layout
float streetX(float k) { return abs(mod(k, 4.0)) < 0.5 ? 34.0 : 9.0; }  // streets running along z
float streetZ(float k) { return abs(mod(k, 3.0)) < 0.5 ? 18.0 : 7.0; }  // streets running along x

float bldHeight(vec2 ctr, float h) {
  if (length(ctr - MEGA.xz) < 330.0) return 0.0;            // plaza around the megatower
  float ave = exp(-abs(ctr.x) / 140.0);                      // downtown spine along the avenue
  return 18.0 + 60.0 * h + 180.0 * pow(h, 6.0) + ave * (70.0 + 170.0 * h * h);
}

// podium (lo0,hi0) + tower (lo1,hi1) + setback crown on tall towers (lo2,hi2)
struct Bld { vec3 lo0, hi0, lo1, hi1, lo2, hi2; vec4 hs; float H; bool setb; };
Bld building(vec2 c) {
  Bld b;
  b.hs = vec4(hash22(c * 1.37 + 11.3), hash22(c.yx * 2.71 + 5.1));
  vec2 o = c * CELL;
  vec2 a = o + 0.5 * vec2(streetX(c.x), streetZ(c.y));
  vec2 e = o + CELL - 0.5 * vec2(streetX(c.x + 1.0), streetZ(c.y + 1.0));
  float H = bldHeight(0.5 * (a + e), b.hs.x);
  float P = min(H, 6.0 + 16.0 * b.hs.y);
  b.H = H;
  b.lo0 = vec3(a.x, 0.0, a.y); b.hi0 = vec3(e.x, P, e.y);
  vec2 ins = 1.0 + 6.0 * hash22(c + 7.7);
  vec4 in4 = vec4(ins.x, ins.y, ins.y * 0.8, ins.x * 0.7);   // -x, -z, +x, +z insets
  // towers along the avenue are flush with it: the canyon walls
  if (c.x == 0.0) in4.x = 0.0;
  if (c.x == -1.0) in4.z = 0.0;
  b.lo1 = vec3(a.x + in4.x, 0.0, a.y + in4.y);
  b.hi1 = vec3(e.x - in4.z, H, e.y - in4.w);
  b.setb = H > 140.0;
  b.lo2 = b.lo1; b.hi2 = b.hi1;
  if (b.setb) {                                               // setback: a slimmer crown on top
    float hy = floor(0.72 * H / 3.8) * 3.8;
    vec2 w = (b.hi1.xz - b.lo1.xz) * (0.14 + 0.08 * fract(b.hs.w * 7.3));
    b.hi1.y = hy;
    b.lo2 = vec3(b.lo1.x + w.x, hy, b.lo1.z + w.y);
    b.hi2 = vec3(b.hi1.x - w.x, H, b.hi1.z - w.y);
  }
  return b;
}

bool signsOn(vec2 c) { return (gShot == 0 || gShot == 3) && (c.x == 0.0 || c.x == -1.0); }
// Signboards cantilevered over the avenue (Kowloon style). Returns false if absent.
bool signBox(vec2 c, int j, vec3 lo0, vec3 hi0, out vec3 slo, out vec3 shi, out vec3 sh) {
  sh = hash33(vec3(c, float(j)) * vec3(1.31, 2.17, 7.9) + 0.5);
  float zc = mix(lo0.z + 2.0, hi0.z - 2.0, (float(j) + 0.15 + 0.7 * sh.y) / 3.0);
  float ext = 3.0 + 5.0 * sh.z;
  float y0 = 5.0 + 34.0 * fract(sh.y * 7.7);
  float hgt = 4.0 + 11.0 * fract(sh.z * 5.3);
  float face = c.x == 0.0 ? lo0.x : hi0.x;
  float x0 = c.x == 0.0 ? face - ext : face;
  slo = vec3(x0, y0, zc - 0.3);
  shi = vec3(x0 + ext, y0 + hgt, zc + 0.3);
  return sh.x < 0.72;
}

// ---------------------------------------------------------------- atmosphere
float fogOD(vec3 ro, vec3 rd, float t) {
  t = min(t, 30000.0);
  float k = abs(rd.y) < 1e-4 ? t : (1.0 - exp(min(-rd.y * t / gFogH, 60.0))) * gFogH / rd.y;
  return gFogD * exp(-ro.y / gFogH) * k;
}
float fogT(vec3 ro, vec3 rd, float t) { return exp(-fogOD(ro, rd, t)); }
vec3 fogColor(vec3 ro, vec3 rd, float t) {
  float od1 = gFogD * exp(-ro.y / gFogH);
  float l = min(min(t, 0.7 / max(od1, 1e-6)), 6000.0);
  vec3 pm = ro + rd * l;
  float n = vnoise(pm.xz / 900.0 + 3.1);
  vec3 low = mix(gFogA, gFogB, smoothstep(0.3, 0.75, n));
  vec3 c = mix(low, gFogHi, pow(sat(pm.y / 380.0), 0.6));
  c = mix(c, gHorz, exp(-abs(rd.y) * gHorzK));          // light pollution seen edge-on
  c *= mix(0.2, 1.0, igOn(pm.z));                       // the haze is lit by the city
  return c * (1.0 + 0.9 * gStrobe);
}
// integral of exp(-y/H) along the ray segment [0,t]
float heightInt(vec3 ro, vec3 rd, float t, float H) {
  t = min(t, 30000.0);
  float k = abs(rd.y) < 1e-4 ? t : (1.0 - exp(min(-rd.y * t / H, 60.0))) * H / rd.y;
  return exp(-ro.y / H) * k;
}
vec3 applyFog(vec3 col, vec3 ro, vec3 rd, float t) {
  float T = fogT(ro, rd, t);
  col = col * T + fogColor(ro, rd, t) * (1.0 - T);
  // glowing haze pooled in the streets (local: it never saturates at the horizon)
  float g = gGlowD * heightInt(ro, rd, min(t, gGlowMax), gGlowH);
  float ge = 1.0 - exp(-g);
  vec3 pm = ro + rd * min(t, 600.0) * 0.6;
  vec3 gc = mix(gGlowA, gGlowB, smoothstep(0.35, 0.7, vnoise(pm.xz / 500.0 + 7.3)));
  gc *= 1.0 + 0.3 * uKick + 0.25 * uBass;                            // haze breathes with the bassline
  gc *= mix(0.03, 1.0, igOn(pm.z));
  col = col * exp(-g * 0.35) + gc * ge * gGlowK;
  // the clap: a cold strobe lights up the smoke between us and everything
  col += vec3(0.3, 0.55, 1.0) * gStrobe * (gShot == 0 || gShot == 3 ? 0.2 : 0.1) * (1.0 - exp(-min(t, 2000.0) / 260.0)) * gGlowK;
  return col;
}
vec3 sky(vec3 ro, vec3 rd) {
  float y = rd.y;
  vec3 c = mix(vec3(0.09, 0.02, 0.07), vec3(0.004, 0.005, 0.016), sat(y * 2.5 + 0.03));
  c += gHorz * 0.45 * exp(-max(y, 0.0) * 7.0);                          // glow above the skyline
  if (y > 0.0) {
    const float CH = 1500.0;                                  // cloud deck, lit from below
    float tc = max(CH - ro.y, 50.0) / (y + 0.03);
    vec2 w = ro.xz + rd.xz * tc;
    vec2 q = w / 1100.0;
    float n = fbm(q + vec2(0.0, uTime * 0.03), 5);
    float cl = smoothstep(0.40, 0.85, n);
    float fade = exp(-tc / 9000.0);
    vec3 lit = mix(vec3(0.34, 0.05, 0.22), vec3(0.40, 0.14, 0.06), vnoise(q * 0.3));
    float bd = length(w - MEGA.xz);
    lit += vec3(0.3, 0.6, 1.0) * 1.4 * exp(-bd / 350.0) * (1.0 + uKick);   // the beam punches the deck
    c = mix(c, lit * (0.25 + 0.75 * n), cl * fade * 0.9);
  }
  return c + vec3(0.6, 0.7, 1.0) * 0.25 * gStrobe;
}
vec3 envRefl(vec3 R, float py) {
  vec3 c = mix(gFogA * 0.8, gFogHi, sat(R.y * 1.8 + py / 600.0)) * 0.7;
  c *= mix(0.25, 1.0, smoothstep(-0.35, 0.05, R.y));   // looking down at dark streets
  return c + vec3(0.5, 0.7, 1.0) * 0.12 * gStrobe;
}

// ---------------------------------------------------------------- light lines
// Ray vs infinite line along z through (q.x,q.y): (distance, ray t, z at closest approach)
vec3 lineZ(vec3 ro, vec3 rd, vec2 q) {
  vec2 o = ro.xy - q;
  float t = -dot(o, rd.xy) / max(dot(rd.xy, rd.xy), 1e-10);
  return vec3(length(o + rd.xy * t), t, ro.z + rd.z * t);
}
vec3 lineX(vec3 ro, vec3 rd, vec2 q) { // along x through (y,z) = q
  vec2 o = ro.yz - q;
  float t = -dot(o, rd.yz) / max(dot(rd.yz, rd.yz), 1e-10);
  return vec3(length(o + rd.yz * t), t, ro.x + rd.x * t);
}
vec3 lineY(vec3 ro, vec3 rd, vec2 q) { // vertical through (x,z) = q
  vec2 o = ro.xz - q;
  float t = -dot(o, rd.xz) / max(dot(rd.xz, rd.xz), 1e-10);
  return vec3(length(o + rd.xz * t), t, ro.y + rd.y * t);
}
float glowProfile(float d, float t, float r) {
  float w = max(r, (t + gTOff) * gPix * 0.75);
  return (r / w) * exp(-d * d / (w * w)) + 0.035 * exp(-d / 2.2);
}
// a point light seen through the haze (aviation beacons)
vec3 beacon(vec3 ro, vec3 rd, float tHit, vec3 P, vec3 c) {
  vec3 D = P - ro;
  float tp = dot(D, rd);
  if (tp < 0.0 || tp > tHit + 20.0) return vec3(0.0);
  float d = length(D - rd * tp);
  float r = max(1.5, tp * gPix);
  return c * (r * r / (d * d + r * r)) * (2.0 / r) * fogT(ro, rd, tp);
}
// shot C: a lit mast + a red aviation beacon on top of every supertall
void spireGlow(vec3 ro, vec3 rd, Bld b, float tl) {
  vec2 c = 0.5 * (b.lo2.xz + b.hi2.xz);
  float sh = 22.0 + 30.0 * b.hs.z;
  vec3 L = lineY(ro, rd, c);
  if (b.hs.z > 0.45 && L.y > 0.0 && L.y < tl && L.z > b.H && L.z < b.H + sh)   // a lit mast on some
    gSpireAcc += vec3(1.0, 0.75, 0.6) * 0.5 * glowProfile(L.x, L.y, 0.3) * fogT(ro, rd, L.y) * (0.4 + 0.6 * sat((L.z - b.H) / sh));
  float blink = step(0.5, fract(uBeat * 0.5 + b.hs.w * 3.7));
  gSpireAcc += beacon(ro, rd, tl, vec3(c.x, b.H + sh + 1.0, c.y), vec3(1.0, 0.07, 0.03) * 5.0 * (0.12 + 0.88 * blink));
}

struct Hit { float t; vec3 n; vec2 cell; float part; };

// parts: 0 podium, 1 tower, 2-4 signs, 5 setback crown
Hit traceCity(vec3 ro, vec3 rd, float tmax, int maxSteps) {
  Hit h; h.t = 1e9; h.n = vec3(0.0, 1.0, 0.0); h.cell = vec2(0.0); h.part = -1.0;
  vec3 inv = safeInv(rd);
  float t = 0.0;
  if (ro.y > gHmax) { if (rd.y >= 0.0) return h; t = (ro.y - gHmax) * -inv.y; }
  float tEnd = tmax;
  if (rd.y > 0.0) tEnd = min(tEnd, (gHmax - ro.y) * inv.y); else tEnd = min(tEnd, -ro.y * inv.y);
  if (t >= tEnd) return h;
  vec2 cell = floor((ro.xz + rd.xz * t) / CELL);
  vec2 st = vec2(inv.x > 0.0 ? 1.0 : -1.0, inv.z > 0.0 ? 1.0 : -1.0);
  vec2 tN = ((cell + max(st, 0.0)) * CELL - ro.xz) * inv.xz;
  vec2 tD = CELL * abs(inv.xz);
  for (int i = 0; i < 300; i++) {
    if (i >= maxSteps) break;
    float tx = min(tN.x, tN.y);
    float yLow = ro.y + rd.y * (rd.y < 0.0 ? min(tx, tEnd) : t);
    Bld b = building(cell);
    float b0 = 1e9; vec3 n0 = vec3(0.0); float part = 0.0;
    if (yLow < b.H) {
      vec3 n1;
      b0 = boxHit(ro, inv, b.lo0, b.hi0, n0);
      float b1 = boxHit(ro, inv, b.lo1, b.hi1, n1);
      if (b1 < b0) { b0 = b1; n0 = n1; part = 1.0; }
      if (b.setb) {
        b1 = boxHit(ro, inv, b.lo2, b.hi2, n1);
        if (b1 < b0) { b0 = b1; n0 = n1; part = 5.0; }
      }
      if (signsOn(cell)) {
        for (int j = 0; j < 3; j++) {
          vec3 slo, shi, sh;
          if (!signBox(cell, j, b.lo0, b.hi0, slo, shi, sh)) continue;
          float bs = boxHit(ro, inv, slo, shi, n1);
          if (bs < b0) { b0 = bs; n0 = n1; part = 2.0 + float(j); }
        }
      }
    }
    if (gSpires && b.H > 220.0) spireGlow(ro, rd, b, min(b0, tEnd));
    if (b0 < 1e8) {
      if (b0 < tEnd + 1.0) { h.t = b0; h.n = n0; h.cell = cell; h.part = part; }
      return h;
    }
    t = tx;
    if (t >= tEnd) break;
    if (tN.x < tN.y) { tN.x += tD.x; cell.x += st.x; } else { tN.y += tD.y; cell.y += st.y; }
  }
  return h;
}

// ---------------------------------------------------------------- megatower
vec3 megaTier(int i) { // half-width, y0, y1
  if (i == 0) return vec3(150.0, 0.0, 380.0);
  if (i == 1) return vec3(108.0, 380.0, 700.0);
  if (i == 2) return vec3(70.0, 700.0, 960.0);
  return vec3(34.0, 960.0, 1180.0);
}
float megaHit(vec3 ro, vec3 inv, out vec3 n, out float tier) {
  float best = 1e9; n = vec3(0.0); tier = 0.0;
  for (int i = 0; i < 4; i++) {
    vec3 m = megaTier(i), nn;
    float b = boxHit(ro, inv, MEGA + vec3(-m.x, m.y, -m.x), MEGA + vec3(m.x, m.z, m.x), nn);
    if (b < best) { best = b; n = nn; tier = float(i); }
  }
  return best;
}

// ---------------------------------------------------------------- far skyline (shot C)
// A few supertall districts 5-11 km out, so the haze band has a skyline to break it.
vec4 farTower(int i) { // xz centre, half-width, height
  float fi = float(i);
  vec2 h = hash21(fi * 7.31 + 1.7);
  float x = -7200.0 + 14400.0 * (fi + 0.5 + 0.7 * (h.x - 0.5)) / 9.0;
  float z = 6200.0 + 4800.0 * fract(h.y * 3.7 + fi * 0.37);
  return vec4(x, z, 45.0 + 60.0 * fract(h.x * 5.1), 520.0 + 560.0 * fract(h.y * 9.3 + 0.2));
}
float farHit(vec3 ro, vec3 inv, out vec3 n, out float id) {
  float best = 1e9; n = vec3(0.0); id = -1.0;
  for (int i = 0; i < 9; i++) {
    vec4 f = farTower(i);
    vec3 nn;
    float b = boxHit(ro, inv, vec3(f.x - f.z, 0.0, f.y - f.z), vec3(f.x + f.z, f.w, f.y + f.z), nn);
    if (b < best) { best = b; n = nn; id = float(i); }
    // setback crown
    b = boxHit(ro, inv, vec3(f.x - f.z * 0.55, f.w, f.y - f.z * 0.55), vec3(f.x + f.z * 0.55, f.w * 1.12, f.y + f.z * 0.55), nn);
    if (b < best) { best = b; n = nn; id = float(i) + 0.5; }
  }
  return best;
}

// ---------------------------------------------------------------- surfaces
// Colour temperature is a per-building choice, so walls that the motion blur averages
// stay saturated amber or cyan instead of collapsing to beige.
vec3 bldTint(vec4 hs) {
  float k = fract(hs.x * 9.1);
  if (k < 0.54) return vec3(1.0, 0.40, 0.10);                  // sodium / tungsten
  if (k < 0.92) return vec3(0.20, 0.55, 1.0);                  // cool LED
  return k < 0.96 ? vec3(1.0, 0.12, 0.50) : vec3(0.25, 1.0, 0.80);   // neon-lit offices
}
vec3 windowCol(float r, vec3 bc) {
  if (gTierC.x >= 0.0) return gTierC * (0.8 + 0.4 * fract(r * 3.3));
  if (r > 0.985) return vec3(1.0, 0.9, 0.8);                   // the odd white room
  if (r > 0.92) return neonPal(r * 7.3);                       // ~1 in 15: a coloured room
  return bc;
}

// Interior mapping: the ray continues through the glass into a virtual room
// (width RW, height fh, depth D) and hits its back wall, ceiling, floor or side walls.
vec3 roomInterior(vec2 l, float RW, float fh, vec3 wc, float seed) {
  float D = 3.0 + 2.5 * fract(seed * 3.17);
  vec3 r = gTan;
  float tb = D / max(r.z, 1e-3);
  float ts = r.x > 0.0 ? (RW - l.x) / max(r.x, 1e-5) : l.x / max(-r.x, 1e-5);
  float tf = r.y > 0.0 ? (fh - l.y) / max(r.y, 1e-5) : l.y / max(-r.y, 1e-5);
  float t = min(tb, min(ts, tf));
  vec3 q = vec3(l, 0.0) + r * t;
  float lamp = exp(-sq((q.z - 0.5 * D) / (0.3 * D)));
  vec3 c;
  if (t == tb) {                                            // back wall (lit), corners darker
    c = wc * (0.5 + 0.5 * sat(q.y / fh + 0.2)) * (0.4 + 0.6 * smoothstep(0.0, 0.4 * RW, min(q.x, RW - q.x)));
    float fx0 = fract(seed * 7.7) * max(RW - 1.6, 0.0);
    float fw = 0.6 + 1.2 * fract(seed * 5.3), fhh = 0.8 + 1.0 * fract(seed * 2.9);
    if (q.x > fx0 && q.x < fx0 + fw && q.y < fhh) c *= 0.12;
  } else if (t == tf) {
    if (r.y > 0.0) c = wc * (0.3 + 2.2 * lamp * step(abs(q.x - 0.5 * RW), 0.5 * RW - 0.3));   // ceiling + light panel
    else c = wc * 0.12 * (0.5 + 0.5 * lamp);                                                 // floor
  } else {
    c = wc * (0.12 + 0.2 * lamp);                            // side walls (receding, dim)
  }
  return c;
}

vec3 windows(float u, float v, float fu, float fv, vec4 hs, vec2 cell, float vMin, float vMax) {
  if (v < vMin || v > vMax) return vec3(0.0);
  float style = fract(hs.z * 3.7 + hs.w);
  float fh = 3.4 + 0.7 * hs.z;
  float bw = 1.5, du = 0.88, dv = 0.72, roomW = 3.0 + floor(hs.x * 4.0);
  if (style < 0.4) { bw = 2.2 + 1.2 * hs.w; du = 0.55; dv = 0.52; roomW = 1.0; }  // punched windows
  else if (style > 0.8) { bw = 1.1; du = 0.55; dv = 0.88; }                      // vertical fins
  float sill = (1.0 - dv) * 0.35;
  vec2 g = vec2(u / bw, (v - vMin) / fh);
  vec2 id = floor(g);
  float fwu = fu / bw, fwv = fv / fh;
  float mask = fpulse(g.x, du, fwu) * fpulse(g.y - sill, dv, fwv);
  float occ = fract(hs.y * 5.9 + hs.w);
  float litFrac = 0.03 + 0.5 * occ * occ;
  if (gShot == 0 || gShot == 3) litFrac = 0.10 + 0.55 * occ;                     // downtown never sleeps
  if (gShot == 2) litFrac = hs.y < 0.45 ? 0.015 : (hs.y < 0.85 ? 0.22 : 0.55);   // dark monoliths + lit towers
  vec3 bc = bldTint(hs);
  vec2 rid = vec2(floor(id.x / roomW), id.y);
  float hr = hash12(vec2(rid.y, cell.x * 3.1 + cell.y));
  float r1 = mix(hash12(rid + cell * 17.31), hr, gWinBand);
  float r2 = hash12(rid * 1.7 + cell * 5.13 + 2.0);
  float lit = step(r1, litFrac);
  vec3 wc = windowCol(r2, bc) * (0.55 + 0.6 * fract(r2 * 13.7));
  wc += step(0.985, r2) * uHat * vec3(1.2, 1.1, 1.3) * 2.0;       // hats: a few rooms sparkle
  vec3 avgC = (gTierC.x >= 0.0 ? gTierC : bc) * 0.62;
  vec3 glass = vec3(0.010, 0.012, 0.02);                            // unlit glass still reads
  float lodU = sat(fwu * 1.6 - 0.4), lodV = sat(fwv * 1.6 - 0.4);
  vec3 near = glass;
  float lodI = smoothstep(0.04, 0.14, max(fwu, fwv));
  if (lit > 0.5) near = wc * 0.85 + glass;
  if (lit > 0.5 && lodI < 1.0) {
    vec2 l = vec2(u - rid.x * roomW * bw, v - vMin - id.y * fh);
    vec3 room = roomInterior(l, roomW * bw, fh, wc * 0.8, r2 * 91.7 + r1 * 13.0);
    // mullions + transom: glass with rooms behind it, not tiles
    room *= 1.0 - 0.85 * max(aaLine(fract(l.x / bw + 0.5) - 0.5, 0.05 / bw, fu / bw), aaLine(l.y - 2.3, 0.05, fv));
    near = mix(room + glass, near, lodI);
    if (fract(r2 * 31.7) < 0.3)                                     // blinds half-drawn
      near = mix(near, wc * 0.5, 0.8 * fpulse(v / 0.1, 0.55, fv / 0.1) * step(fract(v / fh - sill - 0.1), 0.35 + 0.5 * fract(r2 * 5.1)));
  }
  // separable LOD: a row that is unresolved horizontally keeps its floor's lit fraction,
  // so grazing canyon walls still show bands of lit floors
  float rowLit = sat((litFrac - gWinBand * hr) / max(1.0 - gWinBand, 1e-3));
  float dim = gTierC.x >= 0.0 ? 1.0 : (gShot == 1 ? 0.2 : (gShot == 2 ? 0.7 : 1.0));   // aerials: calm carpet
  vec3 e = mix(near, avgC * rowLit * 0.9 * dim + glass, lodU);
  e = mix(e, avgC * litFrac * 0.8 * dim + glass, lodV);
  return e * mask;
}

vec3 storefront(float u, float v, float fu, float fv, vec4 hs, vec2 cell, float P) {
  vec3 e = vec3(0.0);
  float band = smoothstep(0.5 - fv, 0.5 + fv, v) * (1.0 - smoothstep(3.6 - fv, 3.6 + fv, v));
  float sid = floor(u / 6.5);
  float sh = hash12(vec2(sid, cell.x * 7.0 + cell.y * 1.3));
  vec3 sc = sh < 0.5 ? vec3(1.0, 0.5, 0.2) : neonPal(sh * 3.0);
  float mull = fpulse(u / 1.6, 0.85, fu / 1.6);
  float shopLod = sat(fu / 6.5 * 2.0 - 0.5);
  float lit = step(0.3, sh) * (0.5 + 0.5 * fract(sh * 11.0));
  e += mix(sc * lit, mix(vec3(1.0, 0.5, 0.2), neonPal(hs.w * 3.0), 0.5) * 0.5, shopLod) * band * mull * 1.3;
  // awning / sign strip right above the shops
  e += neonPal(sh * 5.0 + 0.2) * 2.5 * gNeon * aaLine(v - 4.1, 0.18, fv) * step(0.45, sh);
  // flat glyph signboards on the podium face
  if (v > 5.0 && v < P - 0.8) {
    float row = floor((v - 5.0) / 4.0);
    float col = floor(u / 10.0);
    float s2 = hash12(vec2(col, row + cell.x * 3.0 + cell.y * 11.0));
    if (s2 > 0.5) {
      vec2 q = vec2(u - col * 10.0 - 1.0, v - 5.0 - row * 4.0 - 0.5);
      vec2 sz = vec2(4.0 + 4.0 * fract(s2 * 13.0), 3.0);
      if (q.x > 0.0 && q.x < sz.x && q.y > 0.0 && q.y < sz.y)
        e += signFace(q, sz, s2 * 91.0 + cell.x, max(fu, fv), step(0.75, s2));
    }
  }
  return e;
}

// footprint of the camera's forward travel on a surface facing it (radial zoom blur)
float radialMot(vec3 p, float t) { return gMotZ * length(p.xy - gCamXY) / max(t, 1.0); }

vec3 shadeSign(vec3 p, vec3 n, vec3 rd, float tt, vec2 cell, int j, vec3 lo0, vec3 hi0) {
  vec3 slo, shi, sh;
  signBox(cell, j, lo0, hi0, slo, shi, sh);
  vec3 sc = neonPal(sh.y * 3.3 + sh.z);
  float fp = tt * gPix;
  float on = igOn(p.z);
  if (abs(n.z) < 0.5) {                                   // metal casing with a neon rim
    float dz = 0.3 - abs(p.z - 0.5 * (slo.z + shi.z));
    float F = 0.04 + 0.96 * pow(1.0 - abs(dot(rd, n)), 5.0);
    vec3 c = vec3(0.010, 0.009, 0.012) + envRefl(reflect(rd, n), p.y) * F * 0.5;
    return c * mix(0.4, 1.0, on) + lightUp(sc * 3.2 * gNeon * aaLine(dz - 0.05, 0.045, fp), p, fp, 1.0);
  }
  fp = max(fp, radialMot(p, tt));
  vec2 sz = shi.xy - slo.xy;
  vec2 q = p.xy - slo.xy;
  if (n.z > 0.0) q.x = sz.x - q.x;
  float seed = floor(sh.x * 997.0) + cell.y * 13.0 + float(j) * 3.0;
  float flick = step(0.12, fract(sh.z * 19.0 + floor(uBeat) * 0.37)) * 0.4 + 0.6;
  return lightUp(signFace(q, sz, seed, fp, step(0.55, fract(sh.x * 7.1))) * flick, p, fp, 0.0);
}

vec3 shadeBuilding(vec3 p, vec3 n, vec3 rd, float t, vec2 cell, float part) {
  Bld b = building(cell);
  float tt = t + gTOff;
  if (part > 1.5 && part < 4.5) return shadeSign(p, n, rd, tt, cell, int(part - 2.0 + 0.5), b.lo0, b.hi0);
  vec3 lo = part < 0.5 ? b.lo0 : (part < 1.5 ? b.lo1 : b.lo2);
  vec3 hi = part < 0.5 ? b.hi0 : (part < 1.5 ? b.hi1 : b.hi2);
  vec4 hs = b.hs;
  float P = b.hi0.y;
  vec3 nc = neonPal(hs.w * 3.1 + hs.x * 1.7);
  float cosv = abs(dot(rd, n));
  float F = 0.04 + 0.96 * pow(1.0 - cosv, 5.0);
  vec3 col = envRefl(reflect(rd, n), p.y) * F * 0.6 + vec3(0.004, 0.004, 0.007);
  col += vec3(0.30, 0.10, 0.16) * 0.06 * exp(-p.y / 22.0);    // street uplight
  col *= mix(0.35, 1.0, igOn(p.z));
  float base = tt * gPix;
  bool crown = fract(hs.w * 5.1) > 1.0 - 0.38 * gNeonDen;
  if (n.y > 0.5) {                                             // roof
    float fp = base / max(cosv, 0.05);
    float dE = min(min(p.x - lo.x, hi.x - p.x), min(p.z - lo.z, hi.z - p.z));
    vec3 em = vec3(0.0);
    if (crown && gShot != 2) em += nc * 3.5 * gNeon * aaLine(dE - 0.8, 0.45, fp);
    vec2 rc = 0.5 * (lo.xz + hi.xz);
    float ringP = gShot == 2 ? 0.975 : (gShot == 1 ? 0.985 : 0.8);
    if (part > 0.5 && fract(hs.x * 17.3) > ringP)
      em += vec3(1.0, 0.7, 0.3) * 1.5 * aaLine(length(p.xz - rc) - 5.0, 0.4, fp);
    col += vec3(0.02, 0.015, 0.02) * fpulse(p.x / 6.0, 0.3, fp / 6.0) * fpulse(p.z / 6.0, 0.3, fp / 6.0);
    return col + lightUp(em, p, fp, 1.0);
  }
  bool fx = abs(n.x) > 0.5;
  float u = fx ? p.z : p.x, uLo = fx ? lo.z : lo.x, uHi = fx ? hi.z : hi.x;
  float v = p.y;
  gTan = vec3(fx ? rd.z : rd.x, rd.y, cosv);
  // anisotropic pixel footprint on the facade
  float cs = max(cosv, 0.04);
  vec3 pr = rd - n * dot(rd, n);
  pr /= max(length(pr), 1e-5);
  float stt = 1.0 / cs - 1.0;
  float fu = base * (1.0 + stt * (fx ? abs(pr.z) : abs(pr.x)));
  float fv = base * (1.0 + stt * abs(pr.y));
  float fuS = fu;
  // motion-aware prefilter: walls along the flight path slide past by gMotZ metres during
  // the shutter, so average the texture over that length analytically instead of sampling it;
  // faces turned to the camera zoom radially past it instead
  if (fx) fu = max(fu, gMotZ * 0.85);
  else if (gMotZ > 0.0) { float fm = radialMot(p, tt); fu = max(fu, fm); fv = max(fv, fm); }
  fv = max(fv, gMotY * 0.3);
  vec3 em = vec3(0.0);
  if (part < 0.5) em += storefront(u, v, fu, fv, hs, cell, P);
  else em += windows(u, v, fu, fv, hs, cell, part < 1.5 ? P + 1.5 : lo.y + 1.2, hi.y - 3.0);
  // streaked walls give way to the neon
  if (fx && gMotZ > 0.0) em *= mix(1.0, 0.6, sat(gMotZ * 0.85 / max(fuS, 1e-4) - 1.0));
  float dEdge = min(u - uLo, uHi - u);
  bool edgeNeon = part > 0.5 && fract(hs.w * 13.7) > 1.0 - 0.26 * gNeonDen;
  if (edgeNeon) em += nc * 4.0 * gNeon * aaLine(dEdge - 0.35, 0.3, fu);
  if (crown && (gShot != 2 || b.H > 220.0) && (part != 1.0 || !b.setb)) em += nc * 5.0 * gNeon * aaLine(hi.y - v - 1.0, 0.45, fv);
  if (part > 0.5 && gShot != 1 && fract(hs.z * 23.1) > 1.0 - 0.22 * gNeonDen) {  // banded towers
    float bp = 6.0 * (3.3 + 0.9 * hs.z);
    em += nc * 2.2 * gNeon * fpulse((v - P) / bp, 0.06, fv / bp);
  }
  // neon glow spilling on the wall around the lines
  if (edgeNeon) em += nc * 0.10 * gNeon * exp(-dEdge * 0.6);
  // (faces square to the flight path take the fronts all at once: keep that to a soft pulse)
  return col + lightUp(em, p, fu, (fx || gShot == 1) ? 1.0 : 0.0);
}

vec3 shadeMega(vec3 p, vec3 n, vec3 rd, float t, float tier) {
  int ti = int(tier + 0.5);
  vec3 m = megaTier(ti);
  float cosv = abs(dot(rd, n));
  float F = 0.04 + 0.96 * pow(1.0 - cosv, 5.0);
  vec3 col = envRefl(reflect(rd, n), p.y) * F * 0.7 + vec3(0.004, 0.005, 0.01);
  float base = (t + gTOff) * gPix;
  vec3 q = p - MEGA;
  vec3 cA = vec3(0.1, 0.7, 1.0), cB = vec3(1.0, 0.08, 0.5);
  if (n.y > 0.5) {
    float dE = m.x - max(abs(q.x), abs(q.z));
    float fp = base / max(cosv, 0.05);
    return col + cB * 6.0 * gNeon * aaLine(dE - 2.0, 1.2, fp) + cA * 2.0 * aaLine(dE - 12.0, 0.8, fp);
  }
  bool fx = abs(n.x) > 0.5;
  float u = fx ? q.z : q.x;
  gTan = vec3(fx ? rd.z : rd.x, rd.y, cosv);
  float cs = max(cosv, 0.04);
  vec3 pr = rd - n * dot(rd, n);
  pr /= max(length(pr), 1e-5);
  float stt = 1.0 / cs - 1.0;
  float fu = base * (1.0 + stt * (fx ? abs(pr.z) : abs(pr.x)));
  float fv = base * (1.0 + stt * abs(pr.y));
  fv = max(fv, gMotY * 0.3); fu = max(fu, gMotH * 0.85);       // motion-aware prefilter (dive; keep the floors)
  // one colour temperature per tier; whole floors switch together (reads as storeys)
  gWinBand = 1.0;
  gTierC = ti >= 2 ? vec3(0.3, 0.62, 1.0) : (ti == 0 ? vec3(1.0, 0.45, 0.14) : vec3(1.0, 0.62, 0.3));
  vec3 em = windows(u + 1000.0, p.y, fu, fv, vec4(0.02, 0.11, 0.1, 0.3), vec2(91.0, 17.0 + tier), m.y + 4.0, m.z - 6.0);
  gWinBand = gShot == 2 ? 0.12 : 0.5; gTierC = vec3(-1.0);
  em += cA * 2.2 * gNeon * fpulse(u / 24.0 + 0.5, 0.06, fu / 24.0);           // vertical ribs
  em += cA * 10.0 * gNeon * aaLine(m.x - abs(u) - 1.5, 1.5, fu);               // corners
  em += cB * 9.0 * gNeon * aaLine(m.z - p.y - 3.0, 2.0, fv);                   // tier crowns
  em += cB * 3.0 * gNeon * aaLine(m.z - p.y - 9.0, 0.8, fv);
  if (ti == 1 || ti == 2) {                                                     // giant glyph banners
    float faceId = fx ? (n.x > 0.0 ? 0.0 : 1.0) : (n.z > 0.0 ? 2.0 : 3.0);
    for (int k = 0; k < 2; k++) {
      float uc = (float(k) - 0.5) * m.x * 1.05;
      vec2 sz = vec2(20.0, m.z - m.y - 70.0);
      vec2 q2 = vec2(u - uc + 0.5 * sz.x, p.y - m.y - 30.0);
      if (q2.x > 0.0 && q2.x < sz.x && q2.y > 0.0 && q2.y < sz.y) {
        float seed = faceId * 7.0 + float(k) * 3.0 + tier * 17.0;
        em = em * 0.15 + signFace(q2, sz, seed, max(fu, fv), float(k)) * 1.3;
      }
    }
  }
  // media facade: every kick fires a band of light racing down the tower
  float dy = p.y - (1180.0 - 2600.0 * fract(uBeat));
  float band = dy > 0.0 ? exp(-dy / 22.0) : exp(dy / 4.0);
  em += vec3(0.55, 0.85, 1.0) * 3.5 * gNeon * uKick * band;
  return col + em;
}

vec3 shadeFar(vec3 p, vec3 n, vec3 rd, float t, float id) {
  vec4 f = farTower(int(id));
  float cosv = abs(dot(rd, n));
  vec3 col = envRefl(reflect(rd, n), p.y) * 0.12 + vec3(0.003, 0.003, 0.006);
  if (n.y > 0.5) return col;
  vec3 hs = hash31(id * 3.1 + 0.4);
  float fp = t * gPix / max(cosv, 0.1);
  vec3 wc = mix(vec3(0.3, 0.6, 1.0), vec3(1.0, 0.5, 0.18), step(0.5, hs.x));
  float fl = floor(p.y / 4.0);
  float lit = 0.25 + 0.5 * hash12(vec2(fl, id * 7.0));          // floors at different occupancy
  col += wc * 0.55 * lit * (0.5 + 0.5 * step(0.35, hash12(vec2(fl * 0.25, id))));
  vec3 nc = neonPal(hs.y * 3.0 + 0.1);
  float top = fract(id) > 0.25 ? f.w * 1.12 : f.w;
  col += nc * 5.0 * gNeon * aaLine(top - p.y - 3.0, 2.0, fp);
  col += nc * 3.0 * gNeon * aaLine(fract(p.y / 120.0) - 0.5, 0.012, fp / 120.0) * step(0.5, hs.z);
  return col;
}

// ---------------------------------------------------------------- traffic + beams
float trailPat(float s, float seed, float fp, float dens, float L, float len0, float len1) {
  float id = floor(s / L), f = fract(s / L);
  float h = hash12(vec2(id, seed));
  float len = len0 + (len1 - len0) * hash12(vec2(seed + 3.1, id + 7.3));
  float fw = fp / L;
  float e = 0.02 + fw;
  float d = step(h, dens) * smoothstep(0.0, e, f) * (1.0 - smoothstep(len - e, len, f)) * (0.55 + 0.45 * fract(h * 7.1));
  return mix(d, dens * 0.78 * 0.5 * (len0 + len1), sat(fw * 1.5 - 0.3));
}
// one traffic/air lane: dir 0 = along z, 1 = along x
vec3 lane(vec3 ro, vec3 rd, float tHit, vec2 q, int axis, float speed, float seed, vec3 c, float dens, float r, float L, float len0, float len1) {
  vec3 Lc = axis == 0 ? lineZ(ro, rd, q) : lineX(ro, rd, q);
  if (Lc.y < 0.0 || Lc.y > tHit) return vec3(0.0);
  float sl = axis == 0 ? length(rd.xy) : length(rd.yz);
  float fpA = (Lc.y + gTOff) * gPix / max(sl, 2e-3);
  float tr = trailPat(Lc.z - speed * uLocal, seed, fpA, dens, L, len0, len1);
  return c * tr * glowProfile(Lc.x, Lc.y, r) * fogT(ro, rd, Lc.y) * igOn(Lc.z);
}

vec3 megaBeam(vec3 ro, vec3 rd, float tHit) {
  vec3 acc = vec3(0.0);
  vec3 L = lineY(ro, rd, MEGA.xz);
  if (L.y > 0.0 && L.y < tHit && L.z > 1180.0) {
    float w = max(5.0, (L.y + gTOff) * gPix);
    float g = (5.0 / w) * exp(-L.x * L.x / (w * w)) * 2.0 + 0.25 * exp(-L.x / 40.0);
    acc += vec3(0.35, 0.75, 1.0) * g * smoothstep(1180.0, 1260.0, L.z) * exp(-(L.z - 1180.0) / 2500.0) * fogT(ro, rd, L.y);
  }
  vec3 P = vec3(MEGA.x, 1190.0, MEGA.z) - ro;
  float tp = dot(P, rd);
  if (tp > 0.0 && tp < tHit + 60.0) {
    float d = length(P - rd * tp);
    float r = max(8.0, tp * gPix);
    acc += vec3(1.0, 0.35, 0.7) * (3.0 + 4.0 * uKick) * (r * r / (d * d + r * r)) * (8.0 / r) * fogT(ro, rd, tp);
  }
  return acc;
}

// Volumetric searchlight: closest approach between the ray and the beam axis, integrated
// through a gaussian cone (brightness ~ 1 / (radius * sin(angle))).
vec3 searchlight(vec3 ro, vec3 rd, float tHit, vec3 B, vec3 D, vec3 c) {
  vec3 w0 = ro - B;
  float b = dot(rd, D), d = dot(rd, w0), e = dot(D, w0);
  float den = max(1.0 - b * b, 1e-4);
  float t = (b * e - d) / den;
  float s = (e - b * d) / den;
  if (t < 0.0 || t > tHit || s < 0.0) return vec3(0.0);
  float dist = length(w0 + rd * t - D * s);
  float r = 2.0 + s * 0.045;
  float g = exp(-dist * dist / (r * r)) / (r * max(sqrt(den), 0.12)) * exp(-s / 1800.0);
  return c * g * fogT(ro, rd, t);
}

vec3 glowLines(vec3 ro, vec3 rd, float tHit) {
  vec3 acc = vec3(0.0);
  if (gShot == 0 || gShot == 3) {
    for (int i = 0; i < 8; i++) {
      float side = i < 4 ? 1.0 : -1.0;                 // +x: away (tail lights), -x: oncoming
      float li = float(i - (i < 4 ? 0 : 4));
      float x = side * (2.3 + 3.6 * li);
      float sp = side > 0.0 ? 22.0 + 5.0 * li : -26.0 - 4.0 * li;
      acc += lane(ro, rd, tHit, vec2(x, 0.75), 0, sp, float(i), side > 0.0 ? TAIL * 4.0 : HEAD * 3.2, 0.72, 0.22, 55.0, 0.45, 0.95);
    }
    float hi = gShot == 3 ? 1.0 : 0.0;
    // air lanes; in D they pass under and over the gates, never through their holes
    acc += lane(ro, rd, tHit, vec2(-7.0, 34.0 - 4.0 * hi), 0, 70.0, 11.0, neonPal(0.1) * 5.0, 0.45, 0.3, 55.0, 0.45, 0.95);
    acc += lane(ro, rd, tHit, vec2(9.0, 43.0 + 26.0 * hi), 0, -60.0, 12.0, neonPal(0.4) * 5.0, 0.45, 0.3, 55.0, 0.45, 0.95);
    acc += lane(ro, rd, tHit, vec2(-11.0, 58.0 + 12.0 * hi), 0, -85.0, 13.0, neonPal(0.7) * 5.0, 0.4, 0.3, 55.0, 0.45, 0.95);
    acc += lane(ro, rd, tHit, vec2(5.0, 72.0 - 45.0 * hi), 0, 90.0, 14.0, neonPal(0.45) * 5.0, 0.4, 0.3, 55.0, 0.45, 0.95);
  } else if (gShot == 1) {
    vec3 M = MEGA;
    acc += lane(ro, rd, tHit, vec2(640.0, M.z - 190.0), 1, 110.0, 50.0, neonPal(0.1) * 6.0, 0.5, 0.5, 55.0, 0.45, 0.95);
    acc += lane(ro, rd, tHit, vec2(470.0, M.z - 200.0), 1, -90.0, 51.0, neonPal(0.4) * 6.0, 0.5, 0.5, 55.0, 0.45, 0.95);
    acc += lane(ro, rd, tHit, vec2(300.0, M.z - 205.0), 1, 100.0, 52.0, neonPal(0.66) * 6.0, 0.5, 0.5, 55.0, 0.45, 0.95);
    acc += lane(ro, rd, tHit, vec2(M.x - 200.0, 560.0), 0, -80.0, 53.0, neonPal(0.2) * 6.0, 0.5, 0.5, 55.0, 0.45, 0.95);
    acc += lane(ro, rd, tHit, vec2(M.x + 195.0, 380.0), 0, 95.0, 54.0, neonPal(0.45) * 6.0, 0.5, 0.5, 55.0, 0.45, 0.95);
  } else {
    // flying traffic: discrete craft in air corridors, red tails one way, white heads the other
    for (int i = 0; i < 5; i++) {
      float fi = float(i);
      float x = -170.0 + 118.0 * fi + 20.0 * sin(fi * 3.1);
      float y = 150.0 + 75.0 * fract(fi * 0.37);
      acc += lane(ro, rd, tHit, vec2(x - 2.5, y), 0, 95.0, 60.0 + fi, TAIL * 9.0, 0.35, 0.8, 70.0, 0.06, 0.12);
      acc += lane(ro, rd, tHit, vec2(x + 2.5, y + 1.5), 0, -95.0, 65.0 + fi, HEAD * 6.0, 0.35, 0.8, 70.0, 0.06, 0.12);
    }
    acc += lane(ro, rd, tHit, vec2(-4.0, 1.0), 0, 30.0, 80.0, TAIL * 5.0, 0.8, 0.8, 55.0, 0.45, 0.95);
    acc += lane(ro, rd, tHit, vec2(4.0, 1.0), 0, -30.0, 81.0, HEAD * 4.0, 0.8, 0.8, 55.0, 0.45, 0.95);
    // skyway: a bundle of lanes low and to the left, white heads one way, red tails the other
    for (int i = 0; i < 6; i++) {
      float fi = float(i);
      float bnd = i < 3 ? 0.0 : 1.0;
      float li = fi - 3.0 * bnd;
      vec2 q = vec2(-300.0 - 3.0 * li - 9.0 * bnd, 230.0 + 1.2 * li);
      float dir = bnd < 0.5 ? 1.0 : -1.0;
      vec3 c = dir > 0.0 ? TAIL * 6.0 : HEAD * 4.5;
      acc += lane(ro, rd, tHit, q, 0, dir * 120.0, 90.0 + fi, c, 0.9, 0.4, 120.0, 0.5, 0.9);
    }
    for (int i = 0; i < 5; i++) {
      float fi = float(i);
      vec3 B = vec3(-900.0 + 480.0 * fi + 90.0 * sin(fi * 4.1), 180.0 + 60.0 * fract(fi * 0.61), 2100.0 + 420.0 * fract(fi * 0.37 + 0.2));
      float a = fi * 1.9 + uLocal * (0.8 + 0.25 * fi) * (mod(fi, 2.0) < 0.5 ? 1.0 : -1.0);
      vec3 D = normalize(vec3(sin(a) * 0.55, 1.0, cos(a) * 0.55));
      acc += searchlight(ro, rd, tHit, B, D, (mod(fi, 2.0) < 0.5 ? vec3(0.55, 0.75, 1.0) : vec3(1.0, 0.45, 0.8)) * 2.2 * (1.0 + 0.6 * uKick));
    }
    // aviation beacons on the far skyline, blinking on the beat
    for (int i = 0; i < 9; i++) {
      vec4 f = farTower(i);
      float blink = 0.25 + 0.75 * step(0.5, fract(uBeat * 0.5 + float(i) * 0.37));
      acc += beacon(ro, rd, tHit, vec3(f.x, f.w * 1.12 + 6.0, f.y), vec3(1.0, 0.08, 0.04) * 3.0 * blink);
    }
  }
  acc += megaBeam(ro, rd, tHit);
  return acc;
}

// street traffic as a ground pattern (side streets; everything in the aerial shot)
vec3 groundTraffic(vec3 p, float fpx, float fpz) {
  vec3 e = vec3(0.0);
  float kx = floor(p.x / CELL.x + 0.5);
  float dx = p.x - kx * CELL.x;
  float hw = 0.5 * streetX(kx);
  bool mainAve = kx == 0.0 && gShot != 2;
  if (abs(dx) < hw && !mainAve) {
    float nl = hw > 10.0 ? 4.0 : 1.0;
    float lw = hw / nl;
    float li = floor(dx / lw);
    float dl = dx - (li + 0.5) * lw;
    float dir = dx > 0.0 ? 1.0 : -1.0;
    float tr = trailPat(p.z - dir * 25.0 * uLocal, kx * 13.0 + li, fpz, 0.6, 55.0, 0.45, 0.95);
    e += (dir > 0.0 ? TAIL * 3.0 : HEAD * 2.4) * tr * aaLine(dl, 0.5, fpx);
  }
  float kz = floor(p.z / CELL.y + 0.5);
  float dz = p.z - kz * CELL.y;
  float hz = 0.5 * streetZ(kz);
  bool crossAve = gShot != 2 && abs(p.x) < 17.0;
  if (abs(dz) < hz && !crossAve) {
    float nl = hz > 6.0 ? 2.0 : 1.0;
    float lw = hz / nl;
    float li = floor(dz / lw);
    float dl = dz - (li + 0.5) * lw;
    float dir = dz > 0.0 ? 1.0 : -1.0;
    float tr = trailPat(p.x - dir * 22.0 * uLocal, kz * 7.0 + li + 100.0, fpx, 0.5, 55.0, 0.45, 0.95);
    e += (dir > 0.0 ? TAIL * 3.0 : HEAD * 2.4) * tr * aaLine(dl, 0.5, fpz);
  }
  return e;
}

vec3 groundBase(vec3 p, vec3 rd, float t, float calm, out float puddle) {
  float base = (t + gTOff) * gPix;
  float cs = max(-rd.y, 0.02);
  vec2 hd = normalize(rd.xz + 1e-6);
  float st = 1.0 / cs - 1.0;
  float fpx = base * (1.0 + st * abs(hd.x));
  float fpz = base * (1.0 + st * abs(hd.y));
  vec3 col = vec3(0.012, 0.010, 0.012) * (0.7 + 0.6 * vnoise(p.xz * 0.35));
  col += vec3(0.30, 0.12, 0.14) * 0.05;                       // lit by the shopfronts
  col *= mix(0.3, 1.0, igOn(p.z));
  vec3 em = vec3(0.0);
  // lane markings on the avenues
  float kx = floor(p.x / CELL.x + 0.5);
  float dx = p.x - kx * CELL.x;
  if (streetX(kx) > 20.0 && abs(dx) < 16.0) {
    float m = 0.0;
    for (int i = 1; i < 4; i++) m += aaLine(abs(dx) - 3.6 * float(i) + 1.3 + 0.4, 0.15, fpx);
    m *= fpulse(p.z / 12.0, 0.3, fpz / 12.0);
    em += vec3(0.5) * 0.12 * m;
    em += vec3(1.0, 0.6, 0.1) * 0.15 * (aaLine(abs(dx) - 0.25, 0.12, fpx));
  }
  // crosswalks at intersections
  float kz = floor(p.z / CELL.y + 0.5);
  float dz = p.z - kz * CELL.y;
  float hz = 0.5 * streetZ(kz), hx = 0.5 * streetX(kx);
  float cw = 0.0;
  if (abs(dz) < hz && abs(abs(dx) - hx - 2.0) < 1.8) cw = fpulse(p.z / 1.2, 0.5, fpz / 1.2);
  if (abs(dx) < hx && abs(abs(dz) - hz - 2.0) < 1.8) cw = fpulse(p.x / 1.2, 0.5, fpx / 1.2);
  em += vec3(0.6, 0.6, 0.62) * 0.1 * cw;
  em += groundTraffic(p, fpx, fpz);
  vec2 pq = p.xz - MEGA.xz;
  float prr = length(pq);
  // street lamps: a sodium pool along every curb (the golden grid seen from the air;
  // in the dive the avenues become gold spokes converging on the megatower)
  {
    float cx = 0.5 * streetX(kx) - abs(dx);          // distance inside the curb (z-streets)
    float cz = hz - abs(dz);                         // (x-streets)
    float lampZ = fpulse(p.z / 24.0, 0.18, fpz / 24.0);
    float lampX = fpulse(p.x / 24.0, 0.18, fpx / 24.0);
    vec3 sodium = vec3(1.0, 0.45, 0.12);
    float pw = gShot == 1 ? mix(6.0, 2.5, smoothstep(700.0, 1000.0, prr)) : 2.5;
    float lz = cx > 0.0 ? exp(-cx / pw) * (0.35 + 1.4 * lampZ) : 0.0;
    float lx = cz > 0.0 && cx < 0.0 ? exp(-cz / pw) * (0.35 + 1.4 * lampX) : 0.0;
    em += sodium * (gShot == 1 ? 1.1 : 0.22) * (lz + lx);
  }
  if (prr < 340.0) {                                                   // the megatower plaza
    float fp = max(fpx, fpz);
    float inPl = smoothstep(150.0, 160.0, prr) * (1.0 - smoothstep(320.0, 330.0, prr));
    float rr = abs(prr - 34.0 * floor(prr / 34.0 + 0.5));
    float sa = prr * abs(fract(atan(pq.y, pq.x) / TAU * 24.0 + 0.5) - 0.5) * TAU / 24.0;
    em += inPl * gNeon * (1.0 - 0.9 * calm) * (vec3(0.1, 0.7, 1.0) * 3.0 * aaLine(rr, 0.9, fp) + vec3(1.0, 0.08, 0.5) * 2.0 * aaLine(sa, 0.6, fp));
    float inner = 1.0 - 0.8 * (1.0 - step(155.0, prr));
    col *= inner; em *= inner;
    // the landing medallion the dive plunges onto (shot B ends right above its centre)
    vec2 mq = p.xz - PAD;
    float mr = length(mq);
    if (mr < 60.0) {
      float ins = 1.0 - smoothstep(47.0, 50.0, mr);
      em *= 1.0 - ins;
      col *= 1.0 - 0.6 * ins;
      float ma = atan(mq.y, mq.x);
      vec3 mc = vec3(0.0);
      mc += vec3(0.1, 0.7, 1.0) * 4.0 * (aaLine(mr - 46.0, 0.9, fp) + aaLine(mr - 22.0, 0.5, fp));
