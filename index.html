      mc += vec3(1.0, 0.08, 0.5) * 4.0 * (aaLine(mr - 40.0, 0.5, fp) + aaLine(mr - 30.0, 1.4, fp) + aaLine(mr - 12.0, 0.5, fp));
      float tick = mr * abs(fract(ma / TAU * 24.0) - 0.5) * TAU / 24.0;
      mc += vec3(0.1, 0.7, 1.0) * 2.5 * aaLine(tick, 0.35, fp) * step(32.0, mr) * step(mr, 38.5);
      // chase light: a new lap on every beat
      float ch = fract(ma / TAU * 3.0 - fract(uBeat) * 1.5);
      float dash = smoothstep(0.0, 0.03, ch) * (1.0 - smoothstep(0.06, 0.12, ch));
      mc += vec3(1.0, 0.9, 0.95) * (3.0 + 8.0 * uKick) * dash * aaLine(mr - 43.0, 0.6, fp);
      mc += vec3(0.6, 0.9, 1.0) * (1.5 + 6.0 * uKick) * (1.0 - smoothstep(4.0, 5.0 + fp, mr));   // the core
      em += mc * gNeon * (1.0 - 0.9 * calm);
    }
  }
  puddle = smoothstep(0.38, 0.56, vnoise(p.xz * 0.11) * 0.7 + vnoise(p.xz * 0.47 + 3.0) * 0.3);
  return (col + lightUp(em, p, gShot == 1 ? max(fpx, fpz) : fpz, 1.0)) * (1.0 - 0.6 * puddle);
}

// ---------------------------------------------------------------- rays
// secondary ray (reflections): city + megatower + sky + lines, no ground
vec3 reflRay(vec3 ro, vec3 rd, int steps) {
  Hit h = traceCity(ro, rd, 8000.0, steps);
  vec3 mn; float mt;
  float tm = megaHit(ro, safeInv(rd), mn, mt);
  float t = min(h.t, tm);
  vec3 col;
  if (t > 1e8 && rd.y < -0.002) {
    t = -ro.y / rd.y;
    float pd;
    col = groundBase(ro + rd * t, rd, t, 0.0, pd);
  }
  else if (t > 1e8) col = sky(ro, rd);
  else if (h.t < tm) col = shadeBuilding(ro + rd * t, h.n, rd, t, h.cell, h.part);
  else col = shadeMega(ro + rd * t, mn, rd, t, mt);
  col = applyFog(col, ro, rd, t);
  return col + glowLines(ro, rd, t);
}

// ring gates (shot D): a dark metal ring spanning the canyon wall to wall, neon only on
// its inner lip, bolted to the facades by two struts. Front face at z = k*RS + RPH.
const float RS = 60.0, RPH = 24.0, RY = 50.0, RI = 12.0, RO = 16.8, RD = 3.0;
float nextGate() { return floor((gCamZ - RPH) / RS) + 1.0; }
vec3 gateShade(vec3 p, vec3 rd, float tk, float k, int face) {
  vec2 q = p.xy - vec2(0.0, RY);
  float r = length(q);
  vec3 rc = mod(k, 2.0) < 0.5 ? vec3(1.0, 0.06, 0.5) : vec3(0.05, 0.65, 1.0);
  rc = mix(rc, vec3(1.0, 0.9, 1.0), gStrobe * 0.6);
  float kickG = exp(-sq(k - nextGate() - 1.0) * 0.5) * uKick;   // the gate we're about to pass flares
  float I = gNeon * (1.0 + 2.5 * kickG);
  float lit = smoothstep(18.0, 60.0, tk);                          // the nearest gate sweeps past dark
  vec3 n = face == 0 ? vec3(0.0, 0.0, -1.0) : vec3(-q / max(r, 1e-3), 0.0);
  float cosv = abs(dot(rd, n));
  float F = 0.04 + 0.96 * pow(1.0 - cosv, 5.0);
  vec3 col = vec3(0.004, 0.004, 0.006) + envRefl(reflect(rd, n), p.y) * (0.03 + 0.4 * F);
  col += vec3(0.30, 0.10, 0.16) * (0.01 + 0.05 * sat(0.5 - 0.5 * q.y / RO));   // the canyon's glow from below
  if (face == 0) {
    float fp = (tk + gTOff) * gPix / max(cosv, 0.15);
    fp = max(fp, radialMot(p, tk));
    float a = atan(q.y, q.x);
    float circ = TAU * r;
    col *= 1.0 - 0.9 * fpulse(a / TAU * 36.0, 0.05, 36.0 * fp / circ);          // panel seams
    col *= 1.0 - 0.7 * aaLine(r - 0.5 * (RI + RO) - 0.8, 0.12, fp);             // groove
    col += vec3(0.35, 0.5, 1.0) * 1.1 * aaLine(r - RO + 0.1, 0.1, fp);          // cold rim-light (canyon glow)
    col += rc * I * 0.35 * exp(-(r - RI) / 0.8) * lit;                          // spill from the lip
    col += rc * I * 9.0 * aaLine(r - RI - 0.25, 0.2, fp) * lit;                 // inner lip tube
    col += rc * I * 1.6 * aaLine(r - RO + 0.35, 0.1, fp) * lit;                 // outer trim
    // chase lights racing round the groove, a new lap on every beat
    float ch = fract(a / TAU * 4.0 - fract(uBeat) * 1.5 + k * 0.23);
    float dash = smoothstep(0.0, 0.02, ch) * (1.0 - smoothstep(0.05, 0.09, ch));
    col += vec3(1.0, 0.92, 0.95) * I * (2.0 + 6.0 * uKick) * dash * aaLine(r - 0.5 * (RI + RO) - 0.8, 0.14, fp) * lit;
    // position lights round the rim
    float sa = (fract(a / TAU * 12.0 + 0.5) - 0.5) * circ / 12.0;
    col += vec3(1.0, 0.75, 0.45) * 3.0 * aaLine(length(vec2(sa, r - RO + 1.0)), 0.22, fp) * lit;
  } else {
    float zz = p.z - (k * RS + RPH);
    float fp = (tk + gTOff) * gPix / max(cosv, 0.1);
    col += rc * I * 5.0 * (aaLine(zz - 0.3, 0.1, fp) + aaLine(zz - RD + 0.3, 0.1, fp)) * lit;
    col += rc * I * 0.3 * lit;
  }
  return col;
}
vec3 gates(vec3 ro, vec3 rd, inout float t, inout vec3 surf, inout bool hit) {
  vec3 acc = vec3(0.0);
  if (rd.z <= 0.0) return acc;
  vec3 inv = safeInv(rd);
  float k0 = floor((ro.z - RPH - RD) / RS) + 1.0;          // first gate whose back is ahead
  vec2 o = ro.xy - vec2(0.0, RY);
  float A = dot(rd.xy, rd.xy), B = dot(o, rd.xy), C = dot(o, o) - RI * RI;
  float sExit = (-B + sqrt(max(B * B - A * C, 0.0))) / max(A, 1e-8);   // leaving the hole's cylinder
  for (int i = 0; i < 26; i++) {
    float k = k0 + float(i);
    float z0 = k * RS + RPH;
    float tk = (z0 - ro.z) / rd.z;
    if (tk > t) break;
    float T = fogT(ro, rd, max(tk, 0.0));
    // struts bolting the ring to the canyon walls
    vec3 sn;
    float bs = boxHit(ro, inv, vec3(-17.5, RY - 1.4, z0 + 0.4), vec3(-RO + 0.5, RY + 1.4, z0 + RD - 0.4), sn);
    vec3 sn2;
    float bs2 = boxHit(ro, inv, vec3(RO - 0.5, RY - 1.4, z0 + 0.4), vec3(17.5, RY + 1.4, z0 + RD - 0.4), sn2);
    if (bs2 < bs) { bs = bs2; sn = sn2; }
    float rk = 1e9;
    if (tk > 0.0) {
      vec3 p = ro + rd * tk;
      rk = length(p.xy - vec2(0.0, RY));
      if (rk > RI && rk < RO && tk < bs) {                  // front face
        surf = gateShade(p, rd, tk, k, 0); t = tk; hit = true; break;
      }
    }
    if (bs < t && bs < 1e8) {
      vec3 p = ro + rd * bs;
      float F = 0.04 + 0.96 * pow(1.0 - abs(dot(rd, sn)), 5.0);
      surf = vec3(0.004, 0.004, 0.006) + envRefl(reflect(rd, sn), p.y) * (0.03 + 0.4 * F);
      surf += (mod(k, 2.0) < 0.5 ? vec3(1.0, 0.06, 0.5) : vec3(0.05, 0.65, 1.0)) * gNeon * 3.0 * aaLine(p.y - RY + 1.2, 0.08, bs * gPix);
      t = bs; hit = true; break;
    }
    if (rk <= RI || tk <= 0.0) {                            // through the hole: its inner wall?
      float ze = ro.z + rd.z * sExit;
      if (sExit > 0.0 && sExit < t && ze > z0 && ze < z0 + RD) {
        surf = gateShade(ro + rd * sExit, rd, sExit, k, 1); t = sExit; hit = true; break;
      }
      // halo of the lip tube hanging in the haze, just inside the hole
      if (tk > 0.0) {
        vec3 rc = mod(k, 2.0) < 0.5 ? vec3(1.0, 0.06, 0.5) : vec3(0.05, 0.65, 1.0);
        float kickG = exp(-sq(k - nextGate() - 1.0) * 0.5) * uKick;
        acc += rc * gNeon * (1.0 + 2.5 * kickG) * 0.35 * exp(-(RI - rk) / 2.2) * T * smoothstep(18.0, 60.0, tk);
      }
    }
  }
  return acc;
}

// neon signs hazing the humid air: closest-approach glow round every sign ahead in the canyon
vec3 signHalos(vec3 ro, vec3 rd, float tHit) {
  vec3 acc = vec3(0.0);
  float z0 = floor((ro.z - 10.0) / CELL.y);
  for (int i = 0; i < 8; i++) {
    for (int sd = 0; sd < 2; sd++) {
      vec2 cell = vec2(sd == 0 ? 0.0 : -1.0, z0 + float(i));
      Bld b = building(cell);
      for (int j = 0; j < 3; j++) {
        vec3 slo, shi, sh;
        if (!signBox(cell, j, b.lo0, b.hi0, slo, shi, sh)) continue;
        vec3 C = 0.5 * (slo + shi) - ro;
        float tp = dot(C, rd);
        if (tp < 0.0 || tp > tHit + 4.0) continue;
        vec3 h = hash31(floor(sh.x * 997.0) + cell.y * 13.0 + float(j) * 3.0);
        vec3 c = step(0.55, fract(sh.x * 7.1)) > 0.5 ? neonPal(h.x * 3.3 + 0.37 + 0.2 * h.y) : neonPal(h.x * 3.3);
        float r = 0.35 * (shi.y - slo.y + shi.x - slo.x);
        float d2 = dot(C, C) - tp * tp;
        acc += c * (r * r / (d2 + r * r)) * igOn(C.z + ro.z) * fogT(ro, rd, tp);
      }
    }
  }
  return acc * 0.09 * gNeon;
}

vec3 primaryRay(vec3 ro, vec3 rd, float calm) {
  gSpires = gShot == 2;
  gSpireAcc = vec3(0.0);
  Hit h = traceCity(ro, rd, 14000.0, gShot == 2 ? 260 : 130);
  gSpires = false;
  vec3 inv = safeInv(rd);
  vec3 mn; float mt;
  float tm = megaHit(ro, inv, mn, mt);
  float tg = rd.y < 0.0 ? -ro.y / rd.y : 1e9;
  float t = min(min(h.t, tm), tg);
  int what = t > 1e8 ? 0 : (t == h.t ? 1 : (t == tm ? 2 : 3));
  vec3 fn; float fid;
  if (gShot == 2) {
    float tf = farHit(ro, inv, fn, fid);
    if (tf < t) { t = tf; what = 4; }
  }
  vec3 surf = vec3(0.0);
  bool hitRing = false;
  vec3 ringGlow = vec3(0.0);
  if (gShot == 3) ringGlow = gates(ro, rd, t, surf, hitRing);
  bool street = gShot == 0 || gShot == 3;
  if (!hitRing) {
    if (what == 0) surf = sky(ro, rd);
    else if (what == 1) {
      vec3 p = ro + rd * t;
      surf = shadeBuilding(p, h.n, rd, t, h.cell, h.part);
      if (street && (h.part > 0.5 && h.part < 1.5 || h.part > 4.5) && abs(h.n.y) < 0.5) {
        // glass curtain walls mirror the canyon: a real secondary trace
        float F = 0.04 + 0.96 * pow(1.0 - abs(dot(rd, h.n)), 5.0);
        gTOff = t;
        surf += reflRay(p + h.n * 0.05, reflect(rd, h.n), 32) * F * 0.6;
        gTOff = 0.0;
      }
    }
    else if (what == 2) surf = shadeMega(ro + rd * t, mn, rd, t, mt);
    else if (what == 4) surf = shadeFar(ro + rd * t, fn, rd, t, fid);
    else {
      vec3 p = ro + rd * t;
      float puddle;
      surf = groundBase(p, rd, t, calm, puddle);
      if (street) {
        // wet asphalt: anisotropic glossy lobe (long along the view, narrow across) so every
        // light smears into a vertical streak; stratified over the subframes per pixel
        vec2 al = normalize(rd.xz + 1e-6), ac = vec2(-al.y, al.x);
        float rA = mix(0.11, 0.025, puddle), rC = mix(0.010, 0.002, puddle);
        vec2 rip = vec2(vnoise(p.xz * 1.7 + uTime * 2.0), vnoise(p.xz * 1.7 + 9.0 - uTime * 2.0)) - 0.5;
        float F = 0.02 + 0.98 * pow(1.0 - max(-rd.y, 0.0), 5.0);
        float refl = mix(0.3, 1.0, F) * mix(0.55, 1.0, puddle);
        vec2 h0 = hash22(gl_FragCoord.xy * 0.913 + 3.7);
        gTOff = t;
        vec3 racc = vec3(0.0);
        for (int k = 0; k < 6; k++) {
          vec2 rj = fract(uSample.xy + h0 + float(k) * vec2(1.0 / 6.0, 0.618)) * 2.0 - 1.0;
          rj = rj * abs(rj);                                   // peaked lobe: bright core, long tail
          vec2 dn = al * (rj.x * rA) + ac * (rj.y * rC) + rip * 0.01;
          vec3 R = reflect(rd, normalize(vec3(dn.x, 1.0, dn.y)));
          R.y = max(R.y, 0.004);
          racc += reflRay(p + vec3(0.0, 0.02, 0.0), R, 48);
        }
        surf += racc * (1.0 / 6.0) * refl;
        gTOff = 0.0;
      } else if (gShot == 1) {
        surf += envRefl(reflect(rd, vec3(0.0, 1.0, 0.0)), 0.0) * 0.25;
      } else {
        surf += envRefl(reflect(rd, vec3(0.0, 1.0, 0.0)), 0.0) * 0.3;
      }
    }
  }
  if (hitRing) gGlowK = mix(0.4, 1.0, smoothstep(20.0, 40.0, t));
  vec3 col = applyFog(surf, ro, rd, t) * (1.0 - (gShot == 1 ? 0.85 : 0.7) * calm);
  gGlowK = 1.0;
  if (gShot == 0 && rd.z > 0.05) {
    // the ignition front: a thin sheet of light in the haze racing down the avenue
    float tf = (waveFront() - ro.z) / rd.z;
    if (tf > 0.0 && tf < t) {
      vec3 pf = ro + rd * tf;
      float fade = smoothstep(0.1, 0.25, gT) * (1.0 - smoothstep(0.9, 1.3, gT));
      col += vec3(1.0, 0.3, 0.85) * (3.0 / max(rd.z, 0.2)) * exp(-pf.y / 7.0) * fogT(ro, rd, tf) * fade * 0.02;
    }
  }
  vec3 halos = street ? signHalos(ro, rd, t) : vec3(0.0);
  col += (glowLines(ro, rd, t) + ringGlow + gSpireAcc + halos) * (1.0 - 0.9 * calm);
  return col;
}

// ---------------------------------------------------------------- camera
void camera(vec2 uv, out vec3 ro, out vec3 rd, out float focal) {
  float t = gT;
  mat3 cam;
  if (gShot == 0) {             // A: canyon rush at street level
    float z = 60.0 + 88.0 * t + 6.0 * t * t;
    ro = vec3(1.5 + 1.2 * sin(t * 1.4), 14.0 + 2.5 * t + 0.6 * sin(t * 2.3), z);
    vec3 fw = vec3(-0.03 + 0.03 * sin(t * 1.1), -0.07, 1.0);
    cam = lookAt(ro, ro + fw, 0.06 * sin(t * 1.6 + 0.4) - 0.03);
    focal = 1.25;
  } else if (gShot == 1) {      // B: dive down the facades, spinning, pulling onto the plaza
    float y = 900.0 - 280.0 * t - 67.5 * t * t;
    float ph = -0.9 + 0.75 * t;
    float R = 265.0 - 25.0 * t;
    ro = MEGA + vec3(R * sin(ph), y, -R * cos(ph));
    vec2 h = normalize(MEGA.xz - ro.xz);
    // the dive tips over to look straight down onto the landing medallion, still spinning
    float e = smoothstep(1.15, 1.9, t);
    vec3 fw = normalize(mix(vec3(h.x * 0.75, -1.0, h.y * 0.75), vec3(h.x * 0.06, -1.0, h.y * 0.06), e));
    vec3 upRef = normalize(mix(vec3(0.0, 1.0, 0.0), vec3(h.x, 0.0, h.y), e));
    cam = camBasis(fw, rotAxis(fw, -0.55 + 0.9 * t + 0.8 * e * e) * upRef);
    focal = 1.05;
  } else if (gShot == 2) {      // C: aerial over the grid
    float sw = easeInOut(t / 2.0);
    ro = vec3(-322.0 + 20.0 * t, 510.0 - 185.0 * sw, 1050.0 + 380.0 * t);
    vec3 ta = vec3(40.0 - 40.0 * sw, 520.0, MEGA.z);
    vec3 fw = normalize(ta - ro);
    fw.y -= 0.29 - 0.05 * sw;
    cam = lookAt(ro, ro + fw, -0.14 + 0.22 * sw);
    focal = 1.45;
  } else {                      // D: ring gates, accelerating into the cut, levelling off
    float z = 300.0 + 150.0 * t + 50.0 * t * t * t;
    float settle = smoothstep(1.55, 1.97, t);
    ro = vec3(0.6 * sin(t * 2.0) * (1.0 - settle), mix(RY - 2.0 + 2.0 * sin(t * 1.3), RY, settle), z);
    cam = lookAt(ro, ro + vec3(0.0, -0.02 * (1.0 - settle), 1.0), mix(-0.15 + 0.18 * t * t, 0.0, settle));
    focal = mix(1.3, 0.85, smoothstep(1.2, 2.0, t));
  }
  gMotZ = 0.0; gMotY = 0.0; gMotH = 0.0;
  if (gShot == 1) { gMotY = (280.0 + 120.0 * t) * (0.5 / 60.0); gMotH = 0.75 * (265.0 - 25.0 * t) * (0.5 / 60.0); }
  if (gShot == 0) gMotZ = (88.0 + 12.0 * t) * (0.5 / 60.0);
  if (gShot == 3) gMotZ = (150.0 + 150.0 * t * t) * (0.5 / 60.0);
  // the drop hits the camera: FOV punch on every kick, a small jolt on the claps
  focal *= 1.0 - 0.045 * uKick;
  vec2 jolt = vec2(sin(uBeat * 37.0), cos(uBeat * 23.0)) * 0.006 * uSnare;
  rd = normalize(cam * vec3(uv + jolt, focal));
  gCamZ = ro.z;
  gCamXY = ro.xy;
}

vec3 renderScene(vec2 fc) {
  float lt = uLocal + 0.005;          // choose the shot from the frame centre (subframes straddle cuts)
  gShot = int(clamp(floor(lt / 2.0), 0.0, 3.0));
  // per-pixel time jitter inside this subframe's shutter slot (180 deg, 8 spp): turns the
  // ghost ladders of very fast motion into a continuous streak. One phase per pixel per
  // frame, so each pixel's 8 samples stay evenly spaced (stratified).
  float tj = (hash12(floor(fc) * 0.7131 + fract(uFrame * 0.618) * 917.0) - 0.5) * (0.5 / 60.0 / 8.0);
  if (gShot == 3) tj *= 0.5;          // the prefilter carries the blur here
  gT = uLocal - float(gShot) * 2.0 + tj;
  // kick: neon pump; clap: the neon cuts out for a few frames (a negative strobe)
  gNeon = (0.7 + 0.3 * sat(uEnergy)) * (1.0 + 0.7 * uKick) * (1.0 - 0.85 * smoothstep(0.5, 0.85, uSnare));
  gStrobe = uSnare * uSnare;
  float kTau = -log(max(uKick, 1e-3)) / 8.0;   // seconds since the kick (score decays it at 8/s)
  gTOff = 0.0;
  gHmax = 500.0;
  gNeonDen = 1.0;
  gFogA = vec3(0.30, 0.05, 0.20);    // magenta haze
  gFogB = vec3(0.34, 0.12, 0.04);    // sodium haze
  gFogHi = vec3(0.02, 0.025, 0.07);
  gHorz = vec3(0.36, 0.07, 0.24); gHorzK = 14.0;
  gFogD = 0.0011; gFogH = 140.0;
  gGlowA = vec3(0.85, 0.12, 0.42) * 0.55;   // magenta street glow
  gGlowB = vec3(1.0, 0.42, 0.10) * 0.55;    // sodium street glow
  gGlowD = 0.0022; gGlowH = 28.0; gGlowMax = 3000.0;
  if (gShot == 1) {
    gFogD = 0.0012; gFogH = 110.0; gGlowD = 0.0018; gGlowH = 30.0; gGlowMax = 1500.0;
    gGlowA = vec3(0.85, 0.10, 0.55) * 0.5; gGlowB = vec3(0.45, 0.12, 0.9) * 0.45;
    gHorz = vec3(0.16, 0.035, 0.12); gNeonDen = 0.0;
  }
  if (gShot == 2) {
    gFogD = 0.0006; gFogH = 230.0; gGlowD = 0.0034; gGlowH = 35.0; gGlowMax = 2200.0;
    gFogA = vec3(0.40, 0.15, 0.05); gFogB = vec3(0.30, 0.06, 0.20); gFogHi = vec3(0.05, 0.03, 0.08);
    gHorz = vec3(0.46, 0.19, 0.075); gHorzK = 10.0;
    gGlowA = vec3(1.0, 0.38, 0.06) * 0.55; gGlowB = vec3(0.9, 0.12, 0.45) * 0.5;
    gNeonDen = 0.32;
    gWinBand = 0.12;                 // lit rooms twinkle rather than stacking into floor stripes
    gHmax = 560.0;                   // room for the spires
  }

  vec2 uv = screenUV(fc);
  vec3 ro, rd; float focal;
  camera(uv, ro, rd, focal);
  gPix = 2.0 / (uRes.y * focal);
  gKz = gShot == 1 ? 12.0 + 420.0 * kTau : gCamZ + 20.0 + 520.0 * kTau;

  // keep the label corner calm while the title is up (local 0.3-3.0 s)
  vec2 sp = fc / uRes;
  vec2 bq = max(abs(sp - vec2(0.27, 0.12)) - vec2(0.28, 0.07), 0.0);
  float calm = (1.0 - smoothstep(0.0, 0.07, length(bq))) * smoothstep(0.1, 0.35, uLocal) * (1.0 - smoothstep(2.85, 3.2, uLocal));
  vec3 col = primaryRay(ro, rd, calm);
  // sidechain: the mid-tones duck between kicks and swell on them
  float k2 = uKick * uKick;
  col *= gShot == 1 ? 0.88 + 0.22 * k2 : 0.85 + 0.27 * k2;
  return col;
}
</script>
<script type="x-shader" data-name="scene:cosmos">
//@label schwarzschild geodesics · doppler-beamed accretion disk
//@grade exposure=1.0 bloom=0.18 sat=1.1 contrast=1.05 vignette=0.42 ca=0.004 grain=0.018 tint=0.98,1,1.03 lift=0,0,0
// ============================================================================
// 04 COSMOS — a Schwarzschild black hole with a thin, Doppler-beamed accretion
// disk. Every pixel integrates a curved light ray backwards from the camera
// through the hole's gravity (units: Schwarzschild radius rs = 1). The orbit
// equation of light, u'' + u = 1.5 u^2, is reproduced exactly by a Newtonian
// particle under a = -1.5 h^2 x / r^5 (h = |x cross v|, conserved). The camera
// is a static observer: its local view angles are mapped to the ray's impact
// parameter b = r sin(psi) / sqrt(1 - 1/r), so near the horizon the sky really
// is squeezed into a shrinking cone. Each time the ray pierces the disk plane
// we composite the disk's emission there; rays that fall below r = 1 are
// captured (the shadow); the rest look up the sky in their final direction.
//
// Disk: one density field (sheared fBm streaks, Saturn-like ring gaps, orbit-
// aligned clumps, prefiltered hair-fine lanes) drives both emission and
// opacity, so gaps are truly empty. Colour is a hand-graded blackbody ramp on
// T * g (g = Doppler x gravitational redshift); brightness ~ x^2.7 g^2.6 runs
// the approaching inner rim far into HDR (blue-white, it blooms) while the
// outer disk stays saturated orange-red. In the close-up the disk becomes a
// flared slab (two surface sheets composited in ray order).
// Photon ring: the sub-pixel higher-order images (rays that wind around the
// photon sphere, b -> b_crit) are replaced by their analytic average, a
// Doppler-asymmetric hairline anti-aliased on the impact parameter.
// Sky: flux-conserving stars + a galactic band made of stars, fine star-cloud
// grain and crisp dust lanes, placed so it passes behind the hole in shot B
// and is lensed into arcs and an Einstein ring.
//
// Shots:  A 0-4 s  majestic approach, camera just above the disk plane;
//                  impact shock ring, then a gentle ripple on every kick
//         B 4-7 s  rise through the disk plane (edge-on razor at ~5 s), fly
//                  over the disk, then an accelerating dive into the shadow on
//                  the last beats of the build: the black swallows the frame
//         C 7-8 s  the plunge: a static observer at the horizon looking back
//                  out. The whole universe (stars, galaxy, the lensed disk)
//                  is a circle of light on black that shrinks, spinning, from
//                  white-gold to blue-white as the blueshift grows, into a
//                  point of light (the film's first frame in reverse), then black.
// ============================================================================

const float R_IN  = 2.35;   // inner disk edge (rs)
const float R_OUT = 12.5;   // outer disk edge (rs)
const float R_ESC = 90.0;   // ray escapes beyond this radius
const float BCRIT = 2.598076; // 3*sqrt(3)/2: critical impact parameter
const float HK    = 0.03;     // disk surface height / radius (flare)

// Per-pixel globals set in renderScene().
float gAnim;     // disk animation time (Keplerian phase)
float gBoost;    // global disk brightness
float gHeat;     // 0..1 drum build: the disk heats up
float gShock;    // impact shock ring amplitude
float gShockR;   // impact shock ring radius
float gKick;     // kick envelope (drives ripple radius)
float gRipple;   // kick-ripple strength
float gShift;    // observer blueshift 1/sqrt(1-1/r) (colour)
float gGainD;    // disk gain (exposure pull in the dive, boost in the plunge)
float gGainS;    // extra sky gain (plunge)
float gHueK;     // how much of the observer blueshift reaches the disk colour
float gThick;    // 0..1 weight of the disk's flared surface sheets (close-ups only)
float gStepK;    // step-size factor below r ~ 1.45 (finer for the plunge, deep in the potential)
bool  gSkip;     // skip the geodesic (pixel is fully masked); derivatives still run
float gFp;       // pixel-footprint magnification at the observer
float gPxRef;    // reference pixel angle (1080p) for flux-conserving stars
float gSigMin;   // star sigma floor (plunge: the sky mapping is too sharp for quad derivatives)
float gTemp;     // disk temperature scale (the dive cools the palette back to fire)

// ---------------------------------------------------------------------------
// LOD fBm: `lod` is the (fractional) number of octaves still above Nyquist.
float fbmLodG(vec3 p, float lod, float gain) {
  float a = 0.5, s = 0.0, w = 0.0;
  for (int i = 0; i < 6; i++) {
    float k = sat(lod - float(i));
    if (k <= 0.0) break;
    s += a * k * (gnoise(p) * 0.5 + 0.5) + a * (1.0 - k) * 0.5;
    w += a;
    p = p * 2.02 + vec3(11.3, 5.1, 7.7);
    a *= gain;
  }
  return w > 0.0 ? s / w : 0.5;
}
float fbmLod(vec3 p, float lod) { return fbmLodG(p, lod, 0.52); }

// Hand-graded blackbody ramp (linear RGB, max channel 1), log-temperature.
// The hot end is pushed toward a saturated blue so the Doppler-boosted side
// keeps its hue through the tonemap.
vec3 diskHue(float T) {
  float k = log2(clamp(T, 900.0, 60000.0));
  vec3 c = mix(vec3(0.55, 0.045, 0.004), vec3(1.0, 0.16, 0.02), sat((k - 10.23) / 0.58)); // 1200 -> 1800 K
  c = mix(c, vec3(1.0, 0.42, 0.08), sat((k - 10.81) / 0.83));  // -> 3200 K
  c = mix(c, vec3(1.0, 0.72, 0.35), sat((k - 11.64) / 0.70));  // -> 5200 K
  c = mix(c, vec3(1.0, 0.93, 0.85), sat((k - 12.34) / 0.53));  // -> 7500 K
  c = mix(c, vec3(0.50, 0.68, 1.0), sat((k - 12.87) / 0.68));  // -> 12000 K
  c = mix(c, vec3(0.40, 0.55, 1.0), sat((k - 13.55) / 1.06));  // -> 25000 K
  return c;
}

// Soft knee on disk radiance: linear to K0, then eases toward K0 + KR. Keeps
// the Doppler-boosted side below the point where ACES bleaches every hue.
const float K0 = 2.5, KR = 2.8;
float kneeI(float I) { return I < K0 ? I : K0 + KR * (1.0 - exp(-(I - K0) / KR)); }

// ---------------------------------------------------------------------------
// Accretion disk emission at a plane crossing.
// pc: crossing point, dir: unit ray direction (camera -> scene), fp: pixel footprint (rs).
// Returns premultiplied rgb + alpha.
vec4 diskSample(vec3 pc, vec3 dir, float fp, float layer) {
  float r = length(pc.xz);
  if (r < R_IN * 0.9 || r > R_OUT) return vec4(0.0);
  // One optical depth shared by the three sheets. The surface sheets fade out
  // at grazing incidence, so edge-on the disk stays a razor-thin line.
  float lay = abs(layer);
  float wl = smoothstep(0.03, 0.2, abs(dir.y)) * gThick;
  float frac = mix(1.0 - 0.6 * wl, 0.3 * wl, lay);
  if (frac < 1e-3) return vec4(0.0);
  float phi = atan(pc.z, pc.x);
  float x = R_IN / r;

  // Keplerian differential rotation: inner material laps the outer, so the
  // turbulence is sheared into trailing spiral filaments over time.
  float om = 0.55 * pow(x, 1.5);
  float a = phi - om * gAnim + 0.9 * layer;             // surface layers: decorrelated texture
  vec2 cs = vec2(cos(a), sin(a));
  float lr = log(r) + 0.013 * layer;

  // large-scale co-rotating domain warp
  vec3 wq = vec3(cs * 0.9, lr * 4.0);
  vec3 w = vec3(gnoise(wq + vec3(3.1, 0.0, 1.7)), gnoise(wq + vec3(-2.3, 5.5, 0.4)), gnoise(wq + vec3(7.7, -1.3, 2.2)));

  // 1. streaks: fBm stretched ~15:1 along the orbit, thresholded hard so the
  //    gaps between them are genuinely empty (stars / black show through).
  float lod = log2(0.25 / max(fp * 30.0 / r, 1e-5));
  float n = fbmLodG(vec3(cs * 2.6, lr * 30.0) + w * vec3(0.9, 0.9, 3.0), lod, 0.62);
  float fil = smoothstep(0.36, 0.62, n);
  float filO = smoothstep(0.42, 0.60, n);                // outer disk: filament or nothing, never fog
  // 2. ring gaps (Saturn-like), gently wavy, prefiltered by the footprint.
  //    In the close-up the inner gaps close so the near disk stays opaque at
  //    grazing angles (a lone gap there reads as a glint, not structure).
  float rk = fp * 9.0 / r;
  float rg = gnoise(vec3(lr * 9.0 + 0.5 * w.z, cs * 0.4 + 3.0));
  float rings = mix(smoothstep(-0.42, -0.06, rg), 0.8, smoothstep(0.15, 0.5, rk));
  rings = mix(rings, 1.0, gThick * (1.0 - smoothstep(8.0, 10.0, r)));
  // 3. co-rotating turbulent clumps (~0.5 rs), calmer in the outer disk
  //    (elongated ~3:1 along the orbit, the same physical size at every radius)
  vec3 q2 = vec3(cs * r * 0.8, r * 2.4 + 5.0);
  float c = fbmLodG(q2 + w * 0.6, log2(0.25 / max(fp * 2.4, 1e-5)) - 0.3, 0.6);
  float clump = mix(1.0, 0.45 + 1.1 * smoothstep(0.3, 0.75, c), mix(0.8, 0.4, smoothstep(5.0, 8.0, r)));
  // 4. razor-fine lanes: ridges along the zero set of strongly stretched
  //    noise (merge, split, vary in spacing like streamlines); each octave
  //    is prefiltered to its mean once it gets below a few pixels.
  float lw = fp / r;
  vec3 lq = vec3(cs * 0.7, lr * 70.0) + w * vec3(0.3, 0.3, 6.0);
  float l1 = pow(1.0 - abs(gnoise(lq)), 5.0);
  float l2 = pow(1.0 - abs(gnoise(lq * vec3(1.6, 1.6, 2.3) + vec3(0.0, 0.0, 17.0))), 5.0);
  l1 = mix(l1, 0.4, smoothstep(0.002, 0.006, lw));
  l2 = mix(l2, 0.4, smoothstep(0.0009, 0.0026, lw));
  float l3 = 0.4;
  if (lw < 0.0011) {   // third octave: hair-fine striations, only when resolved (close-ups)
    l3 = pow(1.0 - abs(gnoise(lq * vec3(2.5, 2.5, 5.3) + vec3(4.0, 1.0, 31.0))), 4.0);
    l3 = mix(l3, 0.4, smoothstep(0.0004, 0.0011, lw));
  }
  float lanes = (0.45 * l1 + 0.3 * l2 + 0.25 * l3) / 0.4;

  // Inner disk: dense, hot and fairly smooth. Outer disk: wispy filaments
  // separated by empty gaps.
  float outer = smoothstep(2.8, 7.5, r);
  float body = mix(0.55 + 0.45 * fil, (0.02 + 0.98 * filO) * rings, outer);
  body *= clump * mix(0.75 + 0.25 * lanes, 0.35 + 0.65 * lanes, outer);
  float edgeIn = smoothstep(R_IN * 0.9, R_IN * 1.2, r);
  float edgeOut = 1.0 - smoothstep(R_OUT * 0.6, R_OUT, r);
  float dens = edgeIn * edgeOut * body * frac;
  dens = max(dens, 0.35 * gThick * edgeIn * smoothstep(10.0, 7.5, r) * frac);

  // Relativistic Doppler + gravitational redshift; disk gas on circular orbits.
  vec3 vdir = normalize(vec3(-pc.z, 0.0, pc.x));
  float beta = min(0.62, sqrt(0.5 / max(r - 1.0, 0.3))) * 0.9;
  float cosT = dot(vdir, -dir);                        // toward the observer
  float gam = inversesqrt(1.0 - beta * beta);
  float D = 1.0 / (gam * (1.0 - beta * cosT));
  float gi = D * sqrt(max(1.0 - 1.0 / r, 0.05));

  // Temperature falls outward; the drum build heats the disk toward white-blue.
  float T = 7600.0 * gTemp * pow(x, 0.95) * (1.0 + gHeat * (0.08 + 0.4 * x * x));
  float Teff = T * pow(gi, 1.8) * pow(gShift, gHueK);   // hue follows g a bit more steeply than physics: a clear red / blue split
  vec3 hue = diskHue(Teff);
  // Doppler beaming + steep radial falloff: the approaching inner rim runs
  // far into HDR (it blooms), the outer disk stays below the ACES shoulder.
  float I = 10.0 * pow(x, 2.7) * pow(gi, 2.6) * gGainD;
  I = kneeI(I);                                        // soft knee: the core keeps its hue

  // Impact shock ring travelling outward through the disk.
  float sh = gShock * exp(-sq((r - gShockR) * 2.2)) * (0.5 + 0.9 * fil) * (1.0 - lay);
  // Kick ripples: every kick launches a ring of light outward through the disk.
  // Radius follows the kick envelope's own decay (1 -> 0), so no hit times are
  // hard-coded; strength grows with the drum build.
  float kr = R_IN + 0.6 + 7.5 * (1.0 - gKick);
  float rip = gRipple * gKick * exp(-sq((r - kr) * (2.6 + 2.0 * gThick))) * (0.4 + 1.0 * fil) * (1.0 - lay);

  float tau = dens * 6.0;
  // grazing path length is capped in the thin outer disk, so seen edge-on up
  // close it stays a translucent glow of filaments rather than a flat red veil
  float alpha = 1.0 - exp(-tau / max(abs(dir.y), mix(0.04, 0.22, smoothstep(6.0, 10.0, r))));
  vec3 e = hue * I * (0.15 + 0.85 * body) * gBoost;
  // the super-hot (blueshifted) part carries its colour into the bloom
  e *= mix(vec3(1.0), vec3(0.65, 0.84, 1.25), smoothstep(8500.0, 13000.0, Teff));
  e += vec3(0.55, 0.75, 1.0) * sh * 10.0 * edgeIn;
  e += hue * D * rip * 5.0 * edgeIn;
  alpha = max(alpha, sat(sh * 0.7 + rip * 0.5) * edgeIn);
  return vec4(e * alpha, alpha);
}

// ---------------------------------------------------------------------------
// Sky: procedural stars on a cube-map grid + a galactic band. Stars are
// flux-conserving: sigma follows the true (lensed) pixel footprint in the sky,
// and a layer whose stars get smaller than its cells fades to its mean.
vec3 starLayer(vec3 d, float cells, float prob, float sig, float fl, float seed, float magPow, float bright, float base) {
  vec3 ad = abs(d);
  vec2 uv; float face;
  if (ad.x > ad.y && ad.x > ad.z) { uv = d.yz / ad.x; face = d.x > 0.0 ? 0.0 : 1.0; }
  else if (ad.y > ad.z)           { uv = d.xz / ad.y; face = d.y > 0.0 ? 2.0 : 3.0; }
  else                            { uv = d.xy / ad.z; face = d.z > 0.0 ? 4.0 : 5.0; }
  // the mean radiance of the layer (what it prefilters to)
  float meanAmp = base + bright / (magPow + 1.0);
  vec3 mean = vec3(0.9, 0.93, 1.0) * prob * cells * cells * meanAmp * PI * sq(0.75 * gPxRef);
  float blend = smoothstep(0.12, 0.3, sig * cells);
  if (blend >= 1.0) return mean;
  vec2 g = uv * cells;
  vec2 id = floor(g), f = g - id;
  vec3 h = hash33(vec3(id, face * 7.0 + seed));
  vec3 s = vec3(0.0);
  if (h.z < prob) {
    vec2 sp = 0.2 + 0.6 * h.xy;
    float dist = length(f - sp) / cells;                 // ~radians (uv = tan of the angle)
    float mag = pow(hash12(id + seed * 3.1 + face), magPow);
    vec3 col = blackbody(min(mix(3300.0, 15000.0, pow(hash12(id * 1.7 + face + seed), 0.7)) * gShift, 40000.0));
    col /= max(luma(col), 0.05);
    s = col * (base + bright * mag) * fl * exp(-dist * dist / (sig * sig));
  }
  return mix(s, mean, blend);
}

// Galactic plane: passes straight behind the hole during shot B (~5 s),
// so it splits into two lensed arcs and an Einstein ring around the shadow.
const vec3 GAL_N = vec3(0.77, 0.39, -0.504);

vec3 sky(vec3 d, float lx, float ly) {
  float sig = max(max(0.75 * max(lx, ly), gSigMin), 2e-5);
  float fl = min(1.0, gPxRef * gPxRef / max(lx * ly, 1e-14));
  float pxs = max(max(lx, ly), gSigMin);
  // Galactic band (a Milky Way seen edge-on). Its structure is carried by
  // stars and fine grain, not by soft blobs: extra faint stars inside the
  // band, a grainy glow of unresolved star clouds (warm core, blue halo), and
  // crisp dark dust: a central rift plus filamentary lanes.
  vec3 N = normalize(GAL_N);
  vec3 E1 = normalize(cross(N, vec3(0.0, 1.0, 0.0)));
  vec3 E2 = cross(N, E1);
  float b = dot(d, N);                                   // galactic latitude (~rad)
  vec2 gl = vec2(dot(d, E1), dot(d, E2));                // in-plane direction (longitude)
  float wide = exp(-b * b * 22.0);
  float core = 0.0, dust = 0.0, cl = 1.0, gm = 1.0, bb = b;
  if (wide > 0.003) {
    bb = b + 0.035 * gnoise(vec3(gl * 2.2, 7.0));        // the band meanders
    core = exp(-bb * bb * 160.0);
    // star clouds: soft mid-scale brightness variation, elongated along the band
    float cld = fbmLodG(vec3(gl * 9.0, bb * 24.0) + 3.0, log2(0.4 / max(pxs * 24.0, 1e-6)), 0.58);
    cl = 0.35 + 1.4 * smoothstep(0.3, 0.72, cld);
    // fine grain of unresolved stars (a few px), low amplitude, prefiltered
    float g1 = fbmLodG(vec3(gl * 120.0, bb * 200.0) + 9.0, log2(0.5 / max(pxs * 200.0, 1e-6)), 0.65);
    gm = 0.55 + 0.9 * g1;
    // dust: dark lanes with crisp edges (widened only as far as the pixel
    // footprint requires) plus a central rift along the band
    vec2 dw = vec2(gnoise(vec3(gl * 6.0, bb * 20.0 + 2.0)), gnoise(vec3(gl * 6.0 + 5.0, bb * 20.0)));
    float dl = fbmLodG(vec3(gl * 4.5 + 0.08 * dw.x, bb * 52.0 + 0.9 * dw.y) + 11.0, log2(0.35 / max(pxs * 52.0, 1e-6)), 0.64);
    float ew = max(0.02, pxs * 52.0 * 0.6);
    float lanes = smoothstep(0.54 - ew, 0.54 + ew, dl) * exp(-bb * bb * 70.0);
    float rw = 0.011 + 0.007 * gnoise(vec3(gl * 3.0, 1.0));
    float rift = smoothstep(1.0, 0.5, abs(bb - 0.009 * gnoise(vec3(gl * 5.0, 4.0))) / max(rw, pxs));
    rift *= smoothstep(0.35, 0.6, fbmLod(vec3(gl * 4.0, 5.0), log2(0.1 / max(pxs * 4.0, 1e-6))));
    dust = sat(max(lanes, rift));
  }
  float dens = (core + 0.25 * wide) * (1.0 - dust) * cl;
  vec3 c = vec3(0.0);
  c += starLayer(d, 10.0, 0.70, sig, fl, 1.0, 5.0, 22.0, 0.05);
  c += starLayer(d, 28.0, 0.45 + 0.3 * dens, sig, fl, 2.0, 8.0, 4.0, 0.035);
  c += starLayer(d, 64.0, 0.08 + 0.6 * dens, sig, fl, 3.0, 6.0, 1.0, 0.035);
  if (dens > 0.02) c += starLayer(d, 150.0, min(0.95, 1.1 * dens), sig, fl, 4.0, 5.0, 0.6, 0.06);
  if (wide > 0.003) {
    // glow of unresolved stars: warm bulge-coloured core, blue halo; dust
    // absorbs it (reddening at the lane edges: blue goes first)
    vec3 g = vec3(1.0, 0.68, 0.38) * core * 0.10 + vec3(0.34, 0.52, 1.0) * wide * 0.045;
    c += g * cl * gm * (1.0 - dust * vec3(0.93, 0.965, 0.99));
  }
  // blueshift (plunge): everything drifts toward blue-white and brightens
  float lg = log2(max(gShift, 1.0));
  c *= pow(vec3(0.8, 0.92, 1.12), vec3(min(lg * 0.5, 2.5)));
  return c * gGainS;
}

// ---------------------------------------------------------------------------
// Geodesic tracer. bImp / bw: impact parameter and its per-pixel width; with
// bw > 0 the shadow edge is anti-aliased analytically (photon ring).
vec3 traceBH(vec3 ro, vec3 rd, float pxAng, float bImp, float bw) {
  vec3 p = ro, v = rd;
  vec3 L = cross(p, v);
  float h2 = dot(L, L);
  vec3 col = vec3(0.0);
  float trans = 1.0;
  float path = 0.0;
  float minR = 1e4;
  float order = 0.0;
  bool captured = false;
  bool escaped = false;
  // Distance of this pixel outside the critical curve, in pixels. Rays within
  // a few pixels of it wind around the photon sphere: their higher-order disk
  // images and their sky are sub-pixel chaos, replaced by the analytic ring.
  float xb = bw > 0.0 ? (bImp - BCRIT) / bw : 1e3;
  float w2 = smoothstep(1.5, 3.0, xb);
  float wS = smoothstep(0.5, 2.5, xb);
  // Inside the photon sphere an outgoing ray escapes iff b < b_crit: decide
  // capture analytically instead of trusting the integrator at the knife edge.
  if (length(ro) < 1.5 && h2 > BCRIT * BCRIT) captured = true;
  for (int i = 0; i < 420; i++) {
    if (captured || gSkip) break;
    float r2 = dot(p, p);
    float r = sqrt(r2);
    minR = min(minR, r);
    if (r < 1.0) { captured = true; break; }
    if (r > R_ESC && dot(p, v) > 0.0) { escaped = true; break; }
    float vl = length(v);
    float ds = clamp((0.035 * r + 0.003 * r2) * mix(gStepK, 1.0, smoothstep(1.12, 1.45, r)), 0.004, 10.0);
    float dt = ds / vl;
    vec3 acc = -1.5 * h2 * p / (r2 * r2 * r);
    vec3 vn = v + acc * dt;
    vec3 pn = p + vn * dt;
    // The disk is a flared slab: a dense midplane plus two thinner surface
    // sheets at y = +-HK*r. Crossings are composited in ray order (first
    // surface, midplane, far surface), which gives parallax and a soft,
    // volumetric edge up close while staying razor-thin from afar.
    float rp = length(p.xz), rn = length(pn.xz);
    if ((gThick > 0.0 && min(abs(p.y), abs(pn.y)) < HK * max(rp, rn) + 0.05) || p.y * pn.y < 0.0) {
      float sg = vn.y < 0.0 ? 1.0 : -1.0;                // first surface the ray meets
      for (int k = 0; k < 3; k++) {
        float lay = sg * float(1 - k);                     // +-1, 0, -+1
        float fa = p.y - lay * HK * rp, fb = pn.y - lay * HK * rn;
        if (fa * fb >= 0.0) continue;
        if (lay != 0.0 && rp < R_IN * 0.9 && rn < R_IN * 0.9) continue;
        float f = fa / (fa - fb);
        vec3 pc = mix(p, pn, f);
        float fp = (path + ds * f) * pxAng * gFp * (1.0 + order * 1.5 + order * 6.0 * smoothstep(2.6, 1.6, minR));
        vec4 e = diskSample(pc, normalize(vn), fp, lay);
        float wo = order > 1.5 ? w2 : 1.0;
        col += trans * e.rgb * wo;
        trans *= 1.0 - e.a * wo;
        if (lay == 0.0) order += 1.0;
      }
      if (trans < 0.01) break;
    }
    path += ds;
    p = pn; v = vn;
  }
  // true (lensed) sky footprint of this pixel, from screen-space derivatives
  vec3 d = normalize(v);
  float lx = length(dFdx(d)), ly = length(dFdy(d));
  // a ray that ran out of steps while still winding near b_crit is captured
  if (!escaped && bw > 0.0 && xb < 0.0) captured = true;
  if (!captured && trans > 0.01) col += trans * wS * sky(d, lx, ly);
  if (bw > 0.0) {
    // Analytic photon ring: the stacked higher-order images of the inner disk,
    // just outside b_crit. Photons circling in the disk's sense are beamed
    // (cos of the gas velocity to the photon = L.y / |L|).
    float s = L.y * inversesqrt(max(h2, 1e-8));
    float bt = 0.5;
    float Dr = sqrt(1.0 - bt * bt) / (1.0 - bt * s);
    float gr = Dr * 0.78;
    float Tr = 7600.0 * gTemp * (1.0 + 0.48 * gHeat) * pow(gr, 1.8) * pow(gShift, gHueK);
    float Ir = 10.0 * pow(gr, 2.6) * gGainD * gBoost;
    Ir = kneeI(Ir);
    float prof = exp(-sq((bImp - BCRIT * 1.003) / (1.1 * bw))) * min(1.0, 0.006 / bw);
    col += trans * diskHue(Tr) * Ir * prof;
  }
  return col;
}

// ---------------------------------------------------------------------------
// Static observer: local view direction -> coordinate direction for the
// tracer, preserving the impact parameter b = r sin(psi) / sqrt(k), k = 1-1/r.
vec3 staticToCoord(vec3 nObs, float r, float k, vec3 dl) {
  float c = dot(dl, nObs);
  vec3 tv = dl - nObs * c;
  float s2 = dot(tv, tv);
  float sa2 = s2 / (k + s2 / r);
  float sa = sqrt(sat(sa2));
  float ca = sqrt(max(1.0 - sa2, 0.0)) * (c < 0.0 ? -1.0 : 1.0);
  vec3 tn = s2 > 1e-14 ? tv * inversesqrt(s2) : vec3(0.0);
  return nObs * ca + tn * sa;
}

// ---------------------------------------------------------------------------
// The final point of light: the film's first frame played in reverse. Lens PSF
// ported verbatim from void.glsl (scene files cannot include each other).
vec3 vCorona(vec2 d, float r, float lenS, float t) {
  float th = atan(d.y, d.x);
  float px = 2.0 / uRes.y;
  vec3 acc = vec3(0.0);
  for (int k = 0; k < 3; k++) {
    float N  = k == 0 ? 61.0 : (k == 1 ? 149.0 : 347.0);
    float wA = k == 0 ? 0.0065 : (k == 1 ? 0.0038 : 0.0022);
    float Lk = k == 0 ? 1.0 : (k == 1 ? 0.65 : 0.4);
    float a = th / TAU * N;
    float ib = floor(a);
    float wEff = max(wA, 0.75 * px / max(r, 1e-4));
    for (int j = -1; j <= 1; j++) {
      float bb = ib + float(j);
      vec3 h = hash33(vec3(mod(bb, N), float(k) * 17.0 + 1.3, 3.7));
      float c = bb + 0.5 + (h.x - 0.5) * 0.9;
      float dA = (a - c) * TAU / N;
      float prof = exp(-dA * dA / (wEff * wEff)) * (wA / wEff);
      float len = lenS * Lk * (0.15 + 0.85 * h.y * h.y);
      float amp = h.z * h.z * (0.75 + 0.25 * sin(t * (0.9 + 1.7 * h.x) + h.y * TAU));
      acc += amp * prof * exp(-r / (len * vec3(1.1, 1.0, 0.88)));
    }
  }
  return acc / (r + 0.012);
}

vec3 vStarPSF(vec2 d, float P, vec3 sc, float flash, float build, float wo, float t) {
  float px = 2.0 / uRes.y;
  float r = length(d);
  float Pg = P / (1.0 + 0.3 * 26.0 * flash);
  vec3 rc = r / vec3(0.93, 1.0, 1.13);
  float cr = max(0.0035 * (1.0 + 1.8 * build + 3.0 * wo), 1.2 * px);
  float core = 1.0 - smoothstep(cr - px, cr + px, r);
  vec3 col = vec3(1.0, 0.97, 0.93) * core * 900.0 * Pg;
  float r1 = 0.0042 * (1.0 + 0.8 * build + 2.0 * wo);
  vec3 x2 = 1.0 + rc * rc / (r1 * r1);
  vec3 glare = 1.0 / (x2 * pow(x2, vec3(0.25)));
  col += sc * glare * 150.0 * Pg;
  vec3 halo = exp(-rc / (0.18 + 0.12 * build + 0.15 * wo)) * (1.0 - exp(-rc / 0.04));
  col += vec3(0.42, 0.68, 1.0) * halo * 0.035 * Pg;
  col += sc * flash * 0.012 * exp(-r * 2.5) * P;
  float lenS = 0.13 + 0.3 * flash + 0.2 * build + 0.35 * build * build;
  col += mix(sc, vec3(1.0), 0.25) * vCorona(d, r, lenS, t) * 0.4 * P;
  float ax = abs(d.x), ay = abs(d.y);
  float hl = max(0.0011, 0.7 * px);
  float line = exp(-ay / hl) * (0.0011 / hl);
  float wx = 0.3 + 0.8 * flash + 0.45 * build;
  float lx = exp(-ax / wx) * 0.7 + 0.3 / (1.0 + sq(ax / (0.12 * wx)));
  float band = exp(-ay / 0.02) * exp(-ax / (wx * 0.7));
  vec3 streakCol = mix(vec3(0.3, 0.58, 1.0), vec3(1.0, 0.92, 0.85), exp(-ax / 0.025));
  col += streakCol * (line * lx * 2.2 + band * 0.07) * P;
  return col;
}

// ---------------------------------------------------------------------------
// Camera. Internal cut A->B sits half a 60 fps frame before the bar line so no
// motion-blur shutter straddles it (the downbeat frame is already shot B).
const float CUT_B = 4.0 - 1.0 / 120.0;
const float CUT_C = 7.0 - 1.0 / 120.0;   // the plunge: on the last kick of the build

// Shot B's dive: 0 until 6.1 s, then accelerating into the shadow by the cut.
float diveAt(float t) { return easeInCubic(sat((t - 6.1) / 0.9)); }

void cameraAt(float t, out vec3 ro, out vec3 ta, out float roll, out float focal) {
  if (t < CUT_B) {
    // A: majestic approach, just above the disk plane; push + orbit run to the cut.
    float u = sat(t / 4.0);
    float e = 0.65 * easeOutCubic(u) + 0.35 * u;
    float dist = mix(25.0, 15.8, e);
    float az = 0.35 + 0.45 * u;
    float el = mix(0.16, 0.105, e);
    ro = dist * vec3(cos(el) * sin(az), sin(el), -cos(el) * cos(az));
    ta = vec3(0.0);
    roll = mix(-0.06, 0.02, e);
    focal = 1.9;
  } else {
    // B: rise from below the disk plane to above it (edge-on razor at ~5 s),
    // then fly in over the disk. The dolly runs in log-distance at an
    // exponentially growing rate, so it never stalls: a slow push through the
    // razor, faster over the disk, and a dive into the shadow on the last
    // beats of the build (14.8 -> 13.3 at 5 s -> 8.8 at 6.1 s -> 3.0 at 7 s).
    // The camera rises as it dives so the disk sweeps down out of frame while
    // the lensed far side wraps over the top; the lens widens (the shadow
    // swallows the frame) and the roll spins up into the plunge.
    float u = (t - 4.0) / 3.0;
    float uc = sat(u);
    float tb = clamp(t, 4.0, 7.05) - 4.0;
    float dist = exp(log(14.8) - 0.0473 * (exp(1.18 * tb) - 1.0));
    float dv = diveAt(t);
    float az = 2.15 + 0.75 * uc + 0.15 * uc * uc;
    float el = -0.095 + 0.30 * uc - 0.10 * uc * uc + 0.55 * dv;
    ro = dist * vec3(cos(el) * sin(az), sin(el), -cos(el) * cos(az));
    ta = vec3(0.0);
    roll = 0.55 - 0.41 * (0.6 * easeInOut(uc) + 0.4 * uc) - 0.4 * dv * dv;
    focal = mix(1.5, 1.15, dv);
  }
}

// Plunge: screen radius of the escape cone (the whole visible universe). It
// starts inside the frame (the circle reads from the first plunge frame) and
// collapses at an accelerating rate into the point at ~7.76 s.
float plungeRadius(float t) {
  float u = sat((t - 7.0) / 0.78);
  return 1.15 * pow(max(1.0 - pow(u, 1.3), 0.0), 1.5);
}

vec3 renderScene(vec2 fc) {
  float t = clamp(uLocal, -0.05, 8.05);
  vec2 p = screenUV(fc);
  float pxAng = 2.0 / uRes.y;

  // ---- music
  float inB = step(CUT_B, t) * (1.0 - step(CUT_C, t));
  gHeat = sat(0.7 * uRiser + 0.3 * smoothstep(4.0, 7.5, t)) * step(CUT_B, t);
  gBoost = t < CUT_B ? 1.0 + 0.4 * uImpact + 0.06 * uSnare
                     : min(1.15, 1.0 + 0.1 * uKick + 0.06 * uSnare + 0.08 * gHeat);
  gKick = sat(uKick);
  // kick ripples: gentle in the approach (once the impact shock has passed), growing with the build
  gRipple = t < CUT_B ? 0.22 * smoothstep(0.9, 1.2, t) : inB * (0.3 + 0.7 * gHeat);
  gAnim = t + 0.35 * sq(max(t - 4.0, 0.0));
  gShock = sq(uImpact) * (1.0 - step(CUT_B, t));
  gShockR = R_IN + 9.0 * pow(max(t, 0.0), 0.75);
  gGainD = 1.0; gGainS = 1.0; gFp = 1.0; gHueK = 0.2; gStepK = 1.0; gSkip = false; gSigMin = 0.0; gTemp = 1.0;
  // the disk shows its thickness only as the camera rises over it and closes in
  gThick = smoothstep(5.3, 6.2, t) * inB;
  gShift = 1.0;

  vec3 col = vec3(0.0);
  if (t < CUT_C) {
    vec3 ro, ta; float roll, focal;
    cameraAt(t, ro, ta, roll, focal);
    focal *= 1.0 + 0.04 * uKick * smoothstep(5.6, 6.3, t) * inB;   // kick punch-in during the dive
    // impact shake (decays with the impact envelope)
    float shk = uImpact * uImpact * (1.0 - step(CUT_B, t)) * 0.25;
    ta += shk * vec3(gnoise(vec3(t * 18.0, 0.0, 0.0)), gnoise(vec3(0.0, t * 18.0, 3.0)), 0.0);
    roll += shk * 0.08 * gnoise(vec3(5.0, 1.0, t * 14.0));
    mat3 cam = lookAt(ro, ta, roll);
    // gravitational-wave ripple: the impact's shock refracts the whole view
    vec2 q = p;
    if (t < CUT_B) {
      float Rw = 0.15 + 1.25 * max(t, 0.0);
      float lq = length(q);
      q += q / max(lq, 1e-3) * 0.012 * uImpact * sin(40.0 * (lq - Rw)) * exp(-sq((lq - Rw) * 6.0));
    }
    vec3 dl = normalize(cam * vec3(q, focal));
    float r0 = length(ro);
    float k0 = 1.0 - 1.0 / r0;
    gShift = inversesqrt(k0);
    gFp = gShift;
    gPxRef = 2.0 / 1080.0 / focal;
    // closing in, the white-hot inner disk would fill the frame: pull its
    // exposure (and a little of its temperature) down with distance, so the
    // dive stays a red-orange / blue-white Doppler split around the black
    float cl = smoothstep(11.0, 3.2, r0);
    gGainD = mix(1.0, 0.2, cl);
    // up close the kick ripples would sweep the whole near disk (a flash):
    // hand the kicks over to a lens punch-in instead
    gRipple *= 1.0 - 0.85 * cl;
    gTemp = mix(1.0, 0.9, cl);
    vec3 rd = staticToCoord(ro / r0, r0, k0, dl);
    // impact parameter and its pixel width (uniform control flow: fwidth is valid)
    float bImp = length(cross(ro, rd));
    float bw = max(fwidth(bImp), 1e-4);
    col = traceBH(ro, rd, pxAng / focal, bImp, bw);
  } else {
    // ---- C: the plunge. A static observer just above the horizon looks back
    // out. The escape cone (the entire outside universe) has half-angle psi_c:
    // sin(psi_c) = BCRIT * sqrt(1 - 1/r) / r. We choose its screen radius and
    // solve for r. Everything inside is blue-shifted by 1/sqrt(1 - 1/r).
    float focal = 1.5;
    float R = plungeRadius(t);
    float sinPc = sin(atan(max(R, 1e-4) / focal));
    // y = 1 - 1/r: sin(psi_c) = BCRIT * (1 - y) * sqrt(y); fixed-point solve (y < 1/3)
    float sy = sinPc / BCRIT;
    for (int i = 0; i < 6; i++) sy = sinPc / (BCRIT * (1.0 - sy * sy));
    float y = sy * sy;
    float rObs = 1.0 / (1.0 - y);
    float oel = 0.8, oaz = 2.4;
    vec3 nObs = vec3(cos(oel) * sin(oaz), sin(oel), -cos(oel) * cos(oaz));
    float tc = max(t - 7.0, 0.0);
    // the view spins (clockwise on screen, continuing the dive's roll) faster as it falls
    float spin = 0.4 + 2.2 * tc + 6.5 * tc * tc;
    vec2 ps = rot(spin) * p;
    mat3 cam = lookAt(vec3(0.0), nObs, 0.3);
    vec3 dl = normalize(cam * vec3(ps, focal));
    gShift = inversesqrt(max(y, 1e-7));
    // the sky and disk are squeezed into the cone: at its centre the view is
    // magnified by ~1/sqrt(1-1/r) = gShift, toward the rim far more (the whole
    // sky wraps into the last few percent). Footprints follow that analytic
    // Jacobian, which is smooth, unlike quad derivatives of the bent ray.
    float psiC = atan(max(R, 1e-4) / focal);
    gFp = 1.5 * max(gShift, 1.5707963 / psiC);
    gPxRef = 2.0 / 1080.0 / focal;
    float uu = length(p) / max(R, 1e-4);
    gSigMin = 0.9 * pxAng / focal * gShift * (1.0 + 2.0 * uu * uu);
    float pk = smoothstep(7.0, 7.62, t);
    float kk = sat(uKick);
    gGainD = mix(0.9, 1.8, pk * pk) * (0.8 + 0.2 * log2(gShift)) * (1.0 + 0.6 * kk);
    // the blueshift reaches the colours progressively: white-gold at the cut, blue-white by ~7.5
    gHueK = mix(0.12, 0.6, smoothstep(7.0, 7.5, t));
    gGainS = (1.0 + 0.6 * log2(gShift)) * (1.0 + 0.5 * kk);
    gAnim = 7.0 + 0.35 * 9.0 + 4.0 * tc;
    gStepK = 0.2;
    vec3 rd = staticToCoord(nObs, rObs, y, dl);
    // The outer part of the cone holds rays skimming the photon sphere:
    // neighbouring pixels wind a chaotically different number of times, so the
    // traced image there is sub-pixel noise. Replace it with its average: a
    // smooth, bright photon ring hugging the edge of the escape cone.
    float u = length(p) / max(R, 1e-4);
    gSkip = u >= 0.955;           // masked below anyway: don't spend 400 steps there
    col = traceBH(nObs * rObs, rd, pxAng / focal, 0.0, -1.0);
    col *= 1.0 - smoothstep(0.88, 0.955, u);
    // the diffuse light of the whole sky, squeezed into the cone and
    // blue-shifted: the circle reads as a disc of light, not just a ring
    float inCone = 1.0 - smoothstep(0.93, 0.97, u);
    col += vec3(0.32, 0.5, 1.0) * 0.022 * pow(gShift, 1.25) * (0.35 + 0.65 * u * u) * inCone * (1.0 + 0.8 * kk);
    // the photon ring on the cone's edge: a crisp core plus a soft glow
    float px = pxAng / max(R, 1e-4);
    float wr = max(0.012, 1.3 * px);
    vec3 ringCol = diskHue(6000.0 * pow(gShift, gHueK));
    float ring = exp(-sq((u - 0.955) / wr)) * min(1.0, 0.012 / wr)
               + 0.22 * exp(-sq((u - 0.95) / (3.5 * wr))) * min(1.0, 0.012 / wr);
    col += ringCol * (1.4 + 2.5 * pk + 4.0 * kk) * ring;
    // the cone's content hands over to the point as it drops below a few pixels
    col *= smoothstep(0.012, 0.05, R);

    // ---- the point of light: the film's first frame, played backwards. The
    // flare peaks as the reverse whoosh ends (7.75); the silence holds a tiny

  catch (e) { msg.textContent = e.message; return; }
  const errs = Object.entries(engine.compileErrors);
  if (errs.length) console.error(errs.map(([k, v]) => k + ': ' + v).join('\n'));

  const ASPECT = 16 / 9;
  let scale = 0.75;
  function layout() {
    const side = codeWidth();
    document.body.style.paddingRight = side + 'px';
    document.getElementById('bar').style.right = side + 'px';
    const vw = innerWidth - side, vh = innerHeight;
    const cw = Math.min(vw, vh * ASPECT), ch = cw / ASPECT;
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    const dpr = Math.min(devicePixelRatio || 1, 2);
    engine.resize(cw * dpr * scale, ch * dpr * scale);
  }
  addEventListener('resize', layout);
  layout();

  // Synthesize the soundtrack before the first click (takes a moment).
  let song = null;
  setTimeout(() => {
    const t0 = performance.now();
    song = EX.synth.renderSong(48000);
    msg.textContent = 'click to begin  ·  sound on';
    console.log(`soundtrack synthesized in ${(performance.now() - t0).toFixed(0)} ms`);
  }, 30);

  // ---- Video-style transport: play/pause, seekable progress bar, scene markers. ----
  const DUR = EX.timeline.duration;
  const bar = document.getElementById('bar'), track = document.getElementById('track');
  const fill = document.getElementById('fill'), knob = document.getElementById('knob');
  const playBtn = document.getElementById('play'), timeEl = document.getElementById('time');
  for (const s of EX.timeline.scenes) {
    if (s.start <= 0) continue;
    const m = document.createElement('div');
    m.className = 'mark'; m.style.left = (s.start / DUR * 100) + '%';
    if (s.title) m.title = s.title;
    track.appendChild(m);
  }

  let ctx = null, buf = null, src = null, startAt = 0, pos = 0;
  let playing = false, started = false, dirty = true, scrubbing = false, resumeAfterScrub = false;
  let frame = 0, last = 0, avg = 16;
  const clamp = (t) => Math.min(DUR, Math.max(0, t));
  const fmt = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
  const now = () => playing ? ctx.currentTime - startAt - (ctx.outputLatency || 0) : pos;

  function stopAudio() {
    if (!src) return;
    try { src.stop(); } catch (e) {}
    src.disconnect(); src = null;
  }
  function play(from = pos) {
    if (!song) return;
    if (from >= DUR - 0.05) from = 0;
    ctx = ctx || new AudioContext({ latencyHint: 'playback' });
    if (!buf) {
      buf = ctx.createBuffer(2, song.left.length, song.sampleRate);
      buf.copyToChannel(song.left, 0); buf.copyToChannel(song.right, 1);
    }
    stopAudio();
    src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    const when = ctx.currentTime + 0.05;
    src.start(when, from);
    startAt = when - from;
    pos = from; playing = true; last = 0;
    ctx.resume();
    poke();
  }
  function pause() {
    if (!playing) return;
    pos = clamp(now()); playing = false; dirty = true;
    stopAudio(); poke();
  }
  const toggle = () => playing ? pause() : play();
  function seek(t) {
    t = clamp(t);
    if (playing) play(t); else { pos = t; dirty = true; }
  }

  function updateBar(t) {
    const p = (clamp(t) / DUR * 100) + '%';
    fill.style.width = p; knob.style.left = p;
    timeEl.textContent = fmt(clamp(t)) + ' / ' + fmt(DUR);
    playBtn.textContent = playing ? '❚❚' : (pos >= DUR ? '↺' : '▶');
  }

  // Auto-hide controls and cursor while playing and idle.
  let idleTimer = 0;
  function poke() {
    if (!started) return;
    bar.classList.remove('off'); document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (playing && !scrubbing) { bar.classList.add('off'); document.body.classList.add('idle'); }
    }, 2500);
  }
  addEventListener('pointermove', poke);

  // Scrubbing: pause audio while dragging, render the frame under the pointer, resume on release.
  const timeAt = (e) => { const r = track.getBoundingClientRect(); return (e.clientX - r.left) / r.width * DUR; };
  track.addEventListener('pointerdown', (e) => {
    track.setPointerCapture(e.pointerId);
    scrubbing = true; resumeAfterScrub = playing || pos >= DUR;
    pause(); seek(timeAt(e));
  });
  track.addEventListener('pointermove', (e) => {
    track.title = fmt(clamp(timeAt(e)));
    if (scrubbing) seek(timeAt(e));
  });
  const endScrub = () => {
    if (!scrubbing) return;
    scrubbing = false;
    if (resumeAfterScrub && pos < DUR) play(pos);
    poke();
  };
  track.addEventListener('pointerup', endScrub);
  track.addEventListener('pointercancel', endScrub);
  playBtn.addEventListener('click', () => { toggle(); playBtn.blur(); });
  canvas.addEventListener('click', () => { if (started) toggle(); });

  function loop(ts) {
    requestAnimationFrame(loop);
    const t = now();
    if (playing && t >= DUR) { pos = DUR; playing = false; stopAudio(); poke(); }
    if (playing || dirty) {
      engine.renderFrame(clamp(t), { spp: 1, frame: frame++ });
      dirty = false;
    }
    // Dynamic resolution: hold ~60 fps (only measured while playing).
    if (playing && last) {
      avg = avg * 0.92 + (ts - last) * 0.08;
      if (frame % 30 === 0) {
        const prev = scale;
        if (avg > 19) scale = Math.max(0.3, scale * 0.9); else if (avg < 15.5) scale = Math.min(1, scale * 1.05);
        if (prev !== scale) layout();
      }
    }
    last = playing ? ts : 0;
    updateBar(t);
    updateCode(t);
  }

  // ---- Show the code: the GLSL of the scene on screen, following the playhead. ----
  function codeWidth() {
    const el = document.getElementById('code');
    return el && el.classList.contains('on') ? el.offsetWidth : 0;
  }
  const code = document.getElementById('code'), codeHead = document.getElementById('codeHead');
  const codeBody = document.getElementById('codeBody'), codeBtn = document.getElementById('codeBtn');
  const KW = new Set('const uniform in out inout return if else for while do break continue struct discard true false precision highp mediump lowp'.split(' '));
  const TY = new Set('void bool int uint float vec2 vec3 vec4 ivec2 ivec3 ivec4 uvec2 uvec3 bvec2 bvec3 mat2 mat3 mat4 sampler2D'.split(' '));
  const FN = new Set(('sin cos tan asin acos atan pow exp exp2 log log2 sqrt inversesqrt abs sign floor ceil fract mod min max clamp mix ' +
    'step smoothstep length distance dot cross normalize reflect refract texture textureLod texelFetch dFdx dFdy fwidth ' +
    'isnan isinf floatBitsToUint uintBitsToFloat round trunc transpose inverse determinant').split(' '));
  const TOKEN = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(^[ \t]*#[^\n]*)|(\b\d+\.?\d*(?:[eE][+-]?\d+)?u?\b|\.\d+(?:[eE][+-]?\d+)?\b)|([A-Za-z_]\w*)/gm;
  const esc = (x) => x.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function highlight(src) {
    let out = '', last = 0;
    for (const m of src.matchAll(TOKEN)) {
      out += esc(src.slice(last, m.index));
      last = m.index + m[0].length;
      const cls = m[1] ? 'c' : m[2] ? 'p' : m[3] ? 'n' : KW.has(m[4]) ? 'k' : TY.has(m[4]) ? 't' : FN.has(m[4]) ? 'f' : '';
      const txt = esc(m[0]);
      // Block comments may span lines: close and reopen the span at each newline.
      out += cls ? `<span class="${cls}">${txt.replace(/\n/g, `</span>\n<span class="${cls}">`)}</span>` : txt;
    }
    out += esc(src.slice(last));
    return out.split('\n').map((l) => `<span class="l">${l}</span>`).join('');
  }
  const sceneAt = (t) => EX.timeline.scenes.find((sc) => t < sc.end) || EX.timeline.scenes[EX.timeline.scenes.length - 1];
  let codeScene = null, codeLines = null, curLine = -1, followAfter = 0;
  function updateCode(t) {
    if (!code.classList.contains('on')) return;
    t = clamp(t);
    const sc = sceneAt(t);
    if (sc.id !== codeScene) {
      codeScene = sc.id;
      const src = EX.glsl.scenes[sc.id] || '';
      const name = sc.title ? `${sc.num} ${sc.title}` : sc.id.toUpperCase();
      codeHead.innerHTML = `<span><b>${name}</b> · scene:${sc.id} · ${src.split('\n').length} lines of GLSL</span><span>C to close</span>`;
      codeBody.innerHTML = highlight(src);
      codeLines = codeBody.children; curLine = -1;
      codeBody.scrollTop = 0;
    }
    // A cursor line walks through the shader as the scene plays; the view follows it
    // unless the reader has just scrolled by hand.
    const p = Math.min(0.9999, Math.max(0, (t - sc.start) / (sc.end - sc.start)));
    const line = Math.floor(p * codeLines.length);
    if (line !== curLine) {
      codeLines[curLine]?.classList.remove('cur');
      codeLines[line]?.classList.add('cur');
      curLine = line;
    }
    if (performance.now() > followAfter && codeLines[line]) {
      const target = codeLines[line].offsetTop - codeBody.clientHeight * 0.35;
      codeBody.scrollTop += (target - codeBody.scrollTop) * 0.12;
    }
  }
  const holdFollow = () => { followAfter = performance.now() + 4000; };
  codeBody.addEventListener('wheel', holdFollow, { passive: true });
  codeBody.addEventListener('pointerdown', holdFollow);
  function toggleCode() {
    code.classList.toggle('on');
    codeBtn.classList.toggle('on', code.classList.contains('on'));
    codeScene = null; followAfter = 0;
    layout(); dirty = true;
  }
  codeBtn.addEventListener('click', () => { toggleCode(); codeBtn.blur(); });

  // ---- Export: re-render the film offline at video quality and encode an MP4 with WebCodecs. ----
  const exp = document.getElementById('exp'), expCanvas = document.getElementById('expCanvas');
  const expGo = document.getElementById('expGo'), expClose = document.getElementById('expClose');
  const expStatus = document.getElementById('expStatus'), expFill = document.getElementById('expFill');
  let expEngine = null, expJob = null, expUrl = null;
  const nextTask = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = r; c.port2.postMessage(0); });
  const fmtMin = (sec) => sec >= 60 ? Math.floor(sec / 60) + ' min ' + String(Math.round(sec % 60)).padStart(2, '0') + ' s' : Math.round(sec) + ' s';
  const bytes = (dv) => dv instanceof ArrayBuffer ? new Uint8Array(dv.slice(0)) : new Uint8Array(dv.buffer.slice(dv.byteOffset, dv.byteOffset + dv.byteLength));

  function openExport() {
    if (!started) return;
    pause();
    exp.classList.add('on');
    if (!window.VideoEncoder || !window.AudioEncoder) {
      expStatus.textContent = 'This browser has no WebCodecs encoder. Try a recent Chrome or Edge.';
      expGo.disabled = true;
    }
  }
  function closeExport() {
    if (expJob) { expJob.cancelled = true; return; }
    exp.classList.remove('on');
  }
  document.getElementById('expBtn').addEventListener('click', (e) => { e.currentTarget.blur(); openExport(); });
  expClose.addEventListener('click', closeExport);
  expGo.addEventListener('click', () => { if (!expJob) runExport(); });

  async function pickConfig(Enc, base, codecs) {
    for (const codec of codecs) {
      const cfg = { ...base, codec };
      try { if ((await Enc.isConfigSupported(cfg)).supported) return cfg; } catch (e) {}
    }
    return null;
  }

  async function runExport() {
    const [w, h] = document.getElementById('expRes').value.split('x').map(Number);
    const fps = +document.getElementById('expFps').value, spp = +document.getElementById('expSpp').value;
    const job = expJob = { cancelled: false };
    exp.classList.add('busy'); expGo.disabled = true; expClose.textContent = 'Cancel'; expFill.style.width = '0';
    if (expUrl) { URL.revokeObjectURL(expUrl); expUrl = null; }
    let venc = null, aenc = null;
    try {
      const vcfg = await pickConfig(VideoEncoder,
        { width: w, height: h, framerate: fps, bitrate: Math.round(w * h * fps * 0.12), avc: { format: 'avc' } },
        ['avc1.640034', 'avc1.640033', 'avc1.64002A', 'avc1.640028', 'avc1.4D4033', 'avc1.42E034']);
      if (!vcfg) throw new Error(`This browser cannot encode H.264 at ${w} × ${h}.`);
      const SR = song.sampleRate;
      const abase = { sampleRate: SR, numberOfChannels: 2, bitrate: 192000 };
      const acfg = await pickConfig(AudioEncoder, abase, ['mp4a.40.2']) || await pickConfig(AudioEncoder, abase, ['opus']);
      if (!acfg) throw new Error('This browser cannot encode AAC or Opus audio.');

      if (!expEngine) {
        expStatus.textContent = 'compiling shaders…';
        await new Promise((r) => setTimeout(r, 30));
        expEngine = EX.createEngine(expCanvas, { preserve: true });
      }
      expEngine.resize(w, h);

      // Audio first: it is the same synth output the live page plays.
      const audio = { kind: 'audio', codec: acfg.codec === 'opus' ? 'opus' : 'aac', timescale: SR, channels: 2,
        bitrate: 192000, chunks: [], ts: [], lastDur: 0, description: null };
      let encErr = null;
      aenc = new AudioEncoder({
        output: (c, meta) => {
          if (meta?.decoderConfig?.description) audio.description = bytes(meta.decoderConfig.description);
          const b = new Uint8Array(c.byteLength); c.copyTo(b);
          audio.chunks.push(b); audio.ts.push(c.timestamp); audio.lastDur = c.duration || 0;
        },
        error: (e) => { encErr = e; },
      });
      aenc.configure(acfg);
      const N = song.left.length, BLOCK = 4800;
      for (let o = 0; o < N; o += BLOCK) {
        const n = Math.min(BLOCK, N - o), data = new Float32Array(n * 2);
        data.set(song.left.subarray(o, o + n), 0); data.set(song.right.subarray(o, o + n), n);
        const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2,
          timestamp: Math.round(o / SR * 1e6), data });
        aenc.encode(ad); ad.close();
      }
      await aenc.flush(); aenc.close(); aenc = null;
      if (encErr) throw encErr;
      if (!audio.description && audio.codec === 'aac') throw new Error('The AAC encoder gave no decoder config.');
      const us = (x) => Math.round(x * SR / 1e6);
      audio.durations = audio.ts.map((t, i) => i + 1 < audio.ts.length ? us(audio.ts[i + 1]) - us(t) : us(audio.lastDur) || 1024);
      // Encoders prepend priming silence. Chrome reports it either as a negative first timestamp or
      // not at all; then use the codec's standard delay (AAC-LC: 2112 samples, Opus: its pre-skip).
      const first = us(audio.ts[0] || 0), d = audio.description;
      audio.skip = first < 0 ? -first
        : audio.codec === 'aac' ? 2112
        : d && d.length >= 12 ? d[10] | (d[11] << 8) : 312;
      audio.length = N;

      // Video: every frame rendered from scratch at the chosen samples per pixel.
      const VTS = 90000, total = Math.round(DUR * fps);
      const video = { kind: 'video', timescale: VTS, width: w, height: h, chunks: [], keys: [], description: null,
        durations: new Array(total).fill(VTS / fps), skip: 0 };
      venc = new VideoEncoder({
        output: (c, meta) => {
          if (meta?.decoderConfig?.description) video.description = bytes(meta.decoderConfig.description);
          const b = new Uint8Array(c.byteLength); c.copyTo(b);
          if (c.type === 'key') video.keys.push(video.chunks.length);
          video.chunks.push(b);
        },
        error: (e) => { encErr = e; },
      });
      venc.configure(vcfg);
      const t0 = performance.now();
      for (let i = 0; i < total; i++) {
        if (job.cancelled) throw new Error('cancelled');
        if (encErr) throw encErr;
        expEngine.renderFrame(i / fps, { spp, fps, shutter: 0.5, frame: i });
        const vf = new VideoFrame(expCanvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
        venc.encode(vf, { keyFrame: i % (fps * 2) === 0 });
        vf.close();
        // Wait on the encoder's own event, not a timer: timers are throttled in background tabs.
        while (venc.encodeQueueSize > 3) await new Promise((r) => venc.addEventListener('dequeue', r, { once: true }));
        const done = i + 1, el = (performance.now() - t0) / 1000;
        expFill.style.width = (done / total * 100) + '%';
        expStatus.textContent = `frame ${done} / ${total}` + (done > 5 ? `  ·  ${fmtMin(el / done * (total - done))} left` : '');
        await nextTask();
      }
      expStatus.textContent = 'finishing…';
      await venc.flush(); venc.close(); venc = null;
      if (encErr) throw encErr;
      if (video.chunks.length !== total || !video.description) throw new Error('The video encoder dropped frames.');

      const blob = EX.mp4([video, audio]);
      expUrl = URL.createObjectURL(blob);
      const name = `ex-nihilo-${h}p${fps}.mp4`;
      const a = document.createElement('a');
      a.href = expUrl; a.download = name; a.textContent = 'save again';
      expStatus.textContent = `${name} · ${(blob.size / 1048576).toFixed(1)} MB · rendered in ${fmtMin((performance.now() - t0) / 1000)} · `;
      expStatus.appendChild(a);
      a.click();
    } catch (e) {
      expStatus.textContent = e.message === 'cancelled' ? 'cancelled' : 'export failed: ' + e.message;
      if (e.message !== 'cancelled') console.error(e);
    } finally {
      try { venc?.close(); } catch (e) {}
      try { aenc?.close(); } catch (e) {}
      expJob = null;
      exp.classList.remove('busy'); expGo.disabled = false; expClose.textContent = 'Close';
    }
  }

  function start() {
    if (!song || started) return;
    started = true;
    ui.classList.add('hide');
    play(0);
    requestAnimationFrame(loop);
  }
  ui.addEventListener('click', start);
  addEventListener('resize', () => { dirty = true; });
  addEventListener('keydown', (e) => {
    if (e.key === 'f') document.documentElement.requestFullscreen?.();
    if (!started || e.metaKey || e.ctrlKey || e.altKey) return;
    if (exp.classList.contains('on')) { if (e.key === 'Escape') closeExport(); return; }
    if (e.key === 'c') { toggleCode(); return; }
    if (e.key === 'e') { openExport(); return; }
    const step = e.shiftKey ? 0.1 : 2;
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowLeft') seek(now() - step);
    else if (e.key === 'ArrowRight') seek(now() + step);
    else if (e.key === 'Home') seek(0);
    else if (e.key === 'End') seek(DUR);
    else return;
    poke();
  });
}
})();
</script>
</body>
</html>
